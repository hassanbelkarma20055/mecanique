us der Ölwanne an und setzt es unter Druck.","ar":"تسحب الزيت من الحوض وتضغطه."},"au":"45aea77e893c"},{"a":"der","de":"Ölfilter","fr":"4. Filtre à huile","ar":"مرشح الزيت","r":{"fr":"Élimine les impuretés fines pour garder l’huile propre.","de":"Entfernt feine Verunreinigungen, damit das Öl sauber bleibt.","ar":"يزيل الشوائب الدقيقة للحفاظ على نظافة الزيت."},"au":"345e17d969d3"},{"a":"das","de":"Überdruckventil","fr":"5. Soupape de décharge","ar":"صمام تنظيم الضغط","r":{"fr":"Limite la pression d’huile et renvoie l’excédent au carter.","de":"Begrenzt den Öldruck und leitet den Überschuss zur Ölwanne zurück.","ar":"يحدّ من ضغط الزيت ويعيد الزائد إلى الحوض."},"au":"b7cb88301394"},{"a":"der","de":"Ölkühler","fr":"6. Refroidisseur d’huile","ar":"مبرّد الزيت","r":{"fr":"Refroidit l’huile pour maintenir sa température idéale.","de":"Kühlt das Öl, um die ideale Temperatur zu halten.","ar":"يبرّد الزيت للحفاظ على درجة حرارته المثلى."},"au":"4eefd16ca0e5"},{"a":"die","de":"Hauptölgalerie","fr":"7. Galerie principale d’huile","ar":"المجرى الرئيسي للزيت","r":{"fr":"Distribue l’huile sous pression vers les différents organes.","de":"Verteilt das Öl unter Druck auf die verschiedenen Bauteile.","ar":"يوزّع الزيت المضغوط نحو الأعضاء المختلفة."},"au":"60e62edb4005"},{"a":"das","de":"Kurbelwellenlager","fr":"8. Paliers de vilebrequin","ar":"مساند عمود المرفق","r":{"fr":"Réduisent la friction entre le vilebrequin et le bloc moteur.","de":"Verringern die Reibung zwischen Kurbelwelle und Motorblock.","ar":"تقلل الاحتكاك بين عمود المرفق وكتلة المحرك."},"au":"9d9efa973af9"},{"a":"das","de":"Pleuellager","fr":"9. Paliers de bielle","ar":"مساند ذراع التوصيل","r":{"fr":"Réduisent la friction entre la bielle et le maneton du vilebrequin.","de":"Verringern die Reibung zwischen Pleuel und Hubzapfen der Kurbelwelle.","ar":"تقلل الاحتكاك بين ذراع التوصيل ومحور عمود المرفق."},"au":"db27a553bc2b"},{"a":"die","de":"Nockenwelle","fr":"10. Arbre à cames","ar":"عمود الكامات","r":{"fr":"Lubrifie les cames et les paliers pour réduire l’usure.","de":"Schmiert die Nocken und Lager, um Verschleiß zu verringern.","ar":"يزيّت الكامات والمساند لتقليل التآكل."},"au":"ebcf974625eb"},{"a":"der","de":"Hydrostößel","fr":"11. Poussoirs hydrauliques","ar":"الرافعات الهيدروليكية","r":{"fr":"Assurent le fonctionnement hydraulique et réduisent l’usure (soupapes sans jeu).","de":"Sorgen für hydraulischen Ventilspielausgleich und verringern den Verschleiß.","ar":"تضمن العمل الهيدروليكي وتقلل التآكل (صمامات بدون خلوص)."},"au":"0bc5f80a93d2"},{"a":"das","de":"Manometer","fr":"12. Manomètre de pression d’huile","ar":"مقياس ضغط الزيت","r":{"fr":"Indique la pression d’huile pour contrôler le bon fonctionnement.","de":"Zeigt den Öldruck an, um die einwandfreie Funktion zu kontrollieren.","ar":"يشير إلى ضغط الزيت لمراقبة حسن الأداء."},"au":"de1c244ba76a"}]},{"t":"terms","h":{"fr":"Autres mots du cours","de":"Weitere Wörter aus dem Unterricht","ar":"كلمات أخرى من الدرس"},"items":[{"a":"die","de":"Ölspritzdüse","fr":"Gicleur de cylindre","ar":"رشاش الأسطوانة (المرذاذ)","r":null,"au":"d3d3f48d600c"},{"a":"die","de":"Ölleiste","fr":"Rampe d’alimentation / rampe de culbuteurs","ar":"سكة التغذية بالزيت","r":null,"au":"f63587831840"},{"a":"der","de":"Öldruckschalter","fr":"Manocontact","ar":"مفتاح ضغط الزيت","r":null,"au":"5dc6610b429e"},{"a":"die","de":"Öldruckkontrollleuchte","fr":"Témoin de pression d’huile","ar":"مصباح الإنذار لضغط الزيت","r":null,"au":"5404ed973fc9"},{"a":"das","de":"Bypassventil","fr":"Clapet de sécurité (by-pass)","ar":"صمام الأمان (المجرى الجانبي)","r":null,"au":"6d549449e916"},{"a":"der","de":"Ölmessstab","fr":"Jauge à huile","ar":"مقياس مستوى الزيت","r":null,"au":"294eb433fcf2"},{"a":"die","de":"Druckumlaufschmierung","fr":"Lubrification sous pression","ar":"التزييت تحت الضغط","r":null,"au":"a240915976f6"},{"a":"die","de":"Spritzschmierung","fr":"Lubrification par barbotage","ar":"التزييت بالرش (الغمس)","r":null,"au":"bac0c46a8302"},{"a":"die","de":"Kurbelgehäuseentlüftung","fr":"Réaspiration des vapeurs d’huile","ar":"إعادة سحب أبخرة الزيت","r":null,"au":"148ae2a2376d"},{"a":"der","de":"Ölabscheider","fr":"Décanteur","ar":"المُرسِّب (فاصل الزيت)","r":null,"au":"f788317729a6"},{"a":"die","de":"Viskosität","fr":"Viscosité","ar":"اللزوجة","r":null,"au":"598109ac1d0d"}]},{"t":"mcq","q":{"fr":"Quel organe filtre les grosses impuretés avant la pompe ?","de":"Welches Teil filtert die groben Verunreinigungen vor der Pumpe?","ar":"أي عضو يرشّح الشوائب الكبيرة قبل المضخة؟"},"opts":[{"fr":"La crépine d’aspiration","de":"Das Ansaugsieb","ar":"شبكة السحب"},{"fr":"Le manomètre","de":"Das Manometer","ar":"مقياس الضغط"},{"fr":"Le refroidisseur","de":"Der Ölkühler","ar":"المبرّد"}],"ans":0}]},{"id":"lub-fonction","title":{"fr":"Leçon 4 – Analyse du circuit : qui fait quoi ?","de":"Lektion 4 – Analyse des Kreislaufs: wer macht was?","ar":"الدرس 4 – تحليل الدورة: من يفعل ماذا؟"},"blocks":[{"t":"teach","fr":"Le circuit de lubrification a une mission : fournir l’huile sous pression aux éléments mobiles. Pour cela il reçoit de l’énergie mécanique (le moteur entraîne la pompe) et la transforme en énergie hydraulique (huile sous pression). Il informe aussi le conducteur par le témoin de pression sur le tableau de bord.","de":"Der Schmierkreislauf hat eine Aufgabe: Öl unter Druck zu den beweglichen Teilen zu liefern. Dafür erhält er mechanische Energie (der Motor treibt die Pumpe an) und wandelt sie in hydraulische Energie (Öl unter Druck) um. Er informiert den Fahrer auch über die Kontrollleuchte im Armaturenbrett.","ar":"لدورة التزييت مهمة واحدة: تزويد الأجزاء المتحركة بالزيت تحت الضغط. لذلك تتلقى طاقة ميكانيكية (المحرك يُدير المضخة) وتحوّلها إلى طاقة هيدروليكية (زيت تحت الضغط). كما تُعلم السائق بواسطة مصباح الضغط في لوحة القيادة."},{"t":"table","head":[{"fr":"Fonction","de":"Funktion","ar":"الوظيفة"},{"fr":"Organe","de":"Bauteil","ar":"العضو"}],"rows":[[{"fr":"Stocker / refroidir","de":"Speichern / kühlen","ar":"تخزين / تبريد"},{"fr":"Carter","de":"Ölwanne","ar":"الحوض"}],[{"fr":"Mettre en pression","de":"Unter Druck setzen","ar":"ضغط الزيت"},{"fr":"Pompe à huile","de":"Ölpumpe","ar":"مضخة الزيت"}],[{"fr":"Réguler","de":"Regeln","ar":"تنظيم الضغط"},{"fr":"Clapet de décharge","de":"Überdruckventil","ar":"صمام التفريغ"}],[{"fr":"Filtrer","de":"Filtern","ar":"الترشيح"},{"fr":"Filtre","de":"Filter","ar":"المرشح"}],[{"fr":"Dériver","de":"Umleiten","ar":"تحويل المسار"},{"fr":"By-pass","de":"Bypass","ar":"المجرى الجانبي"}],[{"fr":"Distribuer","de":"Verteilen","ar":"التوزيع"},{"fr":"Rampe d’huile","de":"Ölleiste","ar":"سكة الزيت"}],[{"fr":"Informer","de":"Informieren","ar":"الإعلام"},{"fr":"Manocontact + témoin de pression","de":"Öldruckschalter + Kontrollleuchte","ar":"مفتاح الضغط + مصباح الضغط"}]]}]},{"id":"lub-pompes","title":{"fr":"Leçon 5 – Les pompes à huile","de":"Lektion 5 – Die Ölpumpen","ar":"الدرس 5 – مضخات الزيت"},"blocks":[{"t":"teach","fr":"Rôle de la pompe : aspirer l’huile dans le carter inférieur et la diriger sous pression vers la rampe principale. Il existe trois grands types de pompes.","de":"Aufgabe der Pumpe: das Öl aus der Ölwanne ansaugen und unter Druck zur Hauptleitung leiten. Es gibt drei Haupttypen von Pumpen.","ar":"دور المضخة: سحب الزيت من الحوض السفلي وتوجيهه تحت الضغط إلى القناة الرئيسية. هناك ثلاثة أنواع رئيسية من المضخات."},{"t":"steps","items":[{"title":{"fr":"La pompe à engrenages","de":"Die Zahnradpumpe","ar":"مضخة التروس"},"text":{"fr":"Un pignon est solidaire de l’arbre de commande et entraîné par le moteur ; l’autre tourne « fou » autour de son axe. L’huile entre dans la chambre d’aspiration (côté où les dents se séparent), remplit l’espace entre les dents et le corps de pompe, puis est entraînée vers la chambre de refoulement.","de":"Ein Zahnrad sitzt fest auf der Antriebswelle und wird vom Motor angetrieben; das andere läuft frei (»Leerlaufrad«) auf seiner Achse. Das Öl strömt in die Saugkammer (dort, wo sich die Zähne trennen), füllt den Raum zwischen den Zähnen und dem Pumpengehäuse und wird zur Druckkammer mitgenommen.","ar":"ترس مثبّت على عمود الإدارة ويُدار بالمحرك؛ والترس الآخر يدور بحرية حول محوره. يدخل الزيت إلى غرفة السحب (حيث تنفصل الأسنان)، ويملأ الفراغ بين الأسنان وجسم المضخة ثم يُنقل إلى غرفة الدفع."}},{"title":{"fr":"La pompe à rotor","de":"Die Rotorpumpe","ar":"مضخة الدوّار"},"text":{"fr":"Aspiration : le rotor tourne, le volume A augmente, ce qui crée une dépression et l’huile est aspirée. Refoulement : le rotor continue, le volume A diminue jusqu’à devenir nul et l’huile sort sous pression par l’orifice de sortie.","de":"Ansaugen: der Rotor dreht sich, das Volumen A wird größer, es entsteht Unterdruck und Öl wird angesaugt. Fördern: der Rotor dreht weiter, das Volumen A wird kleiner bis null und das Öl wird unter Druck durch den Auslass gedrückt.","ar":"السحب: يدور الدوّار فيزداد الحجم A مما يخلق تفريغًا فيُسحب الزيت. الدفع: يستمر الدوّار فيتناقص الحجم A حتى ينعدم ويخرج الزيت تحت الضغط من فتحة الخروج."}},{"title":{"fr":"La pompe à palettes","de":"Die Flügelzellenpumpe","ar":"مضخة الريش"},"text":{"fr":"Le noyau est excentré : en tournant, le volume des compartiments formés par les palettes et les parois varie. Il y a aspiration dans le compartiment dont le volume augmente et refoulement dans celui dont le volume diminue.","de":"Der Rotor sitzt außermittig: beim Drehen ändert sich das Volumen der Kammern zwischen den Flügeln und der Gehäusewand. In der Kammer, die größer wird, wird angesaugt, in der Kammer, die kleiner wird, wird gefördert.","ar":"النواة غير مركزية: أثناء الدوران يتغير حجم الحجرات المتكونة بين الريش والجدران. يحدث السحب في الحجرة التي يزداد حجمها والدفع في التي يتناقص حجمها."}}]},{"t":"terms","items":[{"a":"die","de":"Zahnradpumpe","fr":"Pompe à engrenages","ar":"مضخة التروس","r":null,"au":"62878fc8efc6"},{"a":"die","de":"Rotorpumpe","fr":"Pompe à rotor","ar":"مضخة الدوّار","r":null,"au":"c9bd8e227563"},{"a":"die","de":"Flügelzellenpumpe","fr":"Pompe à palettes","ar":"مضخة الريش","r":null,"au":"816ea8bc0a6d"},{"a":"die","de":"Saugkammer","fr":"Chambre d’aspiration","ar":"غرفة السحب","r":null,"au":"279b8d2f7b3b"},{"a":"die","de":"Druckkammer","fr":"Chambre de refoulement","ar":"غرفة الدفع","r":null,"au":"2b111433fd4f"},{"a":"das","de":"Pumpengehäuse","fr":"Corps de pompe","ar":"جسم المضخة","r":null,"au":"71540b84527c"},{"a":"der","de":"Unterdruck","fr":"Dépression","ar":"التفريغ (ضغط منخفض)","r":null,"au":"db3dc030a837"}]}]},{"id":"lub-regulation","title":{"fr":"Leçon 6 – Limiteur de pression, filtre, by-pass et manocontact","de":"Lektion 6 – Druckbegrenzer, Filter, Bypass und Öldruckschalter","ar":"الدرس 6 – محدّد الضغط والمرشح والمجرى الجانبي ومفتاح الضغط"},"blocks":[{"t":"teach","fr":"Une pompe volumétrique fournit une pression qui dépend de trois choses : le régime du moteur, la viscosité de l’huile et l’usure du moteur. Pour éviter d’abîmer la pompe, il faut limiter la pression.","de":"Eine Verdrängerpumpe liefert einen Druck, der von drei Dingen abhängt: der Motordrehzahl, der Viskosität des Öls und dem Verschleiß des Motors. Um die Pumpe nicht zu beschädigen, muss der Druck begrenzt werden.","ar":"المضخة الحجمية يعتمد ضغطها على ثلاثة أشياء: سرعة دوران المحرك ولزوجة الزيت وتآكل المحرك. ولتفادي تلف المضخة يجب تحديد الضغط."},{"t":"p","fr":"A) Le limiteur de pression : un clapet à bille placé sur la sortie de la pompe, maintenu sur son siège par un ressort taré. | • Pression normale : inférieure au tarage du ressort → le clapet est fermé. | • Pression trop élevée : supérieure au tarage → le clapet s’ouvre, l’huile retourne au carter, la pression chute et le clapet se referme.","de":"A) Der Druckbegrenzer: ein Kugelventil am Pumpenausgang, das von einer abgestimmten Feder auf seinem Sitz gehalten wird. | • Normaler Druck: unter der Federkraft → das Ventil bleibt geschlossen. | • Zu hoher Druck: über der Federkraft → das Ventil öffnet, das Öl fließt in die Ölwanne zurück, der Druck fällt und das Ventil schließt wieder.","ar":"أ) محدّد الضغط: صمام كروي موضوع عند مخرج المضخة ويُثبّته نابض معايَر على مقعده. | • ضغط عادي: أقل من معايرة النابض ← الصمام مغلق. | • ضغط مرتفع: أعلى من المعايرة ← ينفتح الصمام ويعود الزيت إلى الحوض فينخفض الضغط ثم يُغلق الصمام."},{"t":"p","fr":"B) Le filtre à huile : il élimine les impuretés en suspension dans l’huile. Elles peuvent être : des particules métalliques du rodage, des résidus de combustion, des produits d’altération de l’huile. Dans ce montage, toute l’huile venant de la pompe passe par le filtre.","de":"B) Der Ölfilter: er entfernt die im Öl schwebenden Verunreinigungen. Das können sein: Metallteilchen vom Einlaufen, Verbrennungsrückstände, Zersetzungsprodukte des Öls. In dieser Anordnung fließt das gesamte Öl von der Pumpe durch den Filter.","ar":"ب) مرشح الزيت: يزيل الشوائب العالقة في الزيت. قد تكون: جزيئات معدنية ناتجة عن الترويض، بقايا الاحتراق، منتجات تلف الزيت. في هذا التركيب يمر كل الزيت القادم من المضخة عبر المرشح."},{"t":"p","fr":"C) Le clapet de sécurité (by-pass) : si le filtre est bouché, le circuit d’huile serait coupé. Quand le filtre s’obstrue, la pression monte dans la cartouche, le clapet s’ouvre et l’huile (non filtrée) rejoint directement la rampe principale pour continuer à graisser le moteur.","de":"C) Das Sicherheitsventil (Bypass): wäre der Filter verstopft, wäre der Ölkreislauf unterbrochen. Verstopft der Filter, steigt der Druck in der Patrone, das Ventil öffnet und das (ungefilterte) Öl gelangt direkt zur Hauptleitung, damit der Motor weiter geschmiert wird.","ar":"ج) صمام الأمان (المجرى الجانبي): لو انسد المرشح لانقطعت دورة الزيت. عند انسداد المرشح يرتفع الضغط داخل الخرطوشة فينفتح الصمام ويصل الزيت (غير المرشح) مباشرة إلى القناة الرئيسية ليستمر تزييت المحرك."},{"t":"p","fr":"D) Le manocontact : il signale au conducteur une pression d’huile insuffisante. | • Pression faible : la membrane ne se déforme pas, il y a liaison électrique entre le + et la masse → la lampe témoin est allumée. | • Pression correcte : la membrane se déforme et déplace la coupelle, la liaison électrique est coupée → la lampe s’éteint.","de":"D) Der Öldruckschalter: er meldet dem Fahrer zu niedrigen Öldruck. | • Niedriger Druck: die Membran verformt sich nicht, es besteht eine elektrische Verbindung zwischen Plus und Masse → die Kontrollleuchte leuchtet. | • Richtiger Druck: die Membran verformt sich und verschiebt die Schale, die Verbindung ist unterbrochen → die Leuchte erlischt.","ar":"د) مفتاح ضغط الزيت: ينبّه السائق إلى ضغط زيت غير كافٍ. | • ضغط ضعيف: الغشاء لا يتشوّه، يوجد اتصال كهربائي بين (+) والكتلة ← المصباح مضاء. | • ضغط صحيح: يتشوّه الغشاء ويحرّك الكأس فينقطع الاتصال الكهربائي ← ينطفئ المصباح."},{"t":"p","fr":"E) La réaspiration des vapeurs d’huile : pour lutter contre la pollution, on n’envoie plus les vapeurs d’huile dans l’atmosphère. Elles sont collectées dans le couvre-culbuteurs, amenées vers un décanteur ; l’huile liquide retourne au carter, les vapeurs sont dirigées vers la chambre de combustion pour y être brûlées.","de":"E) Die Kurbelgehäuseentlüftung: zum Schutz der Umwelt werden Öldämpfe nicht mehr in die Atmosphäre geleitet. Sie werden im Ventildeckel gesammelt und zu einem Ölabscheider geführt; das flüssige Öl fließt in die Ölwanne zurück, die Dämpfe werden in den Brennraum geleitet und dort verbrannt.","ar":"هـ) إعادة سحب أبخرة الزيت: لمكافحة التلوث لم تعد أبخرة الزيت تُرسل إلى الجو. تُجمَع في غطاء الصمامات وتُوجَّه إلى المُرسِّب؛ يعود الزيت السائل إلى الحوض وتُرسل الأبخرة إلى غرفة الاحتراق لتُحرق."},{"t":"p","fr":"À savoir : le graissage par barbotage (le chapeau de bielle porte une cuillère qui projette l’huile sur le maneton et sur les parois du cylindre) n’est plus employé de nos jours.","de":"Gut zu wissen: Die Spritzschmierung (der Pleuellagerdeckel trägt einen Löffel, der das Öl auf den Hubzapfen und die Zylinderwände schleudert) wird heute nicht mehr verwendet.","ar":"للمعرفة: التزييت بالغمس (غطاء ذراع التوصيل مزوّد بملعقة تقذف الزيت على المحور وجدران الأسطوانة) لم يعد مستعملًا في أيامنا."},{"t":"mcq","q":{"fr":"Que fait le clapet by-pass quand le filtre est bouché ?","de":"Was macht das Bypassventil bei verstopftem Filter?","ar":"ماذا يفعل صمام المجرى الجانبي عندما ينسد المرشح؟"},"opts":[{"fr":"Il s’ouvre : l’huile non filtrée continue de circuler","de":"Es öffnet: ungefiltertes Öl fließt weiter","ar":"ينفتح: يستمر الزيت غير المرشح في الجريان"},{"fr":"Il coupe le circuit","de":"Es unterbricht den Kreislauf","ar":"يقطع الدورة"},{"fr":"Il refroidit l’huile","de":"Es kühlt das Öl","ar":"يبرّد الزيت"}],"ans":0},{"t":"mcq","q":{"fr":"La lampe témoin d’huile est allumée : la pression est…","de":"Die Öldruck-Kontrollleuchte leuchtet: der Druck ist …","ar":"مصباح الزيت مضاء: الضغط …"},"opts":[{"fr":"Trop faible","de":"Zu niedrig","ar":"ضعيف جدًا"},{"fr":"Correcte","de":"Richtig","ar":"صحيح"},{"fr":"Trop élevée","de":"Zu hoch","ar":"مرتفع جدًا"}],"ans":0}]},{"id":"lub-videos","title":{"fr":"Vidéos et documents","de":"Videos und Dokumente","ar":"فيديوهات وملفات"},"blocks":[{"t":"video","src":"video/lubrification-circuit.mp4","cap":{"fr":"Vidéo : le circuit de lubrification du moteur","de":"Video: der Schmierkreislauf des Motors","ar":"فيديو: دورة تزييت المحرك"}},{"t":"video","src":"video/lubrification-carter-humide.mp4","cap":{"fr":"Animation : lubrification à carter humide","de":"Animation: Nasssumpfschmierung","ar":"رسم متحرك: التزييت بالحوض الرطب"}},{"t":"file","src":"files/cours-lubrification.ppt","kind":"PPT","cap":{"fr":"Cours : le circuit de lubrification (PowerPoint)","de":"Kurs: der Schmierkreislauf (PowerPoint)","ar":"درس: دورة التزييت (باوربوينت)"}}]}]},{"id":"refroidissement","n":5,"title":{"fr":"Le circuit de refroidissement","de":"Der Kühlkreislauf","ar":"دورة التبريد"},"goals":{"fr":"Comprendre pourquoi le moteur doit être refroidi | Suivre le liquide de refroidissement dans le circuit | Expliquer le thermostat, la pompe à eau, le radiateur et le vase d’expansion | Connaître le rôle de la pression dans le circuit","de":"Verstehen, warum der Motor gekühlt werden muss | Das Kühlmittel im Kreislauf verfolgen | Thermostat, Wasserpumpe, Kühler und Ausgleichsbehälter erklären | Die Rolle des Drucks im Kreislauf kennen","ar":"فهم لماذا يجب تبريد المحرك | تتبّع سائل التبريد في الدورة | شرح المنظم الحراري ومضخة الماء والمشعاع وقربة التمدد | معرفة دور الضغط في الدورة"},"topics":[{"id":"ref-role","title":{"fr":"Leçon 1 – Pourquoi refroidir le moteur ?","de":"Lektion 1 – Warum den Motor kühlen?","ar":"الدرس 1 – لماذا نبرّد المحرك؟"},"blocks":[{"t":"teach","fr":"Un moteur qui tourne dégage beaucoup de chaleur : à cause du frottement des pièces en mouvement et à cause de la combustion des gaz dans le cylindre. Si on ne fait rien, les pièces se dilatent et l’huile se détériore.","de":"Ein laufender Motor erzeugt viel Wärme: durch die Reibung der bewegten Teile und durch die Verbrennung der Gase im Zylinder. Tut man nichts, dehnen sich die Teile aus und das Öl wird zerstört.","ar":"المحرك أثناء الدوران يُنتج حرارة كبيرة: بسبب احتكاك القطع المتحركة وبسبب احتراق الغازات في الأسطوانة. إن لم نفعل شيئًا تتمدد القطع ويفسد الزيت."},{"t":"p","fr":"Le circuit de refroidissement a donc pour rôle : | • de transférer la chaleur produite par le moteur ; | • de permettre au moteur d’atteindre vite sa température de fonctionnement (environ 90 °C) ; | • de réguler cette température ; | • de ne jamais dépasser une température maximale.","de":"Der Kühlkreislauf hat daher folgende Aufgaben: | • die vom Motor erzeugte Wärme abführen; | • dem Motor ermöglichen, schnell seine Betriebstemperatur (etwa 90 °C) zu erreichen; | • diese Temperatur regeln; | • eine Höchsttemperatur nie überschreiten.","ar":"إذن دور دورة التبريد: | • نقل الحرارة الناتجة عن المحرك؛ | • السماح للمحرك ببلوغ حرارة التشغيل بسرعة (حوالي 90 °م)؛ | • تنظيم هذه الحرارة؛ | • عدم تجاوز حرارة قصوى."},{"t":"terms","h":{"fr":"Mots à retenir","de":"Wörter zum Merken","ar":"كلمات يجب حفظها"},"items":[{"a":"die","de":"Kühlung","fr":"Refroidissement","ar":"التبريد","r":null,"au":"fe466f396858"},{"a":"das","de":"Kühlmittel","fr":"Liquide de refroidissement","ar":"سائل التبريد","r":null,"au":"6de5676183b8"},{"a":"die","de":"Wärme","fr":"Chaleur","ar":"الحرارة","r":null,"au":"1e38cee575ae"},{"a":"die","de":"Temperatur","fr":"Température","ar":"درجة الحرارة","r":null,"au":"058058196b1c"},{"a":"die","de":"Betriebstemperatur","fr":"Température de fonctionnement","ar":"درجة حرارة التشغيل","r":null,"au":"f23484050148"},{"a":"die","de":"Ausdehnung","fr":"Dilatation","ar":"التمدد","r":null,"au":"92189c0a10e8"},{"a":"der","de":"Kühlkreislauf","fr":"Circuit de refroidissement","ar":"دورة التبريد","r":null,"au":"f8db7a424557"}]},{"t":"mcq","q":{"fr":"Quelle est la température de fonctionnement du moteur ?","de":"Wie hoch ist die Betriebstemperatur des Motors?","ar":"ما هي درجة حرارة تشغيل المحرك؟"},"opts":[{"fr":"Environ 90 °C","de":"Etwa 90 °C","ar":"حوالي 90 °م"},{"fr":"Environ 20 °C","de":"Etwa 20 °C","ar":"حوالي 20 °م"},{"fr":"Environ 300 °C","de":"Etwa 300 °C","ar":"حوالي 300 °م"}],"ans":0}]},{"id":"ref-circuit","title":{"fr":"Leçon 2 – Le circuit en un coup d’œil","de":"Lektion 2 – Der Kreislauf auf einen Blick","ar":"الدرس 2 – الدورة في لمحة"},"blocks":[{"t":"anim","kind":"cool","cap":{"fr":"Animation : le circuit de refroidissement","de":"Animation: der Kühlkreislauf","ar":"رسم متحرك: دورة التبريد"},"frames":[{"fr":"Le moteur en marche chauffe : le liquide de refroidissement absorbe la chaleur dans les chemises d’eau.","de":"Der laufende Motor wird heiß: das Kühlmittel nimmt die Wärme in den Wassermänteln auf.","ar":"المحرك أثناء العمل يسخن: سائل التبريد يمتص الحرارة في أغلفة الماء."},{"fr":"Moteur froid : le thermostat est fermé. Le liquide ne va pas au radiateur, il tourne dans le petit circuit : le moteur chauffe vite.","de":"Kalter Motor: der Thermostat ist geschlossen. Das Kühlmittel fließt nicht zum Kühler, sondern im kleinen Kreislauf: der Motor wird schnell warm.","ar":"المحرك بارد: المنظم الحراري مغلق. لا يذهب السائل إلى المشعاع بل يدور في الدورة القصيرة: فيسخن المحرك بسرعة."},{"fr":"Moteur chaud (≈ 90 °C) : le thermostat s’ouvre. Le liquide chaud va au radiateur par la durite supérieure, le ventilateur souffle de l’air, le liquide refroidi revient par la durite inférieure et la pompe à eau.","de":"Warmer Motor (≈ 90 °C): der Thermostat öffnet. Das heiße Kühlmittel fließt durch den oberen Schlauch zum Kühler, der Lüfter bläst Luft, das abgekühlte Kühlmittel kommt durch den unteren Schlauch und die Wasserpumpe zurück.","ar":"المحرك ساخن (≈ 90 °م): ينفتح المنظم الحراري. يذهب السائل الساخن إلى المشعاع عبر الخرطوم العلوي، تنفخ المروحة الهواء، ويعود السائل المبرّد عبر الخرطوم السفلي ومضخة الماء."},{"fr":"Le vase d’expansion reçoit la dilatation du liquide et le bouchon limite la pression du circuit (0,8 à 1,2 bar).","de":"Der Ausgleichsbehälter nimmt die Ausdehnung des Kühlmittels auf und der Deckel begrenzt den Druck im Kreislauf (0,8 bis 1,2 bar).","ar":"قربة التمدد تستقبل تمدد السائل والغطاء يحدّ من ضغط الدورة (0.8 إلى 1.2 بار)."}]},{"t":"teach","fr":"Le liquide de refroidissement circule dans les chemises d’eau du moteur pour absorber la chaleur. Il est ensuite envoyé vers le radiateur où il se refroidit au contact de l’air. Le thermostat règle le passage du liquide pour maintenir la bonne température.","de":"Das Kühlmittel zirkuliert in den Wassermänteln des Motors und nimmt Wärme auf. Dann wird es zum Kühler geschickt, wo es sich an der Luft abkühlt. Der Thermostat regelt den Durchfluss, um die richtige Temperatur zu halten.","ar":"يدور سائل التبريد في غلاف الماء داخل المحرك ليمتص الحرارة. ثم يُرسل إلى المشعاع حيث يبرد عند ملامسة الهواء. ويتحكم المنظم الحراري في مرور السائل للحفاظ على الحرارة المناسبة."},{"t":"fig","src":"img/refroidissement-2.jpg","cap":{"fr":"Circuit de refroidissement d’un moteur Diesel : rouge = liquide chaud (sortie moteur), bleu = liquide refroidi (retour moteur)","de":"Kühlkreislauf eines Dieselmotors: rot = heißes Kühlmittel (Motorausgang), blau = abgekühltes Kühlmittel (Rücklauf zum Motor)","ar":"دورة تبريد محرك ديزل: أحمر = سائل ساخن (خروج من المحرك)، أزرق = سائل مبرد (رجوع إلى المحرك)"}},{"t":"steps","items":[{"title":{"fr":"Le moteur chauffe le liquide","de":"Der Motor erwärmt das Kühlmittel","ar":"المحرك يسخّن السائل"},"text":{"fr":"Dans les chemises d’eau (bloc et culasse), le liquide absorbe la chaleur des pièces chaudes.","de":"In den Wassermänteln (Block und Zylinderkopf) nimmt das Kühlmittel die Wärme der heißen Teile auf.","ar":"في أغلفة الماء (الكتلة ورأس الأسطوانة) يمتص السائل حرارة القطع الساخنة."}},{"title":{"fr":"Le thermostat décide","de":"Der Thermostat entscheidet","ar":"المنظم الحراري يقرر"},"text":{"fr":"Moteur froid : il reste fermé, le liquide ne va pas au radiateur. Moteur chaud : il s’ouvre.","de":"Kalter Motor: er bleibt geschlossen, das Kühlmittel fließt nicht zum Kühler. Warmer Motor: er öffnet.","ar":"المحرك بارد: يبقى مغلقًا ولا يذهب السائل إلى المشعاع. المحرك ساخن: ينفتح."}},{"title":{"fr":"La durite supérieure","de":"Der obere Kühlerschlauch","ar":"الخرطوم العلوي"},"text":{"fr":"Elle transporte le liquide chaud du moteur vers le radiateur.","de":"Er transportiert das heiße Kühlmittel vom Motor zum Kühler.","ar":"ينقل السائل الساخن من المحرك إلى المشعاع."}},{"title":{"fr":"Le radiateur et le ventilateur","de":"Der Kühler und der Lüfter","ar":"المشعاع والمروحة"},"text":{"fr":"Le radiateur dissipe la chaleur dans l’air. Le ventilateur augmente le flux d’air pour mieux refroidir.","de":"Der Kühler gibt die Wärme an die Luft ab. Der Lüfter erhöht den Luftstrom für bessere Kühlung.","ar":"يبدّد المشعاع الحرارة في الهواء. وتزيد المروحة تدفق الهواء لتحسين التبريد."}},{"title":{"fr":"La durite inférieure","de":"Der untere Kühlerschlauch","ar":"الخرطوم السفلي"},"text":{"fr":"Elle ramène le liquide refroidi du radiateur vers la pompe à eau.","de":"Er bringt das abgekühlte Kühlmittel vom Kühler zur Wasserpumpe.","ar":"يعيد السائل المبرّد من المشعاع إلى مضخة الماء."}},{"title":{"fr":"La pompe à eau","de":"Die Wasserpumpe","ar":"مضخة الماء"},"text":{"fr":"Elle fait circuler le liquide dans tout le circuit et le renvoie vers le moteur : le cycle recommence.","de":"Sie lässt das Kühlmittel im ganzen Kreislauf zirkulieren und schickt es zurück zum Motor: der Kreislauf beginnt von vorn.","ar":"تُدير السائل في كامل الدورة وتعيده إلى المحرك: تبدأ الدورة من جديد."}}]},{"t":"rule","fr":"Chemin à retenir : pompe à eau → chemises d’eau (moteur) → thermostat → durite supérieure → radiateur (+ ventilateur) → durite inférieure → pompe à eau.","de":"Weg zum Merken: Wasserpumpe → Wassermäntel (Motor) → Thermostat → oberer Schlauch → Kühler (+ Lüfter) → unterer Schlauch → Wasserpumpe.","ar":"المسار للحفظ: مضخة الماء ← أغلفة الماء (المحرك) ← المنظم الحراري ← الخرطوم العلوي ← المشعاع (+ المروحة) ← الخرطوم السفلي ← مضخة الماء."},{"t":"mcq","q":{"fr":"Quelle pièce fait circuler le liquide dans tout le circuit ?","de":"Welches Teil lässt das Kühlmittel im ganzen Kreislauf zirkulieren?","ar":"أي قطعة تُدير السائل في كامل الدورة؟"},"opts":[{"fr":"La pompe à eau","de":"Die Wasserpumpe","ar":"مضخة الماء"},{"fr":"Le radiateur de chauffage","de":"Der Heizungskühler","ar":"رادياتير التدفئة"},{"fr":"Le vase d’expansion","de":"Der Ausgleichsbehälter","ar":"قربة التمدد"}],"ans":0}]},{"id":"ref-organes","title":{"fr":"Leçon 3 – Les pièces du circuit (mots et rôles)","de":"Lektion 3 – Die Bauteile des Kreislaufs (Wörter und Aufgaben)","ar":"الدرس 3 – قطع الدورة (الكلمات والأدوار)"},"blocks":[{"t":"fig","src":"img/refroidissement-1.jpg","cap":{"fr":"Schéma complet avec les 11 organes et le principe de fonctionnement (français + arabe)","de":"Gesamtschema mit den 11 Bauteilen und dem Funktionsprinzip (Französisch + Arabisch)","ar":"مخطط كامل مع الأعضاء الأحد عشر ومبدأ العمل (فرنسي + عربي)"}},{"t":"terms","h":{"fr":"Les organes du circuit","de":"Die Bauteile des Kreislaufs","ar":"أعضاء الدورة"},"items":[{"a":"der","de":"Kühler","fr":"Radiateur","ar":"المشعاع (الرادياتير)","r":{"fr":"Dissipe la chaleur du liquide de refroidissement vers l’air.","de":"Gibt die Wärme des Kühlmittels an die Luft ab.","ar":"يبدّد حرارة سائل التبريد نحو الهواء."},"au":"c92944eb0946"},{"a":"der","de":"Lüfter","fr":"Ventilateur","ar":"المروحة","r":{"fr":"Augmente le flux d’air à travers le radiateur pour mieux refroidir.","de":"Erhöht den Luftstrom durch den Kühler für bessere Kühlung.","ar":"تزيد تدفق الهواء عبر المشعاع لتحسين التبريد."},"au":"fbe8e6e91ad5"},{"a":"der","de":"obere Kühlerschlauch","fr":"Durite supérieure","ar":"الخرطوم العلوي","r":{"fr":"Transporte le liquide chaud du moteur vers le radiateur.","de":"Transportiert das heiße Kühlmittel vom Motor zum Kühler.","ar":"ينقل السائل الساخن من المحرك إلى المشعاع."},"au":"5d4a1861cef1"},{"a":"der","de":"Thermostat","fr":"Thermostat","ar":"المنظم الحراري (الترموستات)","r":{"fr":"Régule la circulation du liquide en fonction de la température.","de":"Regelt den Kühlmittelfluss abhängig von der Temperatur.","ar":"ينظّم دوران السائل حسب درجة الحرارة."},"au":"338d985205c3"},{"a":"die","de":"Wasserpumpe","fr":"Pompe à eau","ar":"مضخة الماء","r":{"fr":"Assure la circulation du liquide dans tout le circuit.","de":"Sorgt für die Zirkulation des Kühlmittels im ganzen Kreislauf.","ar":"تضمن دوران السائل في جميع أنحاء الدورة."},"au":"13b17ab3f0e1"},{"a":"der","de":"untere Kühlerschlauch","fr":"Durite inférieure","ar":"الخرطوم السفلي","r":{"fr":"Ramène le liquide refroidi du radiateur vers la pompe à eau / moteur.","de":"Bringt das abgekühlte Kühlmittel vom Kühler zur Wasserpumpe / zum Motor.","ar":"يعيد السائل المبرّد من المشعاع إلى المضخة / المحرك."},"au":"f3331530767b"},{"a":"der","de":"Wassermantel","fr":"Chemises d’eau (bloc moteur)","ar":"غلاف الماء (كتلة المحرك)","r":{"fr":"Absorbent la chaleur des pièces chaudes du moteur.","de":"Nehmen die Wärme der heißen Motorteile auf.","ar":"تمتص حرارة الأجزاء الساخنة في المحرك."},"au":"a25bc446f009"},{"a":"der","de":"Ausgleichsbehälter","fr":"Vase d’expansion","ar":"قربة التمدد","r":{"fr":"Permet la dilatation du liquide et maintient le niveau.","de":"Erlaubt die Ausdehnung des Kühlmittels und hält den Füllstand.","ar":"يسمح بتمدد السائل ويحافظ على المستوى."},"au":"0e034638aeb7"},{"a":"der","de":"Entlüftungsschlauch","fr":"Durite de dégazage","ar":"خرطوم تفريغ الغازات","r":{"fr":"Évacue l’air et les gaz du circuit vers le vase d’expansion.","de":"Führt Luft und Gase aus dem Kreislauf zum Ausgleichsbehälter.","ar":"يُخرج الهواء والغازات من الدورة إلى قربة التمدد."},"au":"a9afd5062f40"},{"a":"der","de":"Heizungskühler","fr":"Radiateur de chauffage","ar":"رادياتير التدفئة","r":{"fr":"Chauffe l’air de l’habitacle.","de":"Erwärmt die Luft im Fahrzeuginnenraum.","ar":"يسخّن هواء المقصورة."},"au":"a69f5824e9e4"},{"a":"der","de":"Kühlerdeckel","fr":"Bouchon de remplissage","ar":"غطاء التعبئة","r":{"fr":"Permet le remplissage et assure l’étanchéité du circuit.","de":"Ermöglicht das Befüllen und dichtet den Kreislauf ab.","ar":"يسمح بالتعبئة ويضمن إحكام غلق الدورة."},"au":"e93f8eb29b9b"}]},{"t":"terms","h":{"fr":"Capteurs et témoins (schéma du cours)","de":"Sensoren und Anzeigen (Schema aus dem Unterricht)","ar":"الحسّاسات والمؤشرات (مخطط الدرس)"},"items":[{"a":"der","de":"Temperaturfühler","fr":"Sonde de température du liquide","ar":"حسّاس حرارة السائل","r":null,"au":"36ecf7801502"},{"a":"der","de":"Thermoschalter","fr":"Thermocontact (sonde du ventilateur électrique)","ar":"مفتاح حراري (حسّاس المروحة الكهربائية)","r":null,"au":"6c7d9705964a"},{"a":"die","de":"Kontrollleuchte","fr":"Lampe témoin","ar":"مصباح البيان (المؤشر)","r":null,"au":"b9c8b6a188e4"},{"a":"der","de":"Heizungshahn","fr":"Robinet de chauffage","ar":"صنبور التدفئة","r":null,"au":"dc4270164683"},{"a":"der","de":"Füllstandsanzeiger","fr":"Jauge à liquide / témoin de niveau mini","ar":"مؤشر مستوى السائل","r":null,"au":"31736664ed93"}]},{"t":"mcq","q":{"fr":"Quelle pièce permet la dilatation du liquide et maintient le niveau ?","de":"Welches Teil erlaubt die Ausdehnung des Kühlmittels und hält den Füllstand?","ar":"أي قطعة تسمح بتمدد السائل وتحافظ على المستوى؟"},"opts":[{"fr":"Le vase d’expansion","de":"Der Ausgleichsbehälter","ar":"قربة التمدد"},{"fr":"Le thermostat","de":"Der Thermostat","ar":"المنظم الحراري"},{"fr":"Le ventilateur","de":"Der Lüfter","ar":"المروحة"}],"ans":0}]},{"id":"ref-composants","title":{"fr":"Leçon 4 – Radiateur, ventilation et pompe à eau","de":"Lektion 4 – Kühler, Lüfter und Wasserpumpe","ar":"الدرس 4 – المشعاع والتهوية ومضخة الماء"},"blocks":[{"t":"teach","fr":"Regardons trois pièces importantes de plus près.","de":"Schauen wir uns drei wichtige Teile genauer an.","ar":"لنتأمل ثلاث قطع مهمة عن قرب."},{"t":"steps","items":[{"title":{"fr":"Le radiateur","de":"Der Kühler","ar":"المشعاع"},"text":{"fr":"Il évacue la chaleur du liquide grâce au courant d’air en contact avec le métal. Il est d’autant plus efficace que : la différence de température entre l’air ambiant et le liquide est grande, et que la surface de contact avec l’air est grande.","de":"Er gibt die Wärme des Kühlmittels über den Luftstrom an das Metall ab. Er ist umso wirksamer, je größer der Temperaturunterschied zwischen Umgebungsluft und Kühlmittel ist und je größer die Kontaktfläche mit der Luft ist.","ar":"يطرد حرارة السائل بفضل تيار الهواء الملامس للمعدن. تزداد فعاليته كلما كان الفرق في الحرارة بين الهواء المحيط والسائل كبيرًا وكلما كان سطح التلامس مع الهواء كبيرًا."}},{"title":{"fr":"La ventilation","de":"Die Belüftung","ar":"التهوية"},"text":{"fr":"Le ventilateur force le courant d’air à travers le radiateur et les organes. Le moto-ventilateur est commandé par un thermocontact qui l’enclenche vers 95 °C.","de":"Der Lüfter drückt den Luftstrom durch den Kühler und die Bauteile. Der Elektrolüfter wird von einem Thermoschalter gesteuert, der ihn bei etwa 95 °C einschaltet.","ar":"تدفع المروحة تيار الهواء عبر المشعاع والأعضاء. تُشغَّل المروحة الكهربائية بواسطة مفتاح حراري يوصلها عند حوالي 95 °م."}},{"title":{"fr":"La pompe à eau","de":"Die Wasserpumpe","ar":"مضخة الماء"},"text":{"fr":"Sans pompe, le liquide circulerait à environ 15 cm/s : il resterait longtemps au contact des zones chaudes, monterait très haut en température et risquerait de se vaporiser (bulles de gaz) et de se dégrader vite. La pompe force le débit : vitesse supérieure à 1 m/s. C’est le plus souvent une pompe centrifuge entraînée par courroie : un carter circulaire dans lequel tourne une roue à ailettes ; la force centrifuge chasse le liquide vers la périphérie et crée une dépression à l’entrée.","de":"Ohne Pumpe würde das Kühlmittel nur mit etwa 15 cm/s zirkulieren: es bliebe lange an den heißen Stellen, würde sehr heiß und könnte verdampfen (Gasblasen) und schnell altern. Die Pumpe erzwingt den Durchfluss: Geschwindigkeit über 1 m/s. Meist ist es eine Kreiselpumpe mit Riemenantrieb: ein rundes Gehäuse mit einem Flügelrad; die Fliehkraft schleudert das Kühlmittel nach außen und erzeugt am Eingang einen Unterdruck.","ar":"بدون مضخة يدور السائل بسرعة حوالي 15 سم/ثا: فيبقى طويلًا قرب المناطق الساخنة وترتفع حرارته كثيرًا وقد يتبخّر (فقاعات غاز) ويتلف بسرعة. المضخة تفرض التدفق: سرعة أكبر من 1 م/ثا. غالبًا ما تكون مضخة نابذة تُدار بسير: غلاف دائري يدور داخله دولاب بريش؛ القوة النابذة تدفع السائل نحو المحيط وتخلق تفريغًا عند المدخل."}}]},{"t":"terms","items":[{"a":"die","de":"Kreiselpumpe","fr":"Pompe centrifuge","ar":"مضخة نابذة","r":null,"au":"9075d7ce4775"},{"a":"das","de":"Flügelrad","fr":"Roue à ailettes","ar":"دولاب بريش","r":null,"au":"2dedba09813b"},{"a":"die","de":"Fliehkraft","fr":"Force centrifuge","ar":"القوة النابذة","r":null,"au":"7716f6dd7e01"},{"a":"der","de":"Keilriemen","fr":"Courroie","ar":"السير","r":null,"au":"5d1fee221773"},{"a":"die","de":"Riemenscheibe","fr":"Poulie d’entraînement","ar":"بكرة الإدارة","r":null,"au":"5c89812fefc7"},{"a":"der","de":"Dichtring","fr":"Bague d’étanchéité","ar":"حلقة الإحكام","r":null,"au":"3a4478bf6692"},{"a":"der","de":"Elektrolüfter","fr":"Moto-ventilateur","ar":"مروحة كهربائية","r":null,"au":"7b2b5f8a2572"},{"a":"der","de":"Luftstrom","fr":"Courant d’air","ar":"تيار الهواء","r":null,"au":"d04733b4bae1"}]}]},{"id":"ref-thermostat","title":{"fr":"Leçon 5 – Le thermostat","de":"Lektion 5 – Der Thermostat","ar":"الدرس 5 – المنظم الحراري"},"blocks":[{"t":"teach","fr":"Le thermostat est un clapet qui autorise ou interdit le passage du liquide vers le radiateur. À l’intérieur : une capsule de cire, un ressort, une tige de poussée et le clapet. Un petit trou de fuite évite la formation d’une poche d’air.","de":"Der Thermostat ist ein Ventil, das den Durchfluss des Kühlmittels zum Kühler erlaubt oder sperrt. Innen: eine Wachskapsel, eine Feder, ein Stößel und das Ventil. Ein kleines Loch verhindert eine Luftblase.","ar":"المنظم الحراري صمام يسمح بمرور السائل إلى المشعاع أو يمنعه. في داخله: كبسولة شمع ونابض وساق دفع وصمام. وثقب صغير يمنع تشكّل جيب هوائي."},{"t":"steps","items":[{"title":{"fr":"À froid","de":"Kalt","ar":"على البارد"},"text":{"fr":"Tant que la température du liquide est faible, la cire est rétractée. Le ressort repousse le clapet qui reste fermé : il n’y a pas de circulation vers le radiateur. Le moteur chauffe vite.","de":"Solange die Kühlmitteltemperatur niedrig ist, ist das Wachs zusammengezogen. Die Feder drückt das Ventil zu: es gibt keinen Fluss zum Kühler. Der Motor wird schnell warm.","ar":"طالما أن حرارة السائل منخفضة، يكون الشمع منكمشًا. يدفع النابض الصمام فيبقى مغلقًا: لا يوجد دوران نحو المشعاع. فيسخن المحرك بسرعة."}},{"title":{"fr":"À chaud","de":"Warm","ar":"على الساخن"},"text":{"fr":"Quand le liquide atteint la température de fonctionnement (souvent écrite sur le thermostat), la cire se dilate, la tige de poussée déplace le clapet et l’ouvre. Le liquide peut circuler vers le radiateur.","de":"Erreicht das Kühlmittel die Betriebstemperatur (oft am Thermostat eingeprägt), dehnt sich das Wachs aus, der Stößel verschiebt das Ventil und öffnet es. Das Kühlmittel kann zum Kühler fließen.","ar":"عندما يبلغ السائل حرارة التشغيل (غالبًا مكتوبة على المنظم) يتمدد الشمع وتحرّك ساق الدفع الصمام وتفتحه. فيستطيع السائل الدوران نحو المشعاع."}},{"title":{"fr":"Le thermostat double effet","de":"Der Doppelthermostat","ar":"المنظم المزدوج المفعول"},"text":{"fr":"Le thermostat simple a un défaut : pendant le réchauffement, le liquide de la culasse chauffe plus vite que le reste (différences de température entre le haut et le bas du moteur). Le double effet a deux clapets. À froid : le clapet supérieur est fermé (pas de radiateur), le clapet inférieur est ouvert : l’eau de la culasse va vers la pompe et repart vers le moteur, ce qui accélère la mise en température. À chaud : le clapet supérieur s’ouvre, le clapet inférieur se ferme : l’eau passe par le radiateur.","de":"Der einfache Thermostat hat einen Nachteil: beim Warmlaufen erwärmt sich das Kühlmittel im Zylinderkopf schneller als der Rest (Temperaturunterschiede zwischen oberem und unterem Motor). Der Doppelthermostat hat zwei Ventile. Kalt: das obere Ventil ist geschlossen (kein Kühler), das untere ist offen: das Wasser aus dem Zylinderkopf fließt zur Pumpe und zurück zum Motor, das beschleunigt das Warmwerden. Warm: das obere Ventil öffnet, das untere schließt: das Wasser fließt durch den Kühler.","ar":"للمنظم البسيط عيب: أثناء التسخين يسخن سائل رأس الأسطوانة أسرع من الباقي (فروق حرارة بين أعلى وأسفل المحرك). المنظم المزدوج له صمامان. على البارد: الصمام العلوي مغلق (لا مشعاع) والسفلي مفتوح: ماء الرأس يذهب إلى المضخة ويعود إلى المحرك فيتسارع التسخين. على الساخن: ينفتح العلوي ويُغلق السفلي: يمر الماء عبر المشعاع."}}]},{"t":"terms","items":[{"a":"die","de":"Wachskapsel","fr":"Capsule de cire","ar":"كبسولة الشمع","r":null,"au":"d7fa9699a3dc"},{"a":"das","de":"Dehnstoffelement","fr":"Élément thermostatique (à cire dilatable)","ar":"العنصر الحراري (شمع متمدد)","r":null,"au":"46ab64d880a6"},{"a":"die","de":"Feder","fr":"Ressort","ar":"النابض","r":null,"au":"3f20c2dfe017"},{"a":"der","de":"Stößel","fr":"Tige de poussée","ar":"ساق الدفع","r":null,"au":"7d5a9a5b5973"},{"a":"das","de":"Ventil","fr":"Clapet","ar":"الصمام","r":null,"au":"3557b2bee754"},{"a":"der","de":"Doppelthermostat","fr":"Thermostat double effet","ar":"المنظم الحراري المزدوج المفعول","r":null,"au":"4e5643725c24"},{"a":"der","de":"kleine Kreislauf","fr":"Petit circuit (sans radiateur)","ar":"الدورة القصيرة (بدون مشعاع)","r":null,"au":"a3aeca2d32cc"},{"a":"der","de":"große Kreislauf","fr":"Grand circuit (avec radiateur)","ar":"الدورة الطويلة (مع المشعاع)","r":null,"au":"af74a05995d8"}]},{"t":"mcq","q":{"fr":"Moteur froid : le thermostat est…","de":"Kalter Motor: der Thermostat ist …","ar":"المحرك بارد: المنظم الحراري …"},"opts":[{"fr":"Fermé (le liquide ne va pas au radiateur)","de":"Geschlossen (Kühlmittel fließt nicht zum Kühler)","ar":"مغلق (السائل لا يذهب إلى المشعاع)"},{"fr":"Ouvert","de":"Offen","ar":"مفتوح"},{"fr":"Absent","de":"Nicht vorhanden","ar":"غير موجود"}],"ans":0}]},{"id":"ref-pression","title":{"fr":"Leçon 6 – Le circuit sous pression et le vase d’expansion","de":"Lektion 6 – Der Druckkreislauf und der Ausgleichsbehälter","ar":"الدرس 6 – الدورة تحت الضغط وقربة التمدد"},"blocks":[{"t":"teach","fr":"Le liquide de refroidissement bout vers 109 °C à la pression atmosphérique. Quand il se transforme en gaz, il peut abîmer le moteur. Si on augmente la pression du circuit de 0,5 bar, le liquide ne se vaporise qu’à environ 120 °C. On peut donc travailler avec un liquide à plus de 100 °C sans vaporisation et garder le moteur à sa température optimale.","de":"Das Kühlmittel siedet bei Atmosphärendruck bei etwa 109 °C. Verwandelt es sich in Gas, kann es den Motor beschädigen. Erhöht man den Druck im Kreislauf um 0,5 bar, verdampft es erst bei etwa 120 °C. So kann man mit Kühlmittel über 100 °C arbeiten, ohne dass es verdampft, und den Motor auf optimaler Temperatur halten.","ar":"يغلي سائل التبريد عند حوالي 109 °م تحت الضغط الجوي. وعندما يتحول إلى غاز قد يُتلف المحرك. إذا رفعنا ضغط الدورة بمقدار 0.5 بار فلن يتبخر إلا عند حوالي 120 °م. فنستطيع إذن العمل بسائل أعلى من 100 °م دون تبخر والإبقاء على المحرك عند حرارته المثلى."},{"t":"steps","items":[{"title":{"fr":"Démarrage du moteur","de":"Motorstart","ar":"تشغيل المحرك"},"text":{"fr":"Le liquide est froid. Le radiateur est plein, le vase est au niveau maximum. L’air au-dessus du liquide est à la pression atmosphérique.","de":"Das Kühlmittel ist kalt. Der Kühler ist voll, der Behälter steht auf Höchststand. Die Luft über dem Kühlmittel hat Atmosphärendruck.","ar":"السائل بارد. المشعاع ممتلئ والقربة عند المستوى الأقصى. الهواء فوق السائل تحت الضغط الجوي."}},{"title":{"fr":"Moteur en fonctionnement","de":"Motor läuft","ar":"المحرك يعمل"},"text":{"fr":"Le liquide chauffe et se dilate, le niveau monte dans le vase, l’air est comprimé : le volume au-dessus du liquide diminue et la pression du circuit augmente.","de":"Das Kühlmittel erwärmt sich und dehnt sich aus, der Pegel im Behälter steigt, die Luft wird verdichtet: das Volumen über dem Kühlmittel sinkt und der Druck im Kreislauf steigt.","ar":"يسخن السائل ويتمدد، يرتفع المستوى في القربة ويُضغط الهواء: ينقص الحجم فوق السائل ويرتفع ضغط الدورة."}},{"title":{"fr":"Arrêt du moteur","de":"Motor aus","ar":"إيقاف المحرك"},"text":{"fr":"Le liquide se refroidit et son volume diminue. L’air qui était sous pression repousse le liquide : le volume au-dessus du niveau augmente et la pression du circuit diminue.","de":"Das Kühlmittel kühlt ab und sein Volumen sinkt. Die unter Druck stehende Luft drückt das Kühlmittel zurück: das Volumen über dem Pegel steigt und der Druck im Kreislauf sinkt.","ar":"يبرد السائل وينقص حجمه. الهواء الذي كان مضغوطًا يدفع السائل: يزداد الحجم فوق المستوى وينخفض ضغط الدورة."}}]},{"t":"p","fr":"Problème : pendant la mise en température, la pression augmente ; si elle est trop forte, les durites peuvent éclater. Il faut donc limiter la pression : c’est le rôle de la soupape de sécurité (dans le bouchon). | • Clapet de pression : tarage de 0,8 à 1,2 bar. Quand le liquide chauffe et que la pression atteint cette valeur, il s’ouvre pour stabiliser la pression maximale. | • Clapet de dépression : tarage 0,05 bar. Quand le liquide refroidit et que la pression devient trop faible, il s’ouvre et laisse entrer l’air nécessaire pour avoir une pression minimale.","de":"Problem: beim Warmlaufen steigt der Druck; ist er zu hoch, können die Schläuche platzen. Der Druck muss also begrenzt werden: das ist die Aufgabe des Sicherheitsventils (im Deckel). | • Überdruckventil: Einstellwert 0,8 bis 1,2 bar. Erwärmt sich das Kühlmittel und der Druck erreicht diesen Wert, öffnet es und hält den Höchstdruck stabil. | • Unterdruckventil: Einstellwert 0,05 bar. Kühlt das Kühlmittel ab und der Druck wird zu niedrig, öffnet es und lässt die nötige Luft herein, damit ein Mindestdruck bleibt.","ar":"المشكلة: أثناء التسخين يرتفع الضغط، وإذا زاد كثيرًا قد تنفجر الخراطيم. لذلك يجب تحديد الضغط: هذا دور صمام الأمان (في الغطاء). | • صمام الضغط: معايرة من 0.8 إلى 1.2 بار. عندما يسخن السائل ويبلغ الضغط هذه القيمة ينفتح لتثبيت الضغط الأقصى. | • صمام التفريغ (الخلخلة): معايرة 0.05 بار. عندما يبرد السائل ويصبح الضغط ضعيفًا جدًا ينفتح ويُدخل الهواء اللازم للحصول على ضغط أدنى."},{"t":"terms","items":[{"a":"das","de":"Sicherheitsventil","fr":"Soupape de sécurité","ar":"صمام الأمان","r":null,"au":"c311160d328a"},{"a":"das","de":"Überdruckventil","fr":"Clapet de pression","ar":"صمام الضغط","r":null,"au":"b7cb88301394"},{"a":"das","de":"Unterdruckventil","fr":"Clapet de dépression","ar":"صمام التفريغ (الخلخلة)","r":null,"au":"977a1eccaf73"},{"a":"der","de":"Druck","fr":"Pression","ar":"الضغط","r":null,"au":"7a28e3f5a7ed"},{"a":"der","de":"Siedepunkt","fr":"Point d’ébullition","ar":"درجة الغليان","r":null,"au":"4eae83390451"},{"a":"die","de":"Verdampfung","fr":"Vaporisation","ar":"التبخر","r":null,"au":"956f31f8c5f1"},{"a":"der","de":"Füllstand","fr":"Niveau","ar":"المستوى","r":null,"au":"f6b60168ea67"}]},{"t":"mcq","q":{"fr":"Pourquoi met-on le circuit de refroidissement sous pression ?","de":"Warum steht der Kühlkreislauf unter Druck?","ar":"لماذا نضع دورة التبريد تحت الضغط؟"},"opts":[{"fr":"Pour que le liquide se vaporise plus tard (au-dessus de 100 °C)","de":"Damit das Kühlmittel später verdampft (über 100 °C)","ar":"ليتبخر السائل لاحقًا (فوق 100 °م)"},{"fr":"Pour faire plus de bruit","de":"Um mehr Lärm zu machen","ar":"لإحداث ضجيج أكثر"},{"fr":"Pour remplacer la pompe à eau","de":"Um die Wasserpumpe zu ersetzen","ar":"لتعويض مضخة الماء"}],"ans":0}]},{"id":"ref-liquide","title":{"fr":"Leçon 7 – Le liquide de refroidissement","de":"Lektion 7 – Das Kühlmittel","ar":"الدرس 7 – سائل التبريد"},"blocks":[{"t":"teach","fr":"Le liquide de refroidissement refroidit les éléments du moteur soumis aux fortes températures. Il doit : supporter les très basses températures sans se transformer en glace, supporter les températures élevées, et ne pas corroder les matériaux du circuit.","de":"Das Kühlmittel kühlt die stark erhitzten Motorteile. Es muss: sehr tiefe Temperaturen aushalten, ohne zu Eis zu werden, hohe Temperaturen aushalten und die Werkstoffe des Kreislaufs nicht korrodieren.","ar":"سائل التبريد يبرّد أجزاء المحرك المعرّضة لدرجات حرارة عالية. يجب أن: يتحمل درجات الحرارة المنخفضة جدًا دون أن يتجمد، ويتحمل الحرارة المرتفعة، ولا يُسبّب تآكل مواد الدورة."},{"t":"rule","fr":"Composition : eau + éthylène-glycol + additifs. | Attention : on ne doit pas mélanger des liquides de refroidissement différents, ils ne sont pas miscibles.","de":"Zusammensetzung: Wasser + Ethylenglykol + Zusätze. | Achtung: unterschiedliche Kühlmittel dürfen nicht gemischt werden, sie sind nicht mischbar.","ar":"التركيب: ماء + إيثيلين غليكول + إضافات. | انتبه: لا يجب خلط سوائل تبريد مختلفة فهي غير قابلة للامتزاج."},{"t":"terms","items":[{"a":"das","de":"Wasser","fr":"Eau","ar":"الماء","r":null,"au":"86011e261357"},{"a":"das","de":"Ethylenglykol","fr":"Éthylène glycol","ar":"إيثيلين غليكول","r":null,"au":"a0d63cb0548c"},{"a":"das","de":"Additiv","fr":"Additif","ar":"إضافة","r":null,"au":"da128d7ef6dd"},{"a":"das","de":"Frostschutzmittel","fr":"Antigel","ar":"مانع التجمد","r":null,"au":"3b85b6d75887"},{"a":"das","de":"Eis","fr":"Glace","ar":"الجليد","r":null,"au":"6a9fb3368aa1"}]}]},{"id":"ref-videos","title":{"fr":"Vidéo et documents","de":"Video und Dokumente","ar":"فيديو وملفات"},"blocks":[{"t":"video","src":"video/refroidissement-circuit.mp4","cap":{"fr":"Vidéo : le circuit de refroidissement complet","de":"Video: der komplette Kühlkreislauf","ar":"فيديو: دورة التبريد كاملة"}},{"t":"file","src":"files/cours-refroidissement.ppt","kind":"PPT","cap":{"fr":"Cours : le circuit de refroidissement (PowerPoint)","de":"Kurs: der Kühlkreislauf (PowerPoint)","ar":"درس: دورة التبريد (باوربوينت)"}}]}]},{"id":"air","n":6,"title":{"fr":"Le circuit d’air","de":"Der Luftkreislauf","ar":"دورة الهواء"},"goals":{"fr":"Bientôt : le cours sur le circuit d’air (admission, turbo, échappement) | Envoie-moi les fichiers du cours et je construis la leçon.","de":"Bald: der Kurs zum Luftkreislauf (Ansaugen, Turbo, Abgas) | Schick mir die Kursdateien und ich baue die Lektion.","ar":"قريبًا: درس دورة الهواء (السحب، التيربو، العادم) | أرسل لي ملفات الدرس وسأبني الدرس."},"topics":[{"id":"air-bientot","title":{"fr":"Mots déjà vus (en attendant le cours)","de":"Schon bekannte Wörter (bis der Kurs kommt)","ar":"كلمات سبق ذكرها (في انتظار الدرس)"},"blocks":[{"t":"teach","fr":"Ce chapitre est prêt à recevoir ton cours sur le circuit d’air. En attendant, voici les mots du circuit d’air déjà rencontrés dans les images du moteur Diesel.","de":"Dieses Kapitel wartet auf deinen Kurs zum Luftkreislauf. Bis dahin findest du hier die Wörter des Luftkreislaufs, die in den Dieselmotor-Bildern schon vorkamen.","ar":"هذا الفصل جاهز لاستقبال درس دورة الهواء. في الانتظار إليك كلمات دورة الهواء التي ظهرت في صور محرك الديزل."},{"t":"terms","items":[{"a":"der","de":"Ansaugkrümmer","fr":"Collecteur d’admission (air)","ar":"مشعب السحب (الهواء)","r":null,"au":"cefc38c51661"},{"a":"der","de":"Abgaskrümmer","fr":"Collecteur d’échappement (gaz brûlés)","ar":"مشعب العادم (الغازات المحترقة)","r":null,"au":"a1dc3c41565a"},{"a":"der","de":"Turbolader","fr":"Turbo","ar":"الشاحن التوربيني","r":null,"au":"0c9b8ab6128b"},{"a":"das","de":"Einlassventil","fr":"Soupape d’admission","ar":"صمام السحب","r":null,"au":"9a1674a349c0"},{"a":"das","de":"Auslassventil","fr":"Soupape d’échappement","ar":"صمام العادم","r":null,"au":"d3433465e854"},{"a":"der","de":"Auspufftopf","fr":"Pot d’échappement","ar":"كاتم العادم","r":null,"au":"fbf3a89762e6"},{"a":"die","de":"Luft","fr":"Air","ar":"الهواء","r":null,"au":"a3fd9e2c1f3a"},{"a":"das","de":"Abgas","fr":"Gaz d’échappement","ar":"غاز العادم","r":null,"au":"93efca953ac6"},{"a":"der","de":"Luftfilter","fr":"Filtre à air","ar":"مرشح الهواء","r":null,"au":"1067686c9dd6"}]}]}]},{"id":"alimentation","n":7,"title":{"fr":"Circuits d’alimentation en carburant","de":"Kraftstoffversorgung","ar":"دوائر تغذية الوقود"},"goals":{"fr":"Suivre le trajet du carburant du réservoir au moteur | Distinguer Diesel classique, carburateur, injection MPI et Common Rail | Reconnaître les types d’injecteurs | Connaître les bases du diagnostic et de la sécurité","de":"Den Weg des Kraftstoffs vom Tank zum Motor verfolgen | Klassischen Diesel, Vergaser, MPI-Einspritzung und Common Rail unterscheiden | Die Injektortypen erkennen | Grundlagen der Diagnose und Sicherheit kennen","ar":"تتبّع مسار الوقود من الخزان إلى المحرك | التمييز بين الديزل الكلاسيكي والمكربن وحقن MPI والسكة المشتركة | التعرف على أنواع الحواقن | معرفة أساسيات التشخيص والسلامة"},"topics":[{"id":"alim-notions","title":{"fr":"Leçon 1 – Notions générales","de":"Lektion 1 – Allgemeines","ar":"الدرس 1 – مفاهيم عامة"},"blocks":[{"t":"teach","fr":"Le circuit d’alimentation transporte le carburant depuis le réservoir jusqu’au dispositif qui prépare ou dose le mélange, puis jusqu’au moteur. Son architecture dépend du carburant et du type d’injection.","de":"Die Kraftstoffversorgung transportiert den Kraftstoff vom Tank zu der Einrichtung, die das Gemisch aufbereitet oder dosiert, und dann zum Motor. Ihr Aufbau hängt vom Kraftstoff und von der Einspritzart ab.","ar":"دورة التغذية تنقل الوقود من الخزان إلى الجهاز الذي يحضّر الخليط أو يضبط كميته، ثم إلى المحرك. يعتمد تركيبها على نوع الوقود ونوع الحقن."},{"t":"rule","fr":"Deux fonctions à distinguer : | • L’alimentation basse pression TRANSPORTE le carburant. | • Le système d’injection DOSE le carburant et, selon la technologie, le met à haute pression.","de":"Zwei Funktionen unterscheiden: | • Die Niederdruck-Förderung TRANSPORTIERT den Kraftstoff. | • Das Einspritzsystem DOSIERT den Kraftstoff und setzt ihn je nach Technik unter Hochdruck.","ar":"وظيفتان يجب التمييز بينهما: | • التغذية ذات الضغط المنخفض تنقل الوقود. | • نظام الحقن يضبط كمية الوقود ويضغطه حسب التقنية."},{"t":"terms","h":{"fr":"Vocabulaire de base","de":"Grundwortschatz","ar":"مفردات أساسية"},"items":[{"a":"der","de":"Kraftstofftank","fr":"Réservoir","ar":"الخزان","r":null,"au":"3980b9211fc4"},{"a":"die","de":"Förderpumpe","fr":"Pompe d’alimentation","ar":"مضخة التغذية","r":null,"au":"d3cf03a11ee3"},{"a":"der","de":"Kraftstofffilter","fr":"Filtre","ar":"المرشح","r":null,"au":"e62ba1ddd08d"},{"a":"die","de":"Einspritzpumpe","fr":"Pompe d’injection","ar":"مضخة الحقن","r":null,"au":"ede06eaa5bb4"},{"a":"das","de":"Common-Rail","fr":"Rampe commune","ar":"السكة المشتركة","r":null,"au":"89b853ddc2af"},{"a":"die","de":"Einspritzdüse","fr":"Injecteur","ar":"الحاقن","r":null,"au":"0d9dd5a618f0"},{"a":"die","de":"Rücklaufleitung","fr":"Conduite de retour","ar":"خط الرجوع","r":null,"au":"946ef0900ae8"},{"a":"das","de":"Steuergerät","fr":"Calculateur moteur (ECU)","ar":"وحدة التحكم في المحرك (ECU)","r":null,"au":"64ccce106ba6"},{"a":"der","de":"Drucksensor","fr":"Capteur de pression","ar":"حسّاس الضغط","r":null,"au":"fda1d2255bf4"},{"a":"der","de":"Niederdruck","fr":"Basse pression","ar":"الضغط المنخفض","r":null,"au":"bca43fac759f"},{"a":"der","de":"Hochdruck","fr":"Haute pression","ar":"الضغط العالي","r":null,"au":"774b81de872e"}]}]},{"id":"alim-diesel","title":{"fr":"Leçon 2 – Diesel classique à injection mécanique","de":"Lektion 2 – Klassischer Diesel mit mechanischer Einspritzung","ar":"الدرس 2 – الديزل الكلاسيكي ذو الحقن الميكانيكي"},"blocks":[{"t":"teach","fr":"Dans le Diesel classique, la pompe d’injection mécanique dose le gasoil et l’envoie à chaque injecteur par une conduite haute pression individuelle. Elle peut être en ligne ou distributrice (rotative). Suivons le gasoil.","de":"Beim klassischen Diesel dosiert die mechanische Einspritzpumpe den Diesel und schickt ihn über eine eigene Hochdruckleitung zu jeder Einspritzdüse. Sie kann eine Reihen- oder eine Verteilerpumpe (Rotationspumpe) sein. Folgen wir dem Diesel.","ar":"في الديزل الكلاسيكي تضبط مضخة الحقن الميكانيكية كمية الغازوال وترسله إلى كل حاقن عبر أنبوب ضغط عالٍ مستقل. قد تكون مضخة خطية أو موزِّعة (دوّارة). لنتبع الغازوال."},{"t":"anim","kind":"chain","cap":{"fr":"Animation : trajet du gasoil (Diesel classique)","de":"Animation: Weg des Diesels (klassischer Diesel)","ar":"رسم متحرك: مسار الغازوال (ديزل كلاسيكي)"},"nodes":[{"l":{"fr":"Réservoir|gasoil","de":"Kraftstoff-|tank","ar":"خزان|الغازوال"},"p":"start"},{"l":{"fr":"Pompe|d’alimentation","de":"Förder-|pumpe","ar":"مضخة|التغذية"},"p":"low"},{"l":{"fr":"Filtre à|gasoil","de":"Diesel-|filter","ar":"مرشح|الغازوال"},"p":"low"},{"l":{"fr":"Pompe|d’injection","de":"Einspritz-|pumpe","ar":"مضخة|الحقن"},"p":"low"},{"l":{"fr":"Tuyaux|haute pression","de":"Hochdruck-|leitungen","ar":"أنابيب|ضغط عالٍ"},"p":"high"},{"l":{"fr":"Injecteurs|mécaniques","de":"Mechanische|Düsen","ar":"حواقن|ميكانيكية"},"p":"high"},{"l":{"fr":"Chambres de|combustion","de":"Brenn-|räume","ar":"غرف|الاحتراق"},"p":"end"}],"frames":[{"fr":"Le réservoir stocke le gasoil.","de":"Der Tank speichert den Diesel.","ar":"الخزان يخزّن الغازوال.","n":1},{"fr":"La pompe d’alimentation amène le gasoil vers le filtre et la pompe d’injection (basse pression). Elle peut être mécanique ou électrique.","de":"Die Förderpumpe bringt den Diesel zum Filter und zur Einspritzpumpe (Niederdruck). Sie kann mechanisch oder elektrisch sein.","ar":"مضخة التغذية تحمل الغازوال إلى المرشح ومضخة الحقن (ضغط منخفض). قد تكون ميكانيكية أو كهربائية.","n":2},{"fr":"Le filtre retient les impuretés et souvent l’eau. Un filtre colmaté provoque un manque de débit.","de":"Der Filter hält Verunreinigungen und oft Wasser zurück. Ein verstopfter Filter führt zu zu wenig Durchfluss.","ar":"المرشح يحجز الشوائب وغالبًا الماء. المرشح المسدود يسبب نقصًا في التدفق.","n":3},{"fr":"La pompe d’injection dose la quantité, crée la pression d’injection et choisit le moment d’injection pour chaque cylindre.","de":"Die Einspritzpumpe dosiert die Menge, erzeugt den Einspritzdruck und bestimmt den Einspritzzeitpunkt für jeden Zylinder.","ar":"مضخة الحقن تضبط الكمية وتولّد ضغط الحقن وتحدد لحظة الحقن لكل أسطوانة.","n":4},{"fr":"Chaque tuyau haute pression alimente l’injecteur correspondant. L’injecteur s’ouvre quand la pression dépasse son tarage et pulvérise le gasoil.","de":"Jede Hochdruckleitung versorgt die zugehörige Düse. Die Düse öffnet, wenn der Druck ihren Einstelldruck überschreitet, und zerstäubt den Diesel.","ar":"كل أنبوب ضغط عالٍ يغذّي الحاقن المقابل. ينفتح الحاقن عندما يتجاوز الضغط معايرته ويرذّ الغازوال.","n":6},{"fr":"Dans l’air fortement comprimé et chaud, le gasoil s’auto-enflamme : pas de bougie d’allumage.","de":"In der stark verdichteten, heißen Luft entzündet sich der Diesel von selbst: keine Zündkerze.","ar":"في الهواء المضغوط والساخن يشتعل الغازوال ذاتيًا: لا توجد شمعة إشعال.","n":7}]},{"t":"terms","h":{"fr":"Organes et rôles","de":"Bauteile und Aufgaben","ar":"الأعضاء وأدوارها"},"items":[{"a":"der","de":"Kraftstofftank","fr":"Réservoir","ar":"الخزان","r":{"fr":"Stocke le gasoil.","de":"Speichert den Diesel.","ar":"يخزّن الغازوال."},"au":"3980b9211fc4"},{"a":"die","de":"Förderpumpe","fr":"Pompe d’alimentation","ar":"مضخة التغذية","r":{"fr":"Amène le gasoil vers le filtre et la pompe d’injection.","de":"Bringt den Diesel zum Filter und zur Einspritzpumpe.","ar":"تحمل الغازوال إلى المرشح ومضخة الحقن."},"au":"d3cf03a11ee3"},{"a":"der","de":"Dieselfilter","fr":"Filtre à gasoil / décanteur d’eau","ar":"مرشح الغازوال / فاصل الماء","r":{"fr":"Retient les impuretés et souvent l’eau.","de":"Hält Verunreinigungen und oft Wasser zurück.","ar":"يحجز الشوائب وغالبًا الماء."},"au":"f14d80dbb82f"},{"a":"die","de":"Einspritzpumpe","fr":"Pompe d’injection mécanique","ar":"مضخة الحقن الميكانيكية","r":{"fr":"Dose la quantité, crée la pression et distribue le carburant selon l’ordre d’injection.","de":"Dosiert die Menge, erzeugt den Druck und verteilt den Kraftstoff entsprechend der Einspritzfolge.","ar":"تضبط الكمية وتولّد الضغط وتوزّع الوقود حسب ترتيب الحقن."},"au":"ede06eaa5bb4"},{"a":"die","de":"Reiheneinspritzpumpe","fr":"Pompe en ligne","ar":"مضخة حقن خطية","r":null,"au":"b66babf2d67b"},{"a":"die","de":"Verteilereinspritzpumpe","fr":"Pompe distributrice (rotative)","ar":"مضخة حقن موزِّعة (دوّارة)","r":null,"au":"f86b2567b915"},{"a":"die","de":"Hochdruckleitung","fr":"Tuyau haute pression","ar":"أنبوب الضغط العالي","r":null,"au":"82edbd841700"},{"a":"die","de":"Einspritzdüse","fr":"Injecteur mécanique","ar":"الحاقن الميكانيكي","r":{"fr":"S’ouvre lorsque la pression dépasse son tarage et pulvérise le gasoil.","de":"Öffnet, wenn der Druck den Einstelldruck übersteigt, und zerstäubt den Diesel.","ar":"ينفتح عندما يتجاوز الضغط معايرته ويرذّ الغازوال."},"au":"0d9dd5a618f0"},{"a":"die","de":"Glühkerze","fr":"Bougie de préchauffage","ar":"شمعة التسخين المسبق","r":{"fr":"Aide surtout au démarrage à froid ; elle ne crée pas d’étincelle.","de":"Hilft vor allem beim Kaltstart; sie erzeugt keinen Zündfunken.","ar":"تساعد خاصة في التشغيل على البارد؛ ولا تُنتج شرارة."},"au":"8925e8760ebc"}]},{"t":"rule","fr":"À retenir : un Diesel classique n’utilise pas de bougie d’allumage. Les bougies de préchauffage, si le moteur en est équipé, facilitent surtout le démarrage à froid.","de":"Merken: Ein klassischer Diesel hat keine Zündkerze. Glühkerzen, falls vorhanden, erleichtern vor allem den Kaltstart.","ar":"للحفظ: الديزل الكلاسيكي لا يستعمل شمعة إشعال. شمعات التسخين المسبق، إن وُجدت، تسهّل خاصة التشغيل على البارد."},{"t":"mcq","q":{"fr":"Quelle pièce dose la quantité de gasoil et crée la pression d’injection (Diesel classique) ?","de":"Welches Teil dosiert die Dieselmenge und erzeugt den Einspritzdruck (klassischer Diesel)?","ar":"أي قطعة تضبط كمية الغازوال وتولّد ضغط الحقن (ديزل كلاسيكي)؟"},"opts":[{"fr":"La pompe d’injection","de":"Die Einspritzpumpe","ar":"مضخة الحقن"},{"fr":"Le filtre à gasoil","de":"Der Dieselfilter","ar":"مرشح الغازوال"},{"fr":"Le réservoir","de":"Der Tank","ar":"الخزان"}],"ans":0}]},{"id":"alim-carbu","title":{"fr":"Leçon 3 – Essence classique à carburateur","de":"Lektion 3 – Klassischer Benziner mit Vergaser","ar":"الدرس 3 – البنزين الكلاسيكي بالمكربن"},"blocks":[{"t":"teach","fr":"Sur un moteur essence classique, la pompe amène l’essence à basse pression jusqu’au carburateur. C’est lui qui dose l’essence et la mélange à l’air avant l’admission dans les cylindres.","de":"Bei einem klassischen Benzinmotor bringt die Pumpe das Benzin mit niedrigem Druck zum Vergaser. Er dosiert das Benzin und mischt es vor dem Ansaugen in die Zylinder mit Luft.","ar":"في محرك البنزين الكلاسيكي تحمل المضخة البنزين بضغط منخفض إلى المكربن. وهو الذي يضبط كمية البنزين ويخلطه بالهواء قبل دخوله إلى الأسطوانات."},{"t":"anim","kind":"chain","cap":{"fr":"Animation : trajet de l’essence (carburateur)","de":"Animation: Weg des Benzins (Vergaser)","ar":"رسم متحرك: مسار البنزين (مكربن)"},"nodes":[{"l":{"fr":"Réservoir|essence","de":"Benzin-|tank","ar":"خزان|البنزين"},"p":"start"},{"l":{"fr":"Pompe à|essence","de":"Benzin-|pumpe","ar":"مضخة|البنزين"},"p":"low"},{"l":{"fr":"Filtre à|essence","de":"Benzin-|filter","ar":"مرشح|البنزين"},"p":"low"},{"l":{"fr":"Carburateur|dosage air/essence","de":"Vergaser|Dosierung","ar":"المكربن|ضبط هواء/بنزين"},"p":"low"},{"l":{"fr":"Collecteur|d’admission","de":"Saugrohr","ar":"مشعب|السحب"},"p":"air"},{"l":{"fr":"Cylindres|mélange comprimé","de":"Zylinder|Gemisch verdichtet","ar":"الأسطوانات|خليط مضغوط"},"p":"air"},{"l":{"fr":"Bougie|étincelle","de":"Zündkerze|Funke","ar":"الشمعة|شرارة"},"p":"spark"}],"frames":[{"fr":"Le réservoir stocke l’essence.","de":"Der Tank speichert das Benzin.","ar":"الخزان يخزّن البنزين.","n":1},{"fr":"La pompe à essence (mécanique ou électrique) transporte l’essence à basse pression.","de":"Die Benzinpumpe (mechanisch oder elektrisch) fördert das Benzin mit niedrigem Druck.","ar":"مضخة البنزين (ميكانيكية أو كهربائية) تنقل البنزين بضغط منخفض.","n":2},{"fr":"Le filtre retient les particules qui pourraient obstruer les conduits et les gicleurs.","de":"Der Filter hält Partikel zurück, die Leitungen und Düsen verstopfen könnten.","ar":"المرشح يحجز الجزيئات التي قد تسدّ القنوات والمرذّات.","n":3},{"fr":"Le carburateur dose l’essence et la mélange à l’air : la dépression au venturi aspire l’essence par les gicleurs.","de":"Der Vergaser dosiert das Benzin und mischt es mit Luft: der Unterdruck am Venturirohr saugt das Benzin durch die Düsen.","ar":"المكربن يضبط البنزين ويخلطه بالهواء: التفريغ عند الفنتوري يسحب البنزين من المرذّات.","n":4},{"fr":"Le collecteur d’admission distribue le mélange air-essence aux cylindres.","de":"Das Saugrohr verteilt das Luft-Benzin-Gemisch auf die Zylinder.","ar":"مشعب السحب يوزّع خليط الهواء والبنزين على الأسطوانات.","n":5},{"fr":"Le mélange est comprimé dans le cylindre.","de":"Das Gemisch wird im Zylinder verdichtet.","ar":"يُضغط الخليط داخل الأسطوانة.","n":6},{"fr":"La bougie produit l’étincelle qui enflamme le mélange comprimé.","de":"Die Zündkerze erzeugt den Funken, der das verdichtete Gemisch entzündet.","ar":"الشمعة تُنتج الشرارة التي تشعل الخليط المضغوط.","n":7}]},{"t":"terms","h":{"fr":"Organes et rôles","de":"Bauteile und Aufgaben","ar":"الأعضاء وأدوارها"},"items":[{"a":"die","de":"Benzinpumpe","fr":"Pompe à essence","ar":"مضخة البنزين","r":{"fr":"Transporte l’essence du réservoir au carburateur (souvent mécanique sur les anciens véhicules).","de":"Fördert das Benzin vom Tank zum Vergaser (bei älteren Fahrzeugen oft mechanisch).","ar":"تنقل البنزين من الخزان إلى المكربن (غالبًا ميكانيكية في السيارات القديمة)."},"au":"ca5e52affa52"},{"a":"der","de":"Benzinfilter","fr":"Filtre à essence","ar":"مرشح البنزين","r":{"fr":"Retient les particules avant les gicleurs.","de":"Hält Partikel vor den Düsen zurück.","ar":"يحجز الجزيئات قبل المرذّات."},"au":"f263503400af"},{"a":"der","de":"Vergaser","fr":"Carburateur","ar":"المكربن (الكاربوراتور)","r":{"fr":"Dose l’essence et la mélange à l’air grâce aux gicleurs, au venturi et au papillon.","de":"Dosiert das Benzin und mischt es mit Luft mithilfe von Düsen, Venturirohr und Drosselklappe.","ar":"يضبط البنزين ويخلطه بالهواء بفضل المرذّات والفنتوري والخانق."},"au":"5c7656a04efe"},{"a":"die","de":"Drosselklappe","fr":"Papillon des gaz","ar":"الخانق (فراشة الوقود)","r":{"fr":"Règle la quantité d’air admise, donc la charge du moteur.","de":"Regelt die angesaugte Luftmenge und damit die Motorlast.","ar":"تضبط كمية الهواء الداخلة وبالتالي حمل المحرك."},"au":"f1a23b064830"},{"a":"die","de":"Starterklappe","fr":"Starter / enrichisseur","ar":"الستارتر (مُغني الخليط)","r":{"fr":"Enrichit le mélange pour faciliter le démarrage à froid.","de":"Macht das Gemisch fetter, um den Kaltstart zu erleichtern.","ar":"يُغني الخليط لتسهيل التشغيل على البارد."},"au":"2e023718b7dd"},{"a":"das","de":"Venturirohr","fr":"Venturi","ar":"الفنتوري","r":null,"au":"2aecc1007697"},{"a":"die","de":"Vergaserdüse","fr":"Gicleur","ar":"المرذّ (الجيكلور)","r":null,"au":"895082d1606f"},{"a":"die","de":"Schwimmerkammer","fr":"Cuve (niveau constant)","ar":"حجرة العوامة (الخزان الصغير)","r":null,"au":"cf8d8f19ce56"},{"a":"der","de":"Ansaugkrümmer","fr":"Collecteur d’admission","ar":"مشعب السحب","r":{"fr":"Distribue le mélange air-essence aux cylindres.","de":"Verteilt das Luft-Benzin-Gemisch auf die Zylinder.","ar":"يوزّع خليط الهواء والبنزين على الأسطوانات."},"au":"cefc38c51661"},{"a":"die","de":"Zündkerze","fr":"Bougie d’allumage","ar":"شمعة الإشعال","r":{"fr":"Produit l’étincelle qui enflamme le mélange air-essence comprimé.","de":"Erzeugt den Funken, der das verdichtete Luft-Benzin-Gemisch entzündet.","ar":"تُنتج الشرارة التي تشعل خليط الهواء والبنزين المضغوط."},"au":"b8b95d163946"}]}]},{"id":"alim-mpi","title":{"fr":"Leçon 4 – Essence à injection électronique (MPI)","de":"Lektion 4 – Benziner mit elektronischer Einspritzung (MPI)","ar":"الدرس 4 – البنزين بالحقن الإلكتروني (MPI)"},"blocks":[{"t":"teach","fr":"L’injection électronique remplace le carburateur par des injecteurs commandés par un calculateur. En MPI (injection indirecte), les injecteurs pulvérisent l’essence dans les conduits d’admission, près de la soupape. Le calculateur décide de la durée d’ouverture des injecteurs d’après les capteurs.","de":"Die elektronische Einspritzung ersetzt den Vergaser durch Einspritzventile, die ein Steuergerät ansteuert. Bei MPI (indirekte Einspritzung) spritzen die Ventile das Benzin in die Ansaugkanäle nahe dem Ventil. Das Steuergerät bestimmt anhand der Sensoren, wie lange die Ventile öffnen.","ar":"الحقن الإلكتروني يستبدل المكربن بحواقن تتحكم بها وحدة تحكم. في MPI (الحقن غير المباشر) ترذّ الحواقن البنزين في قنوات السحب قرب الصمام. تحدد وحدة التحكم مدة فتح الحواقن بناءً على الحسّاسات."},{"t":"anim","kind":"chain","cap":{"fr":"Animation : trajet de l’essence (injection MPI)","de":"Animation: Weg des Benzins (MPI-Einspritzung)","ar":"رسم متحرك: مسار البنزين (حقن MPI)"},"ecu":{"node":5,"label":{"fr":"Calculateur (ECU)","de":"Steuergerät (ECU)","ar":"وحدة التحكم (ECU)"}},"nodes":[{"l":{"fr":"Réservoir|essence","de":"Benzin-|tank","ar":"خزان|البنزين"},"p":"start"},{"l":{"fr":"Pompe électrique|basse pression","de":"Elektrische|Pumpe","ar":"مضخة كهربائية|ضغط منخفض"},"p":"low"},{"l":{"fr":"Filtre|essence","de":"Benzin-|filter","ar":"مرشح|البنزين"},"p":"low"},{"l":{"fr":"Rampe|d’injection","de":"Einspritz-|leiste","ar":"سكة|الحقن"},"p":"low"},{"l":{"fr":"Injecteurs|MPI","de":"MPI-|Einspritzventile","ar":"حواقن|MPI"},"p":"low"},{"l":{"fr":"Admission|air + essence","de":"Ansaugkanal|Luft + Benzin","ar":"السحب|هواء + بنزين"},"p":"air"},{"l":{"fr":"Cylindres|combustion","de":"Zylinder|Verbrennung","ar":"الأسطوانات|الاحتراق"},"p":"end"}],"frames":[{"fr":"Le réservoir stocke l’essence.","de":"Der Tank speichert das Benzin.","ar":"الخزان يخزّن البنزين.","n":1},{"fr":"La pompe électrique envoie l’essence sous pression dans le circuit.","de":"Die elektrische Pumpe schickt das Benzin unter Druck in den Kreislauf.","ar":"المضخة الكهربائية ترسل البنزين تحت الضغط في الدورة.","n":2},{"fr":"Le filtre retient les impuretés.","de":"Der Filter hält Verunreinigungen zurück.","ar":"المرشح يحجز الشوائب.","n":3},{"fr":"La rampe d’injection distribue le carburant aux injecteurs.","de":"Die Einspritzleiste verteilt den Kraftstoff auf die Einspritzventile.","ar":"سكة الحقن توزّع الوقود على الحواقن.","n":4},{"fr":"Le calculateur (ECU) commande l’ouverture des injecteurs d’après les capteurs ; ils pulvérisent l’essence dans le conduit d’admission.","de":"Das Steuergerät (ECU) steuert die Öffnung der Einspritzventile anhand der Sensoren; sie spritzen das Benzin in den Ansaugkanal.","ar":"وحدة التحكم (ECU) تتحكم في فتح الحواقن بحسب الحسّاسات؛ فترذّ البنزين في قناة السحب.","n":5},{"fr":"L’air et l’essence se mélangent dans l’admission.","de":"Luft und Benzin mischen sich im Ansaugkanal.","ar":"يمتزج الهواء والبنزين في قناة السحب.","n":6},{"fr":"Le mélange entre dans les cylindres pour la combustion.","de":"Das Gemisch strömt zur Verbrennung in die Zylinder.","ar":"يدخل الخليط إلى الأسطوانات للاحتراق.","n":7}]},{"t":"terms","h":{"fr":"Organes et rôles","de":"Bauteile und Aufgaben","ar":"الأعضاء وأدوارها"},"items":[{"a":"die","de":"elektrische Kraftstoffpumpe","fr":"Pompe électrique","ar":"المضخة الكهربائية","r":{"fr":"Envoie l’essence sous pression dans le circuit.","de":"Schickt das Benzin unter Druck in den Kreislauf.","ar":"ترسل البنزين تحت الضغط في الدورة."},"au":"2f5aadb96d2b"},{"a":"die","de":"Einspritzleiste","fr":"Rampe d’injection","ar":"سكة الحقن","r":{"fr":"Distribue le carburant aux injecteurs.","de":"Verteilt den Kraftstoff auf die Einspritzventile.","ar":"توزّع الوقود على الحواقن."},"au":"6bbf85db49d1"},{"a":"das","de":"Saugrohr-Einspritzventil","fr":"Injecteur MPI / PFI","ar":"حاقن MPI","r":{"fr":"Pulvérise l’essence dans le conduit d’admission, près de la soupape.","de":"Spritzt das Benzin in den Ansaugkanal nahe dem Ventil.","ar":"يرذّ البنزين في قناة السحب قرب الصمام."},"au":"cb7344f53def"},{"a":"das","de":"Steuergerät","fr":"Calculateur moteur (ECU)","ar":"وحدة التحكم في المحرك (ECU)","r":{"fr":"Commande la durée d’ouverture des injecteurs.","de":"Steuert die Öffnungsdauer der Einspritzventile.","ar":"تتحكم في مدة فتح الحواقن."},"au":"64ccce106ba6"},{"a":"der","de":"Motorsensor","fr":"Capteurs moteur","ar":"حسّاسات المحرك","r":{"fr":"Transmettent au calculateur les informations de fonctionnement.","de":"Übermitteln dem Steuergerät die Betriebsinformationen.","ar":"تنقل إلى وحدة التحكم معلومات التشغيل."},"au":"19c6e08164d7"},{"a":"die","de":"Saugrohreinspritzung","fr":"Injection indirecte (MPI)","ar":"الحقن غير المباشر (MPI)","r":null,"au":"86d50719b7ea"},{"a":"die","de":"Benzin-Direkteinspritzung","fr":"Injection directe essence (GDI / FSI / TSI)","ar":"الحقن المباشر للبنزين (GDI)","r":null,"au":"a4a300b67feb"}]},{"t":"rule","fr":"MPI : l’essence est injectée dans l’admission. GDI / FSI / TSI : l’injecteur pulvérise directement dans le cylindre et une pompe haute pression est généralement présente.","de":"MPI: das Benzin wird in den Ansaugkanal eingespritzt. GDI / FSI / TSI: das Einspritzventil spritzt direkt in den Zylinder und es ist in der Regel eine Hochdruckpumpe vorhanden.","ar":"MPI: يُحقن البنزين في قناة السحب. GDI / FSI / TSI: يرذّ الحاقن مباشرة في الأسطوانة وتوجد عادةً مضخة ضغط عالٍ."},{"t":"yt","id":"4CqB6SK4TQM","cap":{"fr":"Vidéo (Bosch Auto, en français) : tout savoir sur l’injection directe essence. Il faut une connexion Internet.","de":"Video (Bosch Auto, auf Französisch): alles über die Benzin-Direkteinspritzung. Internetverbindung nötig.","ar":"فيديو (Bosch Auto، بالفرنسية): كل شيء عن الحقن المباشر للبنزين. يحتاج إلى اتصال بالإنترنت."}}]},{"id":"alim-cr","title":{"fr":"Leçon 5 – Diesel Common Rail","de":"Lektion 5 – Diesel Common Rail","ar":"الدرس 5 – الديزل بالسكة المشتركة"},"blocks":[{"t":"teach","fr":"Le Common Rail est un système d’injection Diesel à commande électronique. La pompe haute pression alimente une rampe commune qui garde le gasoil sous pression. Le calculateur commande chaque injecteur individuellement et surveille la pression grâce à un capteur et à un régulateur.","de":"Common Rail ist ein elektronisch gesteuertes Diesel-Einspritzsystem. Die Hochdruckpumpe versorgt eine gemeinsame Leiste (Rail), die den Diesel unter Druck hält. Das Steuergerät steuert jede Einspritzdüse einzeln und überwacht den Druck mit einem Sensor und einem Regler.","ar":"السكة المشتركة نظام حقن ديزل بتحكم إلكتروني. تغذي المضخة عالية الضغط سكة مشتركة تحتفظ بالغازوال تحت الضغط. تتحكم وحدة التحكم في كل حاقن على حدة وتراقب الضغط بفضل حسّاس ومنظّم."},{"t":"anim","kind":"chain","cap":{"fr":"Animation : trajet du gasoil (Common Rail)","de":"Animation: Weg des Diesels (Common Rail)","ar":"رسم متحرك: مسار الغازوال (السكة المشتركة)"},"ecu":{"node":5,"label":{"fr":"Calculateur + capteur de pression","de":"Steuergerät + Drucksensor","ar":"وحدة التحكم + حسّاس الضغط"}},"nodes":[{"l":{"fr":"Réservoir|gasoil","de":"Kraftstoff-|tank","ar":"خزان|الغازوال"},"p":"start"},{"l":{"fr":"Pompe de gavage|(si équipée)","de":"Vorförder-|pumpe","ar":"مضخة التغذية|(إن وُجدت)"},"p":"low"},{"l":{"fr":"Filtre à|gasoil","de":"Diesel-|filter","ar":"مرشح|الغازوال"},"p":"low"},{"l":{"fr":"Pompe haute|pression","de":"Hochdruck-|pumpe","ar":"المضخة عالية|الضغط"},"p":"low"},{"l":{"fr":"Rampe commune|Common Rail","de":"Gemeinsame|Leiste (Rail)","ar":"السكة المشتركة|Common Rail"},"p":"high"},{"l":{"fr":"Injecteurs|électroniques","de":"Elektronische|Injektoren","ar":"حواقن|إلكترونية"},"p":"high"},{"l":{"fr":"Cylindres|combustion","de":"Zylinder|Verbrennung","ar":"الأسطوانات|الاحتراق"},"p":"end"}],"frames":[{"fr":"Le carburant est aspiré ou envoyé depuis le réservoir.","de":"Der Kraftstoff wird aus dem Tank angesaugt oder gefördert.","ar":"يُسحب الوقود أو يُرسل من الخزان.","n":1},{"fr":"La pompe de gavage (si le véhicule en a une) alimente le circuit basse pression.","de":"Die Vorförderpumpe (falls vorhanden) versorgt den Niederdruckkreis.","ar":"مضخة التغذية (إن وُجدت) تغذّي دائرة الضغط المنخفض.","n":2},{"fr":"Le filtre retient les particules et sépare l’eau selon son équipement.","de":"Der Filter hält Partikel zurück und scheidet je nach Ausstattung Wasser ab.","ar":"المرشح يحجز الجزيئات ويفصل الماء حسب تجهيزه.","n":3},{"fr":"La pompe haute pression élève la pression du gasoil.","de":"Die Hochdruckpumpe erhöht den Druck des Diesels.","ar":"المضخة عالية الضغط ترفع ضغط الغازوال.","n":4},{"fr":"La rampe commune sert de réserve sous haute pression et alimente tous les injecteurs.","de":"Das Rail dient als Hochdruckspeicher und versorgt alle Injektoren.","ar":"السكة المشتركة مخزن تحت ضغط عالٍ وتغذّي كل الحواقن.","n":5},{"fr":"Le calculateur lit la pression du rail et pilote chaque injecteur selon la demande du moteur : pré-injections, injection principale, post-injections.","de":"Das Steuergerät liest den Raildruck und steuert jeden Injektor nach dem Motorbedarf: Voreinspritzung, Haupteinspritzung, Nacheinspritzung.","ar":"وحدة التحكم تقرأ ضغط السكة وتتحكم في كل حاقن حسب طلب المحرك: حقن مسبق، حقن رئيسي، حقن لاحق.","n":6},{"fr":"Le gasoil est pulvérisé dans les cylindres ; une partie peut revenir par la conduite de retour.","de":"Der Diesel wird in die Zylinder gespritzt; ein Teil kann über die Rücklaufleitung zurückfließen.","ar":"يُرذّ الغازوال في الأسطوانات؛ وقد يعود جزء منه عبر خط الرجوع.","n":7}]},{"t":"warn","fr":"Ne jamais desserrer une conduite haute pression Common Rail moteur tournant ou pendant le démarrage. Le jet de gasoil peut pénétrer la peau et provoquer des blessures graves. Suivre la procédure du constructeur pour dépressuriser le circuit.","de":"Eine Common-Rail-Hochdruckleitung niemals bei laufendem Motor oder während des Startens lösen. Der Dieselstrahl kann die Haut durchdringen und schwere Verletzungen verursachen. Zum Druckabbau die Herstellervorgaben befolgen.","ar":"لا تفكّ أبدًا أنبوب الضغط العالي للسكة المشتركة والمحرك يعمل أو أثناء التشغيل. فنفثة الغازوال قد تخترق الجلد وتسبب إصابات خطيرة. اتبع إجراء الصانع لتفريغ الضغط من الدورة."},{"t":"terms","h":{"fr":"Organes, fonction et signes de défaut","de":"Bauteile, Funktion und Fehlersymptome","ar":"الأعضاء ووظائفها وأعراض العطل"},"items":[{"a":"die","de":"Vorförderpumpe","fr":"Pompe de gavage","ar":"مضخة التغذية المساعدة (gavage)","r":{"fr":"Fournit le carburant à la pompe HP, si présente. Défaut : démarrage difficile, débit insuffisant, moteur qui cale.","de":"Versorgt die Hochdruckpumpe mit Kraftstoff, falls vorhanden. Fehler: schwerer Start, zu wenig Durchfluss, Motor geht aus.","ar":"تزوّد المضخة عالية الضغط بالوقود إن وُجدت. العطل: صعوبة التشغيل، تدفق غير كافٍ، المحرك يتوقف."},"au":"15bc70f1e4e1"},{"a":"der","de":"Dieselfilter","fr":"Filtre à gasoil","ar":"مرشح الغازوال","r":{"fr":"Filtre les particules et sépare l’eau. Défaut : manque de puissance, pression insuffisante.","de":"Filtert Partikel und scheidet Wasser ab. Fehler: Leistungsmangel, zu wenig Druck.","ar":"يرشّح الجزيئات ويفصل الماء. العطل: نقص في القدرة، ضغط غير كافٍ."},"au":"f14d80dbb82f"},{"a":"die","de":"Hochdruckpumpe","fr":"Pompe haute pression (HP)","ar":"المضخة عالية الضغط","r":{"fr":"Élève la pression du carburant pour l’injection. Défaut : pression de rampe trop basse, démarrage impossible.","de":"Erhöht den Kraftstoffdruck für die Einspritzung. Fehler: Raildruck zu niedrig, Start unmöglich.","ar":"ترفع ضغط الوقود للحقن. العطل: ضغط السكة منخفض جدًا، التشغيل مستحيل."},"au":"0acb67b70203"},{"a":"das","de":"Mengenregelventil","fr":"IMV / MPROP ou régulateur","ar":"منظّم التدفق (IMV / MPROP)","r":{"fr":"Dose le carburant admis dans la pompe ou régule la pression. Défaut : pression instable ou valeur demandée non atteinte.","de":"Dosiert den in die Pumpe fließenden Kraftstoff oder regelt den Druck. Fehler: Druck instabil oder Sollwert nicht erreicht.","ar":"يضبط الوقود الداخل إلى المضخة أو ينظّم الضغط. العطل: ضغط غير مستقر أو عدم بلوغ القيمة المطلوبة."},"au":"3a916bf5d105"},{"a":"das","de":"Common-Rail","fr":"Rampe commune","ar":"السكة المشتركة","r":{"fr":"Accumule et distribue le carburant sous haute pression. Défaut : fuite ou problème de pression.","de":"Speichert und verteilt den Kraftstoff unter Hochdruck. Fehler: Leckage oder Druckproblem.","ar":"تخزّن الوقود وتوزّعه تحت ضغط عالٍ. العطل: تسرّب أو مشكلة في الضغط."},"au":"89b853ddc2af"},{"a":"der","de":"Raildrucksensor","fr":"Capteur de pression rail","ar":"حسّاس ضغط السكة","r":{"fr":"Transmet au calculateur la pression mesurée. Défaut : valeur incohérente, défaut électrique.","de":"Meldet dem Steuergerät den gemessenen Druck. Fehler: unplausibler Wert, elektrischer Fehler.","ar":"ينقل إلى وحدة التحكم الضغط المقاس. العطل: قيمة غير منطقية، عطل كهربائي."},"au":"bbf993075b88"},{"a":"das","de":"Steuergerät","fr":"Calculateur moteur (ECU)","ar":"وحدة التحكم (ECU)","r":{"fr":"Calcule le moment et la durée d’injection à partir des capteurs. Défaut : commande d’injection absente ou limitée.","de":"Berechnet Zeitpunkt und Dauer der Einspritzung aus den Sensordaten. Fehler: Einspritzansteuerung fehlt oder ist begrenzt.","ar":"تحسب لحظة الحقن ومدته من الحسّاسات. العطل: غياب أو تقييد أمر الحقن."},"au":"64ccce106ba6"},{"a":"der","de":"Injektor","fr":"Injecteurs","ar":"الحواقن","r":{"fr":"Pulvérisent précisément le carburant dans chaque cylindre. Défaut : ratés, fumée, claquement, retour excessif, démarrage difficile.","de":"Spritzen den Kraftstoff
