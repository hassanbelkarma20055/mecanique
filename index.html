 präzise in jeden Zylinder. Fehler: Aussetzer, Rauch, Klopfen, zu viel Rücklauf, schwerer Start.","ar":"ترذّ الوقود بدقة في كل أسطوانة. العطل: تقطّع، دخان، طقطقة، رجوع مفرط، صعوبة التشغيل."},"au":"50a66caf2575"},{"a":"die","de":"Rücklaufleitung","fr":"Conduite de retour","ar":"خط الرجوع","r":{"fr":"Ramène le carburant de fuite vers le circuit prévu. Défaut : un retour excessif peut empêcher la pression de monter au démarrage.","de":"Führt Leckkraftstoff in den vorgesehenen Kreis zurück. Fehler: zu viel Rücklauf kann den Druckaufbau beim Start verhindern.","ar":"يعيد وقود التسرّب إلى الدائرة المخصصة. العطل: الرجوع المفرط قد يمنع ارتفاع الضغط عند التشغيل."},"au":"946ef0900ae8"}]}]},{"id":"alim-injecteurs","title":{"fr":"Leçon 6 – Les types d’injecteurs","de":"Lektion 6 – Die Injektortypen","ar":"الدرس 6 – أنواع الحواقن"},"blocks":[{"t":"teach","fr":"Pour décrire un injecteur, on distingue trois choses : son mode de commande (mécanique ou électronique), sa technologie interne (solénoïde ou piézoélectrique) et son emplacement d’injection (indirecte ou directe). Ne pas confondre le type de commande et la forme de la buse.","de":"Um einen Injektor zu beschreiben, unterscheidet man drei Dinge: die Ansteuerung (mechanisch oder elektronisch), die innere Technik (Magnetspule oder Piezo) und den Einspritzort (indirekt oder direkt). Ansteuerungsart und Düsenform nicht verwechseln.","ar":"لوصف الحاقن نميّز ثلاثة أمور: طريقة التحكم (ميكانيكية أو إلكترونية)، والتقنية الداخلية (سولينويد أو بيزو)، وموضع الحقن (غير مباشر أو مباشر). لا نخلط بين نوع التحكم وشكل الفوهة."},{"t":"table","head":[{"fr":"Type","de":"Typ","ar":"النوع"},{"fr":"Principe","de":"Prinzip","ar":"المبدأ"},{"fr":"Utilisation","de":"Verwendung","ar":"الاستعمال"}],"rows":[[{"fr":"Mécanique Diesel","de":"Mechanisch (Diesel)","ar":"ميكانيكي (ديزل)"},{"fr":"L’aiguille s’ouvre quand la pression dépasse le tarage.","de":"Die Nadel öffnet, wenn der Druck den Einstelldruck übersteigt.","ar":"تنفتح الإبرة عندما يتجاوز الضغط المعايرة."},{"fr":"Diesel classique","de":"Klassischer Diesel","ar":"ديزل كلاسيكي"}],[{"fr":"Électromagnétique (solénoïde)","de":"Elektromagnetisch (Magnetspule)","ar":"كهرومغناطيسي (سولينويد)"},{"fr":"Une bobine commande le mécanisme d’injection. Robuste et très répandu.","de":"Eine Spule steuert den Einspritzmechanismus. Robust und weit verbreitet.","ar":"ملف يتحكم في آلية الحقن. متين وشائع جدًا."},{"fr":"Common Rail Diesel, certains moteurs essence","de":"Common-Rail-Diesel, einige Benzinmotoren","ar":"ديزل السكة المشتركة، وبعض محركات البنزين"}],[{"fr":"Piézoélectrique","de":"Piezoelektrisch","ar":"كهرضغطي (بيزو)"},{"fr":"Un empilement piézoélectrique se déforme sous tension : réponse très rapide et contrôle précis.","de":"Ein Piezo-Stapel verformt sich unter Spannung: sehr schnelle Reaktion und präzise Steuerung.","ar":"كومة بيزو تتشوّه تحت الجهد: استجابة سريعة جدًا وتحكم دقيق."},{"fr":"Certains Common Rail Diesel","de":"Einige Common-Rail-Diesel","ar":"بعض أنظمة السكة المشتركة"}],[{"fr":"MPI / PFI","de":"MPI / PFI","ar":"MPI / PFI"},{"fr":"Pulvérise l’essence dans l’admission, avant la soupape.","de":"Spritzt das Benzin in den Ansaugkanal vor dem Ventil.","ar":"يرذّ البنزين في قناة السحب قبل الصمام."},{"fr":"Essence à injection indirecte","de":"Benziner mit indirekter Einspritzung","ar":"بنزين بالحقن غير المباشر"}],[{"fr":"GDI / FSI / TSI","de":"GDI / FSI / TSI","ar":"GDI / FSI / TSI"},{"fr":"Pulvérise l’essence directement dans le cylindre, à plus haute pression ; il faut une pompe HP.","de":"Spritzt das Benzin direkt in den Zylinder mit höherem Druck; eine Hochdruckpumpe ist nötig.","ar":"يرذّ البنزين مباشرة في الأسطوانة بضغط أعلى؛ ولا بد من مضخة عالية الضغط."},{"fr":"Essence à injection directe","de":"Benziner mit Direkteinspritzung","ar":"بنزين بالحقن المباشر"}],[{"fr":"Injecteur-pompe (UIS)","de":"Pumpe-Düse (UIS)","ar":"حاقن-مضخة (UIS)"},{"fr":"Une petite pompe HP est intégrée à chaque injecteur : la pression est créée sur place, sans rampe commune.","de":"Eine kleine Hochdruckpumpe ist in jede Düse integriert: der Druck entsteht vor Ort, ohne gemeinsames Rail.","ar":"مضخة صغيرة عالية الضغط مدمجة في كل حاقن: يتولد الضغط محليًا دون سكة مشتركة."},{"fr":"Certains anciens moteurs Diesel","de":"Einige ältere Dieselmotoren","ar":"بعض محركات الديزل القديمة"}]]},{"t":"terms","h":{"fr":"Éléments d’un injecteur","de":"Teile eines Injektors","ar":"أجزاء الحاقن"},"items":[{"a":"der","de":"Injektorkörper","fr":"Corps","ar":"الجسم","r":null,"au":"a94e381d9a90"},{"a":"der","de":"elektrische Anschluss","fr":"Connecteur électrique","ar":"الموصل الكهربائي","r":null,"au":"099aefae6870"},{"a":"die","de":"Magnetspule","fr":"Bobine","ar":"الملف","r":null,"au":"4db00f71bd2b"},{"a":"der","de":"Piezo-Aktor","fr":"Actionneur piézoélectrique","ar":"المشغّل الكهرضغطي","r":null,"au":"e1cd700d89a6"},{"a":"das","de":"Steuerventil","fr":"Valve de commande","ar":"صمام التحكم","r":null,"au":"9924bd0f2303"},{"a":"die","de":"Düsennadel","fr":"Aiguille","ar":"الإبرة","r":null,"au":"b23f01767649"},{"a":"die","de":"Feder","fr":"Ressort","ar":"النابض","r":null,"au":"3f20c2dfe017"},{"a":"die","de":"Düse","fr":"Buse","ar":"الفوهة","r":{"fr":"Transforme le carburant en fines gouttelettes et oriente le jet. Le nombre, le diamètre et l’orientation des trous varient selon le moteur.","de":"Wandelt den Kraftstoff in feine Tröpfchen um und richtet den Strahl aus. Zahl, Durchmesser und Richtung der Löcher hängen vom Motor ab.","ar":"تحوّل الوقود إلى قطيرات دقيقة وتوجّه النفثة. يختلف عدد الثقوب وقطرها واتجاهها حسب المحرك."},"au":"4a8ec672f776"},{"a":"das","de":"Spritzloch","fr":"Orifice de pulvérisation","ar":"ثقب الرذاذ","r":null,"au":"ee2ea2e9169e"}]}]},{"id":"alim-compare","title":{"fr":"Leçon 7 – Classique ou Common Rail ?","de":"Lektion 7 – Klassisch oder Common Rail?","ar":"الدرس 7 – كلاسيكي أم سكة مشتركة؟"},"blocks":[{"t":"table","head":[{"fr":"Critère","de":"Kriterium","ar":"المعيار"},{"fr":"Diesel classique","de":"Klassischer Diesel","ar":"ديزل كلاسيكي"},{"f ach Motor.","ar":"حقن مسبق وحقن رئيسي وحقن لاحق حسب المحرك."}],[{"fr":"Diagnostic","de":"Diagnose","ar":"التشخيص"},{"fr":"Contrôles mécaniques : tarage, calage, alimentation.","de":"Mechanische Prüfungen: Einstelldruck, Förderbeginn, Versorgung.","ar":"فحوص ميكانيكية: المعايرة، الضبط، التغذية."},{"fr":"Codes défauts, données en direct, pression demandée / réelle, retours injecteurs.","de":"Fehlercodes, Live-Daten, Soll-/Istdruck, Injektor-Rücklauftest.","ar":"رموز الأعطال، البيانات الحية، الضغط المطلوب / الفعلي، اختبار رجوع الحواقن."}],[{"fr":"Avantages","de":"Vorteile","ar":"المزايا"},{"fr":"Architecture simple et robuste.","de":"Einfacher, robuster Aufbau.","ar":"تركيب بسيط ومتين."},{"fr":"Meilleure maîtrise de l’injection, du rendement, du bruit et des émissions.","de":"Bessere Kontrolle von Einspritzung, Wirkungsgrad, Geräusch und Emissionen.","ar":"تحكم أفضل في الحقن والمردود والضجيج والانبعاثات."}],[{"fr":"Contraintes","de":"Nachteile","ar":"القيود"},{"fr":"Moins flexible et moins précis.","de":"Weniger flexibel und weniger präzise.","ar":"أقل مرونة ودقة."},{"fr":"Sensible à la contamination ; pièces précises, diagnostic spécifique.","de":"Empfindlich gegen Verschmutzung; präzise Teile, spezifische Diagnose.","ar":"حساس للتلوث؛ قطع دقيقة وتشخيص خاص."}]]}]},{"id":"alim-diag","title":{"fr":"Leçon 8 – Diagnostic de base et sécurité","de":"Lektion 8 – Grundlagen der Diagnose und Sicherheit","ar":"الدرس 8 – أساسيات التشخيص والسلامة"},"blocks":[{"t":"teach","fr":"En cas de démarrage difficile, de calage ou de perte de puissance, on suit une démarche logique au lieu de remplacer directement une pièce.","de":"Bei schwerem Start, Abwürgen oder Leistungsverlust folgt man einer logischen Vorgehensweise, anstatt sofort ein Teil auszutauschen.","ar":"عند صعوبة التشغيل أو توقف المحرك أو فقدان القدرة نتبع منهجًا منطقيًا بدل استبدال قطعة مباشرة."},{"t":"steps","items":[{"title":{"fr":"Diesel classique","de":"Klassischer Diesel","ar":"الديزل الكلاسيكي"},"text":{"fr":"Vérifier le niveau de carburant, les prises d’air et les fuites. Contrôler le filtre et l’alimentation basse pression. Vérifier le calage de la pompe d’injection selon la procédure constructeur. Faire contrôler la pression de tarage et la pulvérisation des injecteurs avec l’équipement adapté.","de":"Kraftstoffstand, Lufteintritt und Leckagen prüfen. Filter und Niederdruckversorgung kontrollieren. Den Förderbeginn der Einspritzpumpe nach Herstellerverfahren prüfen. Einstelldruck und Spritzbild der Düsen mit geeigneter Ausrüstung prüfen lassen.","ar":"تحقق من مستوى الوقود ودخول الهواء والتسربات. افحص المرشح والتغذية ذات الضغط المنخفض. تحقق من ضبط مضخة الحقن حسب إجراء الصانع. اطلب فحص ضغط المعايرة ورذاذ الحواقن بالمعدات المناسبة."}},{"title":{"fr":"Diesel Common Rail","de":"Diesel Common Rail","ar":"ديزل السكة المشتركة"},"text":{"fr":"Lire les codes défauts et les données en direct. Comparer la pression rail demandée à la pression réelle pendant le démarrage. Vérifier la basse pression, le filtre et les prises d’air. Contrôler la régulation et le signal du capteur de pression. Faire un test de retour des injecteurs. Ne jamais conclure à une pompe HP défectueuse sans avoir vérifié les causes en amont.","de":"Fehlercodes und Live-Daten auslesen. Soll- und Ist-Raildruck beim Starten vergleichen. Niederdruck, Filter und Lufteintritt prüfen. Regelung und Signal des Drucksensors kontrollieren. Einen Injektor-Rücklauftest durchführen. Nie auf eine defekte Hochdruckpumpe schließen, ohne die vorgelagerten Ursachen geprüft zu haben.","ar":"اقرأ رموز الأعطال والبيانات الحية. قارن ضغط السكة المطلوب بالفعلي أثناء التشغيل. تحقق من الضغط المنخفض والمرشح ودخول الهواء. افحص التنظيم وإشارة حسّاس الضغط. أجرِ اختبار رجوع الحواقن. لا تحكم بتلف المضخة عالية الضغط قبل فحص الأسباب السابقة لها."}},{"title":{"fr":"Essence (carburateur ou injection)","de":"Benziner (Vergaser oder Einspritzung)","ar":"البنزين (مكربن أو حقن)"},"text":{"fr":"Vérifier la qualité et l’arrivée du carburant. Sur carburateur : gicleurs, niveau de cuve, starter, prises d’air. Sur injection : pression selon les spécifications, commande des injecteurs, signaux des capteurs. Si le carburant est correct : vérifier l’allumage, la compression et la synchronisation moteur.","de":"Qualität und Zufuhr des Kraftstoffs prüfen. Beim Vergaser: Düsen, Schwimmerstand, Starterklappe, Lufteintritt. Bei Einspritzung: Druck nach Vorgabe, Ansteuerung der Einspritzventile, Sensorsignale. Ist der Kraftstoff in Ordnung: Zündung, Kompression und Motorsteuerzeiten prüfen.","ar":"تحقق من جودة الوقود ووصوله. في المكربن: المرذّات ومستوى الحجرة والستارتر ودخول الهواء. في الحقن: الضغط حسب المواصفات وتحكم الحواقن وإشارات الحسّاسات. إذا كان الوقود سليمًا: افحص الإشعال والانضغاط وتزامن المحرك."}}]},{"t":"warn","fr":"Toujours appliquer les données techniques et les consignes de sécurité du constructeur pour le véhicule concerné. Les montages réels peuvent varier selon le moteur et le constructeur.","de":"Immer die technischen Daten und Sicherheitshinweise des Herstellers für das jeweilige Fahrzeug beachten. Reale Ausführungen können je nach Motor und Hersteller abweichen.","ar":"طبّق دائمًا البيانات التقنية وتعليمات السلامة الخاصة بالصانع للسيارة المعنية. قد تختلف التركيبات الحقيقية حسب المحرك والصانع."}]},{"id":"alim-revision","title":{"fr":"Questions de révision","de":"Wiederholungsfragen","ar":"أسئلة المراجعة"},"blocks":[{"t":"qa","items":[{"q":{"fr":"Quel est le rôle du filtre à gasoil ?","de":"Welche Aufgabe hat der Dieselfilter?","ar":"ما دور مرشح الغازوال؟"},"a":{"fr":"Il retient les impuretés et, selon le modèle, sépare l’eau.","de":"Er hält Verunreinigungen zurück und scheidet je nach Modell Wasser ab.","ar":"يحجز الشوائب ويفصل الماء حسب الطراز."}},{"q":{"fr":"Quelle est la différence entre une pompe d’injection mécanique et une pompe HP Common Rail ?","de":"Was ist der Unterschied zwischen einer mechanischen Einspritzpumpe und einer Common-Rail-Hochdruckpumpe?","ar":"ما الفرق بين مضخة الحقن الميكانيكية والمضخة عالية الضغط للسكة المشتركة؟"},"a":{"fr":"La pompe mécanique dose et distribue directement ; la pompe HP Common Rail alimente une rampe commune tandis que les injecteurs sont pilotés électroniquement.","de":"Die mechanische Pumpe dosiert und verteilt direkt; die Common-Rail-Hochdruckpumpe versorgt ein gemeinsames Rail, während die Injektoren elektronisch gesteuert werden.","ar":"المضخة الميكانيكية تضبط وتوزّع مباشرة؛ أما مضخة السكة المشتركة فتغذّي سكة مشتركة بينما تُتحكَّم في الحواقن إلكترونيًا."}},{"q":{"fr":"À quoi sert la rampe commune ?","de":"Wozu dient das gemeinsame Rail?","ar":"ما فائدة السكة المشتركة؟"},"a":{"fr":"Elle stocke et distribue le carburant sous haute pression.","de":"Es speichert und verteilt den Kraftstoff unter Hochdruck.","ar":"تخزّن الوقود وتوزّعه تحت ضغط عالٍ."}},{"q":{"fr":"Où injecte le MPI ?","de":"Wohin spritzt das MPI?","ar":"أين يحقن نظام MPI؟"},"a":{"fr":"Dans l’admission (conduit d’admission).","de":"In den Ansaugkanal.","ar":"في قناة السحب."}},{"q":{"fr":"Quelle est la différence entre un injecteur MPI et un injecteur GDI ?","de":"Was ist der Unterschied zwischen MPI- und GDI-Injektor?","ar":"ما الفرق بين حاقن MPI وحاقن GDI؟"},"a":{"fr":"MPI injecte dans l’admission ; GDI injecte directement dans le cylindre.","de":"MPI spritzt in den Ansaugkanal; GDI spritzt direkt in den Zylinder.","ar":"MPI يحقن في قناة السحب؛ GDI يحقن مباشرة في الأسطوانة."}},{"q":{"fr":"Quelle différence entre un injecteur solénoïde et un injecteur piézoélectrique ?","de":"Was ist der Unterschied zwischen Magnetspulen- und Piezo-Injektor?","ar":"ما الفرق بين حاقن السولينويد وحاقن البيزو؟"},"a":{"fr":"Le solénoïde utilise une bobine électromagnétique ; le piézo utilise un actionneur piézoélectrique (réponse très rapide).","de":"Der Magnetspulen-Injektor nutzt eine elektromagnetische Spule; der Piezo-Injektor einen piezoelektrischen Aktor (sehr schnelle Reaktion).","ar":"السولينويد يستعمل ملفًا كهرومغناطيسيًا؛ والبيزو يستعمل مشغّلًا كهرضغطيًا (استجابة سريعة جدًا)."}},{"q":{"fr":"Pourquoi ne faut-il jamais desserrer une conduite Common Rail moteur tournant ?","de":"Warum darf man eine Common-Rail-Leitung nie bei laufendem Motor lösen?","ar":"لماذا لا يجوز فك أنبوب السكة المشتركة والمحرك يعمل؟"},"a":{"fr":"Le jet sous haute pression peut pénétrer la peau et provoquer des blessures graves.","de":"Der Strahl unter Hochdruck kann die Haut durchdringen und schwere Verletzungen verursachen.","ar":"النفثة تحت الضغط العالي قد تخترق الجلد وتسبب إصابات خطيرة."}}]},{"t":"file","src":"files/circuits-alimentation-cours.pdf","kind":"PDF","cap":{"fr":"Cours complet : circuits d’alimentation Diesel et essence (PDF)","de":"Vollständiger Kurs: Kraftstoffversorgung Diesel und Benzin (PDF)","ar":"الدرس الكامل: دوائر تغذية الديزل والبنزين (PDF)"}},{"t":"file","src":"files/circuits-alimentation-schemas.pdf","kind":"PDF","cap":{"fr":"Schémas visuels des circuits d’alimentation (PDF)","de":"Bildschemata der Kraftstoffversorgung (PDF)","ar":"مخططات مصورة لدوائر التغذية (PDF)"}}]}]}]};

function animHTML(b){const i=ANIMS.push(b)-1;
 return `<div class="anim" data-i="${i}"><div class="stage" data-frame="1">${SCENES[b.kind](lang,b)}</div><div class="sub-t"${arAttr(lang)} aria-live="polite"></div>`+
  `<div class="ctl"><button data-a="prev" aria-label="‹">‹</button><button data-a="play" aria-label="▶">▶</button><button data-a="next" aria-label="›">›</button><span class="dots"></span></div>`+
  `<div class="cap"${arAttr(lang)}>${esc(T(b.cap))}</div></div>`}
function initAnims(root){root.querySelectorAll(".anim:not([data-ready])").forEach(a=>{
 a.dataset.ready=1;const b=ANIMS[+a.dataset.i],st=a.querySelector(".stage"),sub=a.querySelector(".sub-t"),dots=a.querySelector(".dots"),n=b.frames.length,pb=a.querySelector("[data-a=play]");
 let k=1,timer=null;dots.innerHTML=b.frames.map(()=>"<i></i>").join("");const P=FP[b.kind]||[];
 function show(i){k=i;st.dataset.frame=i;const p=P[i-1]||{};for(const key in p)st.style.setProperty("--"+key,p[key]);sub.textContent=T(b.frames[i-1]);dots.querySelectorAll("i").forEach((d,j)=>d.classList.toggle("on",j===i-1))}
 function stop(){clearInterval(timer);timer=null;pb.textContent="▶"}
 function play(){if(timer){stop();return}if(k>=n)show(1);pb.textContent="❚❚";timer=setInterval(()=>{if(k>=n){stop();return}show(k+1)},5200)}
 a.addEventListener("click",e=>{const btn=e.target.closest("button[data-a]");if(!btn)return;const act=btn.dataset.a;if(act==="play")play();else{stop();show(act==="next"?Math.min(n,k+1):Math.max(1,k-1))}});
 show(1)})}

/* ---------- blocks ---------- */
const player=$("#player");let playingBtn=null;
function playClip(id,btn){
  if(playingBtn)playingBtn.setAttribute("aria-pressed","false");
  if(playingBtn===btn&&!player.paused){player.pause();playingBtn=null;return}
  playingBtn=btn;btn.setAttribute("aria-pressed","true");
  player.src="audio/"+id+".mp3";const p=player.play();if(p&&p.catch)p.catch(()=>btn.setAttribute("aria-pressed","false"));
}
player.addEventListener("ended",()=>{if(playingBtn)playingBtn.setAttribute("aria-pressed","false")});

function termHTML(it){
  const art=["der","die","das"].includes(it.a)?it.a:"";
  const badge=art?`<span class="art ${art}">${art}</span>`:`<span class="art x">DE</span>`;
  const sp=it.au?`<button class="play" data-au="${it.au}" aria-pressed="false" aria-label="${esc(U("play"))}: ${esc((art+" "+it.de).trim())}">${SPK}</button>`:"";
  const role=it.r?`<div class="role"${arAttr(lang)}>${esc(T(it.r))}</div>`:"";
  return `<div class="term"><div class="de">${badge}<span class="deword ${art}" lang="de">${esc(it.de)}</span>${sp}</div>`+
   `<div class="tr" lang="fr"><span class="flag">FR</span>${esc(it.fr)}</div>`+
   `<div class="tr ar" lang="ar" dir="rtl"><span class="flag" dir="ltr">AR</span> ${esc(it.ar)}</div>${role}</div>`;
}
function renderBlock(b,topic){
  switch(b.t){
    case "p":return `<div>${lines(T(b))}</div>`;
    case "rule":return `<div class="rule">${lines(T(b))}</div>`;
    case "teach":return `<div class="teach" data-who="${esc(U("who"))}">${lines(T(b))}</div>`;
    case "terms":{
      let items=b.items;
      if(q&&!topic._titleHit)items=items.filter(it=>norm([it.de,it.fr,it.ar,it.a].join(" ")).includes(q));
      if(!items.length)return "";
      return `<div>${b.h?`<h4 class="sub"${arAttr(lang)}>${esc(T(b.h))}</h4>`:""}<div class="terms">${items.map(termHTML).join("")}</div></div>`}
    case "fig":return `<figure><img loading="lazy" src="${esc(b.src)}" alt="${esc(T(b.cap))}" data-zoom="1"><figcaption${arAttr(lang)}>${esc(T(b.cap))}</figcaption></figure>`;
    case "video":return `<figure class="vid"><video controls preload="none" playsinline src="${esc(b.src)}"></video><figcaption${arAttr(lang)}>▶ ${esc(T(b.cap))}</figcaption></figure>`;
    case "file":return `<a class="file" href="${esc(b.src)}" download><span class="k">${esc(b.kind)}</span><span${arAttr(lang)}>${esc(T(b.cap))}<br><small style="color:var(--muted)">${esc(U("download"))}</small></span></a>`;
    case "table":{
      const head=b.head.map(h=>`<th${arAttr(lang)}>${esc(T(h))}</th>`).join("");
      const rows=b.rows.map(r=>"<tr>"+r.map(c=>`<td${arAttr(lang)}>${esc(T(c))}</td>`).join("")+"</tr>").join("");
      return `<div class="tw"${lang==="ar"?' dir="rtl"':""}><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`}
    case "steps":return `<ol class="steps">${b.items.map(s=>`<li><div><b${arAttr(lang)}>${esc(T(s.title))}</b><span${arAttr(lang)}>${esc(T(s.text))}</span></div></li>`).join("")}</ol>`;
    case "mcq":return `<div class="mcq" data-ans="${b.ans}"><div class="q"${arAttr(lang)}>${esc(T(b.q))}</div>${b.opts.map((o,i)=>`<button data-i="${i}"${arAttr(lang)}>${esc(T(o))}</button>`).join("")}<div class="fb" aria-live="polite"></div></div>`;
    case "anim":return animHTML(b);
    case "warn":return `<div class="warn"${arAttr(lang)}><b>⚠</b> ${lines(T(b))}</div>`;
    case "yt":return `<figure class="vid"><div class="yt" data-id="${esc(b.id)}"><button type="button" aria-label="▶">▶</button></div><figcaption${arAttr(lang)}>▶ ${esc(T(b.cap))}</figcaption></figure>`;
    case "qa":return b.items.map(x=>`<details class="qa"><summary${arAttr(lang)}>${esc(T(x.q))}</summary><div class="a"${arAttr(lang)}><b>${esc(U("answer"))} :</b> ${esc(T(x.a))}</div></details>`).join("");
  }
  return "";
}
function topicBody(topic){return topic.blocks.map(b=>renderBlock(b,topic)).join("")}

/* ---------- page ---------- */
const app=$("#app");
function fold(open){const f=el("div","fold"+(open?"":" shut"));f.append(el("div","inner"));return f}
function setOpen(box,on){
  const f=box.querySelector(":scope>.fold");const head=box.querySelector(":scope>button");
  head.setAttribute("aria-expanded",on);
  if(on){f.classList.remove("shut");requestAnimationFrame(()=>box.classList.add("open"));if(box._fill)box._fill()}
  else{box.classList.remove("open");clearTimeout(box._t);box._t=setTimeout(()=>{if(!box.classList.contains("open"))f.classList.add("shut")},380)}
}
function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=U("title");
  $("#h1").textContent=U("title");$("#sub").textContent=U("sub");
  $("#q").placeholder=U("search");$("#slabel").textContent=U("search");
  $("#openall").textContent=U("openall");$("#closeall").textContent=U("closeall");$("#foot").textContent=U("foot");
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  app.innerHTML="";
  let shown=0;
  for(const ch of DATA.chapters){
    const tops=ch.topics.filter(t=>{t._titleHit=q&&t._title.includes(q);return !q||t._all.includes(q)});
    if(!tops.length)continue;shown++;
    const box=el("section","chapter");
    const head=el("button","chap-head",`<span class="chap-n">${ch.n}</span><span class="chap-title"${arAttr(lang)}>${esc(T(ch.title))}<small>${tops.length} ${U("lessons")} · ${ch.words} ${U("words")}</small></span>${CHEV}`);
    head.setAttribute("aria-expanded","false");
    const f=fold(false),inner=f.firstChild;
    const goals=T(ch.goals).split(" | ").map(x=>`<li>${esc(x)}</li>`).join("");
    inner.append(el("div","goals",`<b>${esc(U("goals"))}</b><ul${arAttr(lang)}>${goals}</ul>`));
    for(const t of tops){
      const tb=el("div","topic");
      const th=el("button","top-head",`<span class="t"${arAttr(lang)}>${esc(T(t.title))}</span>${CHEV}`);th.setAttribute("aria-expanded","false");
      const tf=fold(false),ti=tf.firstChild;
      tb.append(th,tf);
      tb._fill=()=>{if(!ti.firstChild||tb._q!==q+lang){tb._q=q+lang;ti.innerHTML=`<div class="tbody">${topicBody(t)}</div>`;initAnims(ti)}};
      th.onclick=()=>setOpen(tb,!tb.classList.contains("open"));
      inner.append(tb);
      if(q){setOpen(tb,true)}
    }
    box.append(head,f);
    head.onclick=()=>setOpen(box,!box.classList.contains("open"));
    app.append(box);
    if(q)setOpen(box,true);
  }
  if(!shown)app.append(el("div","empty",esc(U("none"))));
}
function setLang(l){lang=l;try{localStorage.setItem("meca-lang",l)}catch(e){}render()}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let st;$("#q").addEventListener("input",e=>{clearTimeout(st);st=setTimeout(()=>{q=norm(e.target.value.trim());render()},180)});
function all(on){app.querySelectorAll(".chapter,.topic").forEach(b=>setOpen(b,on))}
$("#openall").onclick=()=>{[...app.querySelectorAll(".chapter")].forEach(b=>setOpen(b,true));[...app.querySelectorAll(".topic")].forEach(b=>setOpen(b,true))};
$("#closeall").onclick=()=>all(false);
$("#theme").onclick=()=>{const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue("--paper").trim()==="#10151b";const n=dark?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("meca-theme",n)}catch(e){}};
try{const th=localStorage.getItem("meca-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}

/* delegated clicks: sound, quiz, zoom */
app.addEventListener("click",e=>{
  const yb=e.target.closest(".yt button");if(yb){const y=yb.parentNode;y.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${y.dataset.id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="YouTube"></iframe>`;return}
  const play=e.target.closest(".play");if(play){playClip(play.dataset.au,play);return}
  const opt=e.target.closest(".mcq button");
  if(opt){const m=opt.closest(".mcq");if(m.dataset.done)return;m.dataset.done=1;
    const ans=+m.dataset.ans,i=+opt.dataset.i;
    m.querySelectorAll("button")[ans].classList.add("ok");if(i!==ans)opt.classList.add("bad");
    m.querySelector(".fb").textContent=i===ans?U("right"):U("wrong");return}
  const img=e.target.closest("img[data-zoom]");
  if(img){const lb=$("#lb");lb.querySelector("img").src=img.src;lb.classList.add("on");lb.scrollTo(0,0)}
});
$("#lb").onclick=()=>$("#lb").classList.remove("on");
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#lb").classList.remove("on")});

render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
