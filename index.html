<style>
:root{
  --paper:#f4f1ea; --surface:#fffdf8; --ink:#1b232d; --muted:#5d6672; --line:#ddd6c8;
  --accent:#e85d04; --on-accent:#fff; --steel:#1f2a37; --note:#fff3c4; --note-line:#e5c95a;
  --der:#1d5fd1; --die:#c62f3a; --das:#1e8449; --pl:#6b7280; --ok:#1e8449; --bad:#c62f3a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10151b; --surface:#19212a; --ink:#e9edf1; --muted:#9aa5b1; --line:#2b3643;
    --accent:#ff8a3d; --on-accent:#1a1005; --steel:#0b1015; --note:#3a3310; --note-line:#7a6a1c;
    --der:#6ea3ff; --die:#ff7a85; --das:#58d18a; --pl:#9ca3af; --ok:#58d18a; --bad:#ff7a85;
  }
}
:root[data-theme="dark"]{
  --paper:#10151b; --surface:#19212a; --ink:#e9edf1; --muted:#9aa5b1; --line:#2b3643;
  --accent:#ff8a3d; --on-accent:#1a1005; --steel:#0b1015; --note:#3a3310; --note-line:#7a6a1c;
  --der:#6ea3ff; --die:#ff7a85; --das:#58d18a; --pl:#9ca3af; --ok:#58d18a; --bad:#ff7a85;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 Inter,system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.ar,[lang="ar"]{font-family:"Noto Naskh Arabic",Inter,serif;line-height:1.9}
.wrap{max-width:700px;margin:0 auto;padding:0 16px}
header.top{background:var(--steel);color:#fff;padding:18px 0 14px}
header.top h1{font:700 26px/1.1 Barlow,Inter,sans-serif;margin:0;letter-spacing:.2px}
header.top p{margin:4px 0 0;color:#b9c3cf;font-size:14px}
.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 0}
.bar .row{display:flex;gap:8px;align-items:center}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:var(--surface);color:var(--ink);padding:10px 12px;font:600 14px Inter,sans-serif;min-width:46px;min-height:44px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.search{flex:1;min-width:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{overflow-x:hidden}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--ink);font:400 16px Inter,sans-serif}
.tools{display:flex;gap:8px;margin-top:8px}
.tools button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 14px Inter,sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.chap-head{display:flex;gap:14px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:start;padding:16px;cursor:pointer;min-height:64px}
.chap-n{flex:none;width:46px;height:46px;border-radius:12px;background:var(--steel);color:#fff;display:grid;place-items:center;font:700 22px Barlow,sans-serif}
.chap-n small{display:none}
.chap-title{font:700 21px/1.2 Barlow,Inter,sans-serif;flex:1}
.chap-title small{display:block;font:400 13px Inter,sans-serif;color:var(--muted);margin-top:2px}
.chev{flex:none;transition:transform .3s;color:var(--muted)}
.open>.chap-head .chev,.open>.top-head .chev{transform:rotate(180deg)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s ease}
.open>.fold{grid-template-rows:1fr}
.fold>.inner{overflow:hidden;min-height:0}
.fold.shut{display:none}
.goals{margin:0 16px 12px;padding:12px 14px;background:var(--note);border:1px solid var(--note-line);border-radius:12px;font-size:15px}
.goals b{display:block;margin-bottom:4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.goals ul{margin:0;padding-inline-start:18px}
.topic{border-top:1px solid var(--line)}
.top-head{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:start;padding:14px 16px;cursor:pointer;min-height:56px;font:600 17px/1.3 Inter,sans-serif}
.top-head .t{flex:1}
.tbody{padding:2px 16px 18px}
.tbody>*+*{margin-top:14px}
.tbody p{margin:0}
.line+.line{margin-top:6px}
.rule,.teach{padding:12px 14px;border-radius:12px}
.rule{background:var(--note);border:1px solid var(--note-line)}
.teach{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-inline-start:5px solid var(--accent)}
.teach:before{content:attr(data-who);display:block;font:600 12px Inter,sans-serif;color:var(--accent);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.sub{font:700 15px Barlow,Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.terms{display:grid;gap:8px}
.term{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.term .de{display:flex;align-items:center;gap:10px}
.art{flex:none;font:700 13px Inter,sans-serif;color:#fff;border-radius:6px;padding:2px 8px;min-width:38px;text-align:center}
.art.der{background:var(--der)}.art.die{background:var(--die)}.art.das{background:var(--das)}
.art.x{background:var(--pl)}
:root[data-theme="dark"] .art,:root:not([data-theme="light"]) .art{color:#0b1015}
.deword{font:700 20px/1.2 Barlow,Inter,sans-serif;flex:1;overflow-wrap:anywhere}
.deword.der{color:var(--der)}.deword.die{color:var(--die)}.deword.das{color:var(--das)}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer}
.play[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.play svg{width:20px;height:20px}
.term .tr{margin-top:4px;color:var(--ink)}
.term .tr .flag{display:inline-block;min-width:26px;font:600 11px Inter,sans-serif;color:var(--muted)}
.term .role{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);color:var(--muted);font-size:15px}
.neu{font:600 11px Inter;background:var(--accent);color:var(--on-accent);border-radius:20px;padding:1px 8px}
figure{margin:0}
figure img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);display:block;background:#fff;cursor:zoom-in}
figcaption{font-size:14px;color:var(--muted);margin-top:6px}
video{width:100%;border-radius:12px;background:#000;display:block}
.vid .ph{position:relative}
table{width:100%;border-collapse:collapse;font-size:14px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{background:var(--steel);color:#fff;font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.steps{counter-reset:s;display:grid;gap:10px;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
.steps li:before{content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 15px Barlow,sans-serif}
.steps b{display:block;font-size:16px}
.mcq{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.mcq .q{font-weight:600;margin-bottom:8px}
.mcq .q:before{content:"✔ ";color:var(--accent)}
.mcq button{display:block;width:100%;text-align:start;min-height:44px;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font:400 16px Inter,sans-serif;cursor:pointer}
.mcq button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--paper))}
.mcq button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--paper))}
.mcq .fb{margin-top:8px;font-weight:600}
details.qa{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0}
details.qa summary{padding:12px;cursor:pointer;font-weight:600;min-height:44px;list-style-position:inside}
details.qa .a{padding:0 12px 12px;border-top:1px dashed var(--line);padding-top:10px}
a.file{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;color:inherit;text-decoration:none;background:var(--paper);min-height:56px}
a.file .k{flex:none;background:var(--steel);color:#fff;font:700 12px Inter;border-radius:6px;padding:4px 8px}
.anim{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.anim .stage{background:linear-gradient(var(--paper),color-mix(in srgb,var(--paper) 70%,var(--line)));padding:6px}
.anim svg{display:block;width:100%;height:auto;max-height:340px;direction:ltr}
.anim svg text{font-family:Inter,"Noto Naskh Arabic",sans-serif;fill:var(--ink);font-size:11px;font-weight:600;text-anchor:middle}
.anim svg text.s{font-size:9.5px;font-weight:500}
.anim svg .ttl{font-size:13px;fill:var(--accent);text-anchor:start}
.anim .f{opacity:0;transition:opacity .6s}
.anim .stage[data-frame="1"] .f[data-f~="1"],.anim .stage[data-frame="2"] .f[data-f~="2"],.anim .stage[data-frame="3"] .f[data-f~="3"],
.anim .stage[data-frame="4"] .f[data-f~="4"],.anim .stage[data-frame="5"] .f[data-f~="5"],.anim .stage[data-frame="6"] .f[data-f~="6"]{opacity:1}
.anim .metal{fill:#6b7684;stroke:#3a434f;stroke-width:1.2}
.anim .box{fill:var(--surface);stroke:var(--ink);stroke-width:1.4}
.anim .pipe{fill:none;stroke:#e8a317;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.anim .pipe.cold{stroke:#3b82f6}.anim .pipe.hot{stroke:#ef4444}.anim .pipe.air{stroke:#60a5fa}.anim .pipe.gray{stroke:#8a94a1}
.anim .flow{stroke-dasharray:2 11;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.anim .arrow{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.anim .spin{animation:spin 2.4s linear infinite;transform-origin:var(--ox,0) var(--oy,0);transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.anim .wave{animation:rise 1.8s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-14px);opacity:0}}
.anim .piston,.anim .rod{transform:translateY(calc(var(--py,0)*1px));transition:transform 1.4s ease-in-out}
.anim .vin{transform:translateY(calc(var(--vi,0)*1px));transition:transform .7s}
.anim .vex{transform:translateY(calc(var(--vx,0)*1px));transition:transform .7s}
.anim .crank{transform:rotate(calc(var(--cr,0)*1deg));transform-origin:160px 236px;transition:transform 1.4s ease-in-out}
.anim .gas{fill:var(--gas,#7fb8ff);transform-origin:100px 62px;transform:scaleY(calc((14 + var(--py,0))/104));transition:fill .8s,transform 1.4s ease-in-out}
.anim .pan{fill:#e8a317;opacity:.55;stroke:#b7791f;stroke-width:1.5}
.anim .jacket{fill:var(--jk,#ff7a5c);opacity:.65;transition:fill .8s}
.warn{padding:12px 14px;border-radius:12px;background:#fee2e2;border:1px solid #ef4444;color:#7f1d1d;font-weight:600}
.yt{position:relative;aspect-ratio:16/9;background:#111 center/cover;border-radius:12px;overflow:hidden}
.yt button{position:absolute;inset:0;width:100%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:48px;cursor:pointer}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.anim .hl{filter:drop-shadow(0 0 4px var(--accent))}
.anim .sub-t{padding:12px 14px;font-size:16px;min-height:96px;border-top:1px solid var(--line)}
.anim .ctl{display:flex;gap:8px;align-items:center;padding:0 12px 10px}
.anim .ctl button{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:700 20px Inter,sans-serif;cursor:pointer}
.anim .ctl button[data-a=play]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.anim .dots{display:flex;gap:6px;margin-inline-start:auto}
.anim .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.anim .dots i.on{background:var(--accent)}
.anim .cap{padding:0 14px 12px;font-size:13px;color:var(--muted)}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
footer{padding:26px 16px 40px;text-align:center;color:var(--muted);font-size:13px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.lb.on{display:block}
.lb img{display:block;margin:0 auto;max-width:none;width:max(100%,900px);height:auto;background:#fff}
.lb button{position:fixed;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:0;background:#fff;color:#000;font:700 22px sans-serif;cursor:pointer;z-index:2}
[dir="rtl"] .chev{transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA={"version":"20261101-121428","chapters":[{"id":"moteur","n":1,"title":{"fr":"Le moteur","de":"Der Motor","ar":"المحرك"},"goals":{"fr":"Savoir à quoi sert le moteur | Nommer les organes fixes, mobiles et de distribution | Connaître le rôle de chaque pièce","de":"Wissen, wozu der Motor dient | Feste und bewegliche Teile und die Steuerung benennen | Die Aufgabe jedes Bauteils kennen","ar":"معرفة وظيفة المحرك | تسمية الأجزاء الثابتة والمتحركة وأجزاء التوزيع | معرفة دور كل قطعة"},"topics":[{"id":"fonction-globale","title":{"fr":"Fonction globale du moteur","de":"Gesamtfunktion des Motors","ar":"الوظيفة العامة للمحرك"},"blocks":[{"t":"anim","kind":"energy","cap":{"fr":"Animation : fonction globale du moteur","de":"Animation: Gesamtfunktion des Motors","ar":"رسم متحرك: الوظيفة العامة للمحرك"},"frames":[{"fr":"Le moteur est une machine qui transforme une énergie en une autre : l’énergie chimique du carburant en énergie mécanique.","de":"Der Motor ist eine Maschine, die eine Energie in eine andere umwandelt: die chemische Energie des Kraftstoffs in mechanische Energie.","ar":"المحرك آلة تحوّل طاقة إلى أخرى: الطاقة الكيميائية للوقود إلى طاقة ميكانيكية."},{"fr":"Entrées : le carburant et l’air, l’action du conducteur (accélérateur) et l’électricité pour l’allumage.","de":"Eingänge: Kraftstoff und Luft, die Handlung des Fahrers (Gaspedal) und Strom für die Zündung.","ar":"المدخلات: الوقود والهواء، وفعل السائق (دواسة الوقود)، والكهرباء للإشعال."},{"fr":"Sortie utile : l’énergie mécanique fait tourner les roues et avancer le véhicule.","de":"Nutzbare Ausgabe: die mechanische Energie dreht die Räder und bewegt das Fahrzeug.","ar":"المخرج المفيد: الطاقة الميكانيكية تدير العجلات وتحرّك السيارة."},{"fr":"Sorties non utiles : de la chaleur (énergie calorifique) et les gaz d’échappement.","de":"Nicht nutzbare Ausgaben: Wärme (Wärmeenergie) und Abgase.","ar":"المخرجات غير المفيدة: حرارة (طاقة حرارية) وغازات العادم."}]},{"t":"rule","fr":"Le moteur transforme l’énergie chimique du carburant en énergie mécanique. | Carburant + air → combustion → mouvement du véhicule.","de":"Der Motor wandelt die chemische Energie des Kraftstoffs in mechanische Energie um. | Kraftstoff + Luft → Verbrennung → Bewegung des Fahrzeugs.","ar":"المحرك يحوّل الطاقة الكيميائية للوقود إلى طاقة ميكانيكية. | وقود + هواء ← احتراق ← حركة السيارة."},{"t":"p","fr":"Un moteur à combustion interne reçoit : le carburant et l’air (énergie chimique), l’action du conducteur (accélérateur) et, pour l’allumage, de l’énergie électrique. | Il fournit : de l’énergie mécanique (utile), de l’énergie calorifique (chaleur perdue) et les gaz d’échappement.","de":"Ein Verbrennungsmotor erhält: Kraftstoff und Luft (chemische Energie), die Handlung des Fahrers (Gaspedal) und für die Zündung elektrische Energie. | Er liefert: mechanische Energie (nutzbar), Wärmeenergie (Verlustwärme) und Abgase.","ar":"المحرك ذو الاحتراق الداخلي يستقبل: الوقود والهواء (طاقة كيميائية)، وفعل السائق (دواسة الوقود)، وللإشعال طاقة كهربائية. | وهو ينتج: طاقة ميكانيكية (مفيدة)، وطاقة حرارية (حرارة ضائعة)، وغازات العادم."},{"t":"p","fr":"Il existe deux grandes familles de moteurs : | • Le moteur à allumage commandé (essence) : le mélange air + essence est enflammé par l’étincelle de la bougie. | • Le moteur Diesel : le gazole est injecté dans l’air fortement comprimé et s’enflamme tout seul.","de":"Es gibt zwei große Motorenfamilien: | • Der Ottomotor (Benzin, Fremdzündung): das Luft-Benzin-Gemisch wird durch den Funken der Zündkerze entzündet. | • Der Dieselmotor: Diesel wird in die stark verdichtete Luft eingespritzt und entzündet sich von selbst.","ar":"هناك عائلتان كبيرتان من المحركات: | • محرك البنزين (إشعال بالشرارة): يشتعل خليط الهواء والبنزين بشرارة شمعة الإشعال. | • محرك الديزل: يُحقن الغازوال في الهواء المضغوط بشدة فيشتعل ذاتيًا."},{"t":"p","fr":"L’ensemble piston – bielle – manivelle (vilebrequin) existe en 3 réalisations : moteur à cycle 4 temps, moteur à cycle 2 temps, moteur rotatif.","de":"Die Einheit Kolben – Pleuel – Kurbel (Kurbelwelle) gibt es in 3 Bauarten: Viertaktmotor, Zweitaktmotor, Kreiskolbenmotor (Wankelmotor).","ar":"مجموعة المكبس – ذراع التوصيل – المرفق (عمود المرفق) لها 3 أنواع: محرك رباعي الأشواط، محرك ثنائي الأشواط، محرك دوراني."}]},{"id":"constitution","title":{"fr":"Constitution du moteur","de":"Aufbau des Motors","ar":"مكوّنات المحرك"},"blocks":[{"t":"rule","fr":"3 groupes : organes fixes | équipement mobile | organes de distribution.","de":"3 Gruppen: feststehende Teile | bewegliche Teile | Steuerungsteile (Ventiltrieb).","ar":"3 مجموعات: الأجزاء الثابتة | المعدات المتحركة | أجزاء التوزيع."},{"t":"terms","h":{"fr":"Organes fixes","de":"Feststehende Teile","ar":"الأجزاء الثابتة"},"items":[{"a":"der","de":"Ventildeckel","fr":"Cache-culbuteurs (couvre-culasse)","ar":"غطاء الصمامات (غطاء رأس المحرك)","r":null,"au":"ac2fc91609a1"},{"a":"der","de":"Zylinderkopf","fr":"Culasse","ar":"رأس الأسطوانة","r":null,"au":"83a5fd210879"},{"a":"der","de":"Zylinderblock","fr":"Bloc-cylindres","ar":"كتلة الأسطوانات","r":null,"au":"f29866711597"},{"a":"die","de":"Ölwanne","fr":"Carter inférieur (carter d’huile)","ar":"حوض الزيت (الكرتير السفلي)","r":null,"au":"d431960b4e3b"}]},{"t":"terms","h":{"fr":"Équipement mobile","de":"Bewegliche Teile","ar":"المعدات المتحركة"},"items":[{"a":"der","de":"Kolben","fr":"Piston","ar":"المكبس","r":null,"au":"1cb43406ca2d"},{"a":"das","de":"Pleuel","fr":"Bielle","ar":"ذراع التوصيل","r":null,"au":"9b6d8677de5e"},{"a":"die","de":"Kurbelwelle","fr":"Vilebrequin","ar":"عمود المرفق","r":null,"au":"98c7d68b7098"},{"a":"das","de":"Schwungrad","fr":"Volant moteur","ar":"الحدافة","r":null,"au":"810a8d548c83"}]},{"t":"terms","h":{"fr":"Organes de distribution","de":"Steuerungsteile (Ventiltrieb)","ar":"أجزاء التوزيع"},"items":[{"a":"der","de":"Zahnriemen","fr":"Courroie (de distribution)","ar":"سير التوزيع","r":null,"au":"c9b58bce9c7d"},{"a":"die","de":"Nockenwelle","fr":"Arbre à cames","ar":"عمود الكامات","r":null,"au":"ebcf974625eb"},{ ar":"مضخة الزيت","r":null,"au":"45aea77e893c"},{"a":"das","de":"Kurbelgehäuse","fr":"Carter moteur (carter inférieur)","ar":"كرتير المحرك","r":null,"au":"65a21bfee12d"}]}]},{"id":"bloc-cylindres","title":{"fr":"Le bloc-cylindres","de":"Der Zylinderblock","ar":"كتلة الأسطوانات"},"blocks":[{"t":"fig","src":"img/culasse-bloc.jpg","cap":{"fr":"La culasse et le bloc moteur avec leurs organes","de":"Zylinderkopf und Motorblock mit ihren Teilen","ar":"رأس الأسطوانة وكتلة المحرك وأجزاؤهما"}},{"t":"p","fr":"Fonctions principales : | • Guider le piston ou la chemise. | • Évacuer la chaleur : refroidissement par eau (liquide de refroidissement) ou par air. | • Résister à la pression des gaz : 35 à 50 bars. | • Résister à la corrosion due à l’eau de refroidissement. | • Supporter les organes mobiles et annexes. | • Avoir une bonne résistance mécanique.","de":"Hauptaufgaben: | • Den Kolben oder die Laufbuchse führen. | • Wärme abführen: Wasserkühlung (Kühlmittel) oder Luftkühlung. | • Dem Gasdruck standhalten: 35 bis 50 bar. | • Der Korrosion durch das Kühlwasser widerstehen. | • Die beweglichen Teile und Anbauteile tragen. | • Gute mechanische Festigkeit haben.","ar":"الوظائف الرئيسية: | • توجيه المكبس أو بطانة الأسطوانة. | • تصريف الحرارة: تبريد بالماء (سائل التبريد) أو بالهواء. | • مقاومة ضغط الغازات: من 35 إلى 50 بار. | • مقاومة التآكل (الصدأ) الناتج عن ماء التبريد. | • تحمّل الأجزاء المتحركة والملحقات. | • مقاومة ميكانيكية جيدة."},{"t":"p","fr":"Matériaux utilisés : | • Fonte : bonne résistance mécanique, mais densité importante. | • Alliage d’aluminium : bonne conductibilité thermique, faible densité.","de":"Verwendete Werkstoffe: | • Gusseisen: gute mechanische Festigkeit, aber hohe Dichte (schwer). | • Aluminiumlegierung: gute Wärmeleitfähigkeit, geringe Dichte (leicht).","ar":"المواد المستعملة: | • الحديد الزهر: مقاومة ميكانيكية جيدة لكن كثافة كبيرة (ثقيل). | • سبائك الألومنيوم: موصلية حرارية جيدة وكثافة منخفضة (خفيف)."},{"t":"terms","h":{"fr":"Disposition des cylindres","de":"Zylinderanordnung","ar":"ترتيب الأسطوانات"},"items":[{"a":"der","de":"Reihenmotor","fr":"Cylindres en ligne","ar":"أسطوانات على خط واحد","r":null,"au":"493357fd558b"},{"a":"der","de":"V-Motor","fr":"Cylindres en V","ar":"أسطوانات على شكل V","r":null,"au":"1fae1f7e5f03"},{"a":"der","de":"Boxermotor","fr":"Cylindres à plat opposés","ar":"أسطوانات أفقية متقابلة","r":null,"au":"7a6e446b98c7"}]},{"t":"terms","h":{"fr":"Parties du bloc (image)","de":"Teile des Blocks (Bild)","ar":"أجزاء الكتلة (الصورة)"},"items":[{"a":"der","de":"Zylinder","fr":"Cylindre (chemise ou alésage)","ar":"الأسطوانة (بطانة أو تجويف)","r":null,"au":"2da45907e020"},{"a":"die","de":"Dichtfläche","fr":"Surface d’appui de la culasse","ar":"سطح ارتكاز رأس الأسطوانة","r":null,"au":"d3f1c07ae817"},{"a":"der","de":"Kühlmittelkanal","fr":"Passage de liquide de refroidissement","ar":"ممر سائل التبريد","r":null,"au":"6d6e66fecef0"},{"a":"der","de":"Ölkanal","fr":"Passage d’huile","ar":"ممر الزيت","r":null,"au":"83a456f621dd"},{"a":"der","de":"Hauptölkanal","fr":"Conduits d’huile principaux","ar":"قنوات الزيت الرئيسية","r":null,"au":"428b7f352e6f"},{"a":"das","de":"Kurbelwellenlager","fr":"Logement du vilebrequin (paliers)","ar":"مكان عمود المرفق (المساند)","r":null,"au":"9d9efa973af9"}]}]},{"id":"culasse","title":{"fr":"La culasse","de":"Der Zylinderkopf","ar":"رأس الأسطوانة"},"blocks":[{"t":"p","fr":"Fonctions principales : | • Obturer (fermer) les cylindres et résister à la pression des gaz. | • Assurer une bonne étanchéité aux soupapes et au joint de culasse. | • Assurer l’admission et l’évacuation des gaz : conduits corrects et lisses pour éviter de freiner le passage des gaz.","de":"Hauptaufgaben: | • Die Zylinder oben abschließen und dem Gasdruck standhalten. | • Gute Abdichtung an den Ventilen und an der Zylinderkopfdichtung sichern. | • Ansaugen und Ausstoßen der Gase sicherstellen: glatte, passende Kanäle, damit die Gase nicht gebremst werden.","ar":"الوظائف الرئيسية: | • إغلاق الأسطوانات ومقاومة ضغط الغازات. | • ضمان إحكام جيد عند الصمامات وعند وصلة رأس الأسطوانة. | • ضمان دخول الغازات وخروجها: قنوات صحيحة وملساء حتى لا تعيق مرور الغازات."},{"t":"p","fr":"Disposition des organes de distribution : | • Arbre à cames en tête avec soupapes en tête. | • Arbre à cames en tête et poussoirs hydrauliques. | • Arbre à cames latéral et soupapes en tête (avec tige de culbuteur). | • Arbre à cames en tête et poussoirs (réglage par pastilles).","de":"Anordnung des Ventiltriebs: | • Obenliegende Nockenwelle mit hängenden Ventilen. | • Obenliegende Nockenwelle und Hydrostößel. | • Seitliche Nockenwelle und hängende Ventile (mit Stößelstange und Kipphebel). | • Obenliegende Nockenwelle und Tassenstößel (Einstellung mit Plättchen).","ar":"ترتيب أجزاء التوزيع: | • عمود كامات علوي مع صمامات علوية. | • عمود كامات علوي ورافعات هيدروليكية. | • عمود كامات جانبي وصمامات علوية (مع ساق الذراع). | • عمود كامات علوي ورافعات (ضبط بواسطة رقائق)."},{"t":"p","fr":"Étanchéité : elle est assurée par un joint placé entre les surfaces de contact : le joint de culasse. Types cités en cours : joint métalloplastique et joint Reinz (le plus employé).","de":"Abdichtung: Sie erfolgt durch eine Dichtung zwischen den Berührungsflächen: die Zylinderkopfdichtung. Im Unterricht genannte Arten: Metall-Kunststoff-Dichtung und Reinz-Dichtung (am häufigsten verwendet).","ar":"الإحكام: يتحقق بوضع وصلة بين سطحَي التلامس: وصلة رأس الأسطوانة. الأنواع المذكورة في الدرس: الوصلة المعدنية-البلاستيكية ووصلة رايْنز (الأكثر استعمالًا)."},{"t":"terms","h":{"fr":"Pièces de la culasse (image)","de":"Teile des Zylinderkopfs (Bild)","ar":"أجزاء رأس الأسطوانة (الصورة)"},"items":[{"a":"der","de":"Ventildeckel","fr":"Cache-culbuteurs (couvre-culasse)","ar":"غطاء الصمامات","r":null,"au":"ac2fc91609a1"},{"a":"der","de":"Öleinfülldeckel","fr":"Bouchon de remplissage d’huile","ar":"غطاء تعبئة الزيت","r":null,"au":"763304c86bef"},{"a":"die","de":"Einlassnockenwelle","fr":"Arbre à cames d’admission","ar":"عمود كامات السحب","r":null,"au":"2181fc10c7bd"},{"a":"die","de":"Auslassnockenwelle","fr":"Arbre à cames d’échappement","ar":"عمود كامات العادم","r":null,"au":"986c2dd3787e"},{"a":"das","de":"Nockenwellenrad","fr":"Pignon / roue dentée de l’arbre à cames","ar":"ترس عمود الكامات","r":null,"au":"697c107c811f"},{"a":"der","de":"Kipphebel","fr":"Culbuteur (selon moteur)","ar":"ذراع الصمام","r":null,"au":"97e7dba1254e"},{"a":"der","de":"Stößel","fr":"Poussoir (tige ou hydraulique)","ar":"الرافعة (ساق أو هيدروليكية)","r":null,"au":"7d5a9a5b5973"},{"a":"die","de":"Ventilführung","fr":"Guide de soupape","ar":"دليل الصمام","r":null,"au":"a6c6bf1683bc"},{"a":"die","de":"Ventilfeder","fr":"Ressort de soupape","ar":"نابض الصمام","r":null,"au":"1d0032be0731"},{"a":"das","de":"Einlassventil","fr":"Soupape d’admission","ar":"صمام السحب","r":null,"au":"9a1674a349c0"},{"a":"das","de":"Auslassventil","fr":"Soupape d’échappement","ar":"صمام العادم","r":null,"au":"d3433465e854"},{"a":"der","de":"Ventilsitz","fr":"Siège de soupape","ar":"مقعد الصمام","r":null,"au":"69282a46f0cd"},{"a":"der","de":"Brennraum","fr":"Chambre de combustion","ar":"غرفة الاحتراق","r":null,"au":"022e703ab41f"},{"a":"der","de":"Einlasskanal","fr":"Conduit d’admission","ar":"قناة السحب","r":null,"au":"c0127b6d01d5"},{"a":"der","de":"Auslasskanal","fr":"Conduit d’échappement","ar":"قناة العادم","r":null,"au":"28966b4ce369"}]}]},{"id":"piston","title":{"fr":"Le piston, les segments, l’axe et la bielle","de":"Kolben, Kolbenringe, Bolzen und Pleuel","ar":"المكبس والحلقات والمحور وذراع التوصيل"},"blocks":[{"t":"fig","src":"img/piston.jpg","cap":{"fr":"Les organes du piston","de":"Die Bauteile des Kolbens","ar":"أجزاء المكبس"}},{"t":"terms","h":{"fr":"Le piston","de":"Der Kolben","ar":"المكبس"},"items":[{"a":"der","de":"Kolbenboden","fr":"Calotte du piston (dessus)","ar":"رأس المكبس (الجزء العلوي)","r":null,"au":"0949c76d1ffd"},{"a":"die","de":"Kolbenmulde","fr":"Cuvette (selon modèle)","ar":"التجويف (حسب الطراز)","r":null,"au":"2f4e089aa7fb"},{"a":"die","de":"Ringnut","fr":"Gorges des segments","ar":"مجاري الحلقات","r":null,"au":"233bde64fa3a"},{"a":"der","de":"Kolbenschaft","fr":"Jupe du piston","ar":"تنورة المكبس","r":null,"au":"c742e338c71d"},{"a":"die","de":"Bolzenbohrung","fr":"Logement de l’axe de piston","ar":"مكان محور المكبس","r":null,"au":"fe7db654a0d7"}]},{"t":"terms","h":{"fr":"Les segments","de":"Die Kolbenringe","ar":"حلقات المكبس"},"items":[{"a":"der","de":"Verdichtungsring","fr":"Segment de compression (étanchéité des gaz)","ar":"حلقة الانضغاط (إحكام الغازات)","r":null,"au":"98687baebc05"},{"a":"der","de":"Ölabstreifring","fr":"Segment racleur d’huile","ar":"حلقة كشط الزيت","r":null,"au":"4b94717ca3fc"}]},{"t":"p","fr":"Fonctions des segments : | • Assurer l’étanchéité entre la chambre de combustion et le carter inférieur pour avoir un maximum de compression. | • Empêcher l’huile de remonter vers la chambre de combustion (éviter la consommation d’huile). | • Participer au guidage du piston et résister à l’usure. | Le piston porte en général 3 ou 4 segments : anneaux fendus, élastiques, placés dans des gorges autour de la tête du piston. | Segment coupe-feu : étanchéité de la chambre, résiste à la pression et à la température. | Segment d’étanchéité : évite aussi la consommation d’huile. | Segment racleur : racle l’huile tout en laissant une fine pellicule pour lubrifier.","de":"Aufgaben der Kolbenringe: | • Abdichtung zwischen Brennraum und Kurbelgehäuse für maximale Verdichtung. | • Verhindern, dass Öl in den Brennraum steigt (Ölverbrauch vermeiden). | • Den Kolben mitführen und verschleißfest sein. | Der Kolben hat meist 3 oder 4 Ringe: geschlitzte, federnde Ringe in Nuten am Kolbenkopf. | Feuerring (oberster Ring): dichtet den Brennraum ab, hält Druck und Hitze aus. | Dichtring: dichtet ab und verhindert Ölverbrauch. | Ölabstreifring: streift das Öl ab, lässt aber einen dünnen Ölfilm zur Schmierung.","ar":"وظائف الحلقات: | • ضمان الإحكام بين غرفة الاحتراق والكرتير السفلي للحصول على أقصى انضغاط. | • منع صعود الزيت إلى غرفة الاحتراق (تفادي استهلاك الزيت). | • المشاركة في توجيه المكبس ومقاومة التآكل. | يحمل المكبس عادة 3 أو 4 حلقات: حلقات مشقوقة مرنة موضوعة في مجارٍ حول رأس المكبس. | حلقة النار: إحكام غرفة الاحتراق وتتحمل الضغط والحرارة. | حلقة الإحكام: تحكم وتمنع استهلاك الزيت. | حلقة الكشط: تكشط الزيت وتترك طبقة رقيقة للتزييت."},{"t":"terms","h":{"fr":"L’axe de piston","de":"Der Kolbenbolzen","ar":"محور المكبس"},"items":[{"a":"der","de":"Kolbenbolzen","fr":"Axe de piston (axe de pied de bielle)","ar":"محور المكبس (محور رأس ذراع التوصيل)","r":null,"au":"7aa24be12deb"},{"a":"der","de":"Sicherungsring","fr":"Circlip de maintien","ar":"حلقة التثبيت (سيركليب)","r":null,"au":"2a25ef7b05ca"}]},{"t":"p","fr":"Rôle : il assure la liaison et l’articulation entre le piston et la bielle. | 3 montages possibles : | • Serré dans le piston, libre dans la bielle. | • Libre dans la bielle, libre dans le piston. | • Libre dans le piston, serré dans la bielle.","de":"Aufgabe: Er verbindet Kolben und Pleuel und macht sie gelenkig. | 3 mögliche Einbauarten: | • Fest im Kolben, frei im Pleuel. | • Frei im Pleuel, frei im Kolben (schwimmend). | • Frei im Kolben, fest im Pleuel.","ar":"الدور: يربط المكبس بذراع التوصيل ويسمح بتمفصلهما. | 3 تركيبات ممكنة: | • مشدود في المكبس، حر في ذراع التوصيل. | • حر في ذراع التوصيل وحر في المكبس. | • حر في المكبس، مشدود في ذراع التوصيل."},{"t":"terms","h":{"fr":"La bielle","de":"Das Pleuel","ar":"ذراع التوصيل"},"items":[{"a":"das","de":"Pleuel","fr":"Bielle","ar":"ذراع التوصيل","r":null,"au":"9b6d8677de5e"},{"a":"das","de":"kleine Pleuelauge","fr":"Petit pied de bielle (côté piston)","ar":"الرأس الصغير لذراع التوصيل (جهة المكبس)","r":null,"au":"d491a74fd88e"},{"a":"der","de":"Pleuelschaft","fr":"Corps de bielle","ar":"جسم ذراع التوصيل","r":null,"au":"7dca41674940"},{"a":"das","de":"große Pleuelauge","fr":"Grand pied de bielle (côté vilebrequin)","ar":"الرأس الكبير لذراع التوصيل (جهة المرفق)","r":null,"au":"b912a82012bf"}]}]},{"id":"vilebrequin","title":{"fr":"Le vilebrequin","de":"Die Kurbelwelle","ar":"عمود المرفق"},"blocks":[{"t":"p","fr":"Qualités requises : bonne résistance à la flexion et à la torsion ; il doit être correctement équilibré.","de":"Geforderte Eigenschaften: gute Biege- und Torsionsfestigkeit; er muss gut ausgewuchtet sein.","ar":"الصفات المطلوبة: مقاومة جيدة للانحناء والالتواء، ويجب أن يكون متوازنًا بشكل صحيح."},{"t":"terms","h":{"fr":"Nomenclature","de":"Benennung der Teile","ar":"تسمية الأجزاء"},"items":[{"a":"der","de":"Hauptlagerzapfen","fr":"Tourillon","ar":"العنق (محور الارتكاز)","r":null,"au":"56b5d2ae43ef"},{"a":"die","de":"Kurbelwange","fr":"Bras de manivelle","ar":"ذراع المرفق","r":null,"au":"d817ec27f3e4"},{"a":"der","de":"Hubzapfen","fr":"Maneton","ar":"الرُّسغ (محور ذراع التوصيل)","r":null,"au":"b550f21c556f"},{"a":"die","de":"Ölbohrung","fr":"Conduit de graissage","ar":"قناة التزييت","r":null,"au":"e9e0737c8850"},{"a":"das","de":"Gegengewicht","fr":"Masse d’équilibrage","ar":"ثقل الموازنة","r":null,"au":"a0865423cc59"},{"a":"die","de":"Lagerschale","fr":"Coussinet de palier","ar":"كرسي المسند","r":null,"au":"6de74ffe4da6"},{"a":"der","de":"Dichtring-Sitz","fr":"Portée pour bague d’étanchéité","ar":"مكان حلقة الإحكام","r":null,"au":"d7a938326496"},{"a":"die","de":"Anlaufscheibe","fr":"Flasques pour le jeu axial","ar":"حلقات الخلوص المحوري","r":null,"au":"cfac67a0dfa4"}]}]},{"id":"distribution","title":{"fr":"La distribution et les soupapes","de":"Ventilsteuerung und Ventile","ar":"التوزيع والصمامات"},"blocks":[{"t":"terms","h":{"fr":"Entraînement de la distribution","de":"Antrieb der Steuerung","ar":"نقل الحركة إلى التوزيع"},"items":[{"a":"der","de":"Zahnradantrieb","fr":"Par engrenage","ar":"بواسطة التروس","r":null,"au":"cd1b39086d2d"},{"a":"der","de":"Zahnriemen","fr":"Par courroie crantée","ar":"بواسطة السير المسنّن","r":null,"au":"c9b58bce9c7d"},{"a":"die","de":"Kette","fr":"Par chaîne","ar":"بواسطة السلسلة","r":null,"au":"4bcc427bde16"}]},{"t":"p","fr":"L’arbre à cames possède des cames (qui poussent les soupapes) et des portées (appuis). Selon le moteur, il peut aussi entraîner l’allumeur et la pompe à carburant (came).","de":"Die Nockenwelle hat Nocken (sie drücken die Ventile) und Lagerstellen. Je nach Motor treibt sie auch den Zündverteiler und die Kraftstoffpumpe (Nocken) an.","ar":"عمود الكامات له كامات (تدفع الصمامات) ومساند. وحسب المحرك قد يُدير أيضًا الموزّع ومضخة الوقود (كامة)."},{"t":"p","fr":"Rôle des soupapes : laisser passer un maximum de gaz en un temps très court et assurer une parfaite étanchéité à la fermeture. Le nombre et l’implantation des soupapes varient selon le moteur.","de":"Aufgabe der Ventile: in sehr kurzer Zeit möglichst viel Gas durchlassen und beim Schließen perfekt abdichten. Anzahl und Anordnung der Ventile hängen vom Motor ab.","ar":"دور الصمامات: السماح بمرور أكبر كمية من الغازات في وقت قصير جدًا وضمان إحكام تام عند الإغلاق. يختلف عدد الصمامات وموضعها حسب المحرك."},{"t":"rule","fr":"L’arbre à cames tourne 1 fois (360°) pendant que le vilebrequin tourne 2 fois (720°) : un cycle complet.","de":"Die Nockenwelle dreht sich 1-mal (360°), während sich die Kurbelwelle 2-mal (720°) dreht: ein vollständiger Arbeitszyklus.","ar":"عمود الكامات يدور مرة واحدة (360°) بينما يدور عمود المرفق مرتين (720°): أي دورة كاملة."}]},{"id":"docs-moteur","title":{"fr":"Documents du cours","de":"Unterrichtsdokumente","ar":"ملفات الدرس"},"blocks":[{"t":"file","src":"files/cours-1-moteur.ppt","kind":"PPT","cap":{"fr":"Cours 1 : le moteur (PowerPoint)","de":"Kurs 1: Der Motor (PowerPoint)","ar":"الدرس 1: المحرك (باوربوينت)"}},{"t":"file","src":"files/cours-2-moteur.ppt","kind":"PPT","cap":{"fr":"Cours 2 : le moteur, exercices (PowerPoint)","de":"Kurs 2: Der Motor, Übungen (PowerPoint)","ar":"الدرس 2: المحرك، تمارين (باوربوينت)"}},{"t":"file","src":"files/intro-moteur-diesel.pdf","kind":"PDF","cap":{"fr":"Introduction au moteur Diesel (PDF)","de":"Einführung in den Dieselmotor (PDF)","ar":"مدخل إلى محرك الديزل (PDF)"}}]}]},{"id":"cycle","n":2,"title":{"fr":"Le cycle à 4 temps","de":"Der Viertaktprozess","ar":"دورة الأشواط الأربعة"},"goals":{"fr":"Décrire les 4 temps | Connaître l’état des soupapes, du piston et de la pression | Savoir lire le diagramme pression-volume | Faire les calculs d’un moteur 4 cylindres","de":"Die 4 Takte beschreiben | Ventilstellung, Kolben und Druck kennen | Das Druck-Volumen-Diagramm lesen | Rechnungen für einen Vierzylindermotor durchführen","ar":"وصف الأشواط الأربعة | معرفة حالة الصمامات والمكبس والضغط | قراءة مخطط الضغط-الحجم | حل حسابات محرك رباعي الأسطوانات"},"topics":[{"id":"termes-cycle","title":{"fr":"Vocabulaire du cycle","de":"Vokabeln zum Viertaktprozess","ar":"مفردات الدورة"},"blocks":[{"t":"terms","items":[{"a":"der","de":"Ansaugtakt","fr":"1er temps : Admission","ar":"الشوط الأول: السحب","r":null,"au":"e557c6bd6928"},{"a":"der","de":"Verdichtungstakt","fr":"2e temps : Compression","ar":"الشوط الثاني: الانضغاط","r":null,"au":"67f15cf6cd72"},{"a":"der","de":"Arbeitstakt","fr":"3e temps : Combustion – détente (temps moteur)","ar":"الشوط الثالث: الاحتراق والتمدد (الشوط المحرك)","r":null,"au":"2e96dceb6be1"},{"a":"der","de":"Ausstoßtakt","fr":"4e temps : Échappement","ar":"الشوط الرابع: العادم","r":null,"au":"ac16e8a1c351"},{"a":"der","de":"obere Totpunkt","fr":"PMH : point mort haut","ar":"النقطة الميتة العليا (PMH)","r":null,"au":"86fbc0e2d3c9"},{"a":"der","de":"untere Totpunkt","fr":"PMB : point mort bas","ar":"النقطة الميتة السفلى (PMB)","r":null,"au":"b94c1c7a2ad4"},{"a":"der","de":"Viertaktmotor","fr":"Moteur à cycle 4 temps","ar":"محرك رباعي الأشواط","r":null,"au":"34f2e5755c9a"},{"a":"die","de":"Zündfolge","fr":"Ordre d’allumage","ar":"ترتيب الإشعال","r":null,"au":"d6e438c406f5"},{"a":"der","de":"Hub","fr":"Course (du piston)","ar":"شوط المكبس","r":null,"au":"284bade4a7be"},{"a":"die","de":"Verdichtung","fr":"Compression","ar":"الانضغاط","r":null,"au":"053a870aaa18"},{"a":"die","de":"Verbrennung","fr":"Combustion","ar":"الاحتراق","r":null,"au":"b1b3468a4e1a"},{"a":"die","de":"Expansion","fr":"Détente","ar":"التمدد","r":null,"au":"335292f7fb46"}]}]},{"id":"essence-4-temps","title":{"fr":"Les 4 temps : moteur à allumage commandé (essence)","de":"Die 4 Takte: Ottomotor (Benzin)","ar":"الأشواط الأربعة: محرك البنزين"},"blocks":[{"t":"anim","kind":"stroke-essence","frames":[{"fr":"1er temps – ADMISSION : la soupape d’admission est ouverte, le piston descend du PMH au PMB et le mélange air-essence entre.","de":"1. Takt – ANSAUGEN: das Einlassventil ist offen, der Kolben geht vom OT zum UT und das Luft-Benzin-Gemisch strömt ein.","ar":"الشوط 1 – السحب: صمام السحب مفتوح، ينزل المكبس من ن.م.ع إلى ن.م.س ويدخل خليط الهواء والبنزين."},{"fr":"2e temps – COMPRESSION : les deux soupapes sont fermées, le piston monte au PMH, le mélange est comprimé (≈ 10 bars).","de":"2. Takt – VERDICHTEN: beide Ventile sind geschlossen, der Kolben steigt zum OT, das Gemisch wird verdichtet (≈ 10 bar).","ar":"الشوط 2 – الانضغاط: الصمامان مغلقان، يصعد المكبس إلى ن.م.ع ويُضغط الخليط (≈ 10 بار)."},{"fr":"3e temps – COMBUSTION : l’étincelle de la bougie enflamme le mélange, la pression monte à 50–60 bars.","de":"3. Takt – VERBRENNEN: der Funke der Zündkerze entzündet das Gemisch, der Druck steigt auf 50–60 bar.","ar":"الشوط 3 – الاحتراق: شرارة الشمعة تشعل الخليط ويرتفع الضغط إلى 50–60 بار."},{"fr":"3e temps – DÉTENTE : la pression pousse le piston vers le bas. C’est le temps moteur : seul temps qui fournit de l’énergie.","de":"3. Takt – ARBEITEN: der Druck treibt den Kolben nach unten. Das ist der Arbeitstakt: der einzige Takt, der Energie liefert.","ar":"الشوط 3 – التمدد: الضغط يدفع المكبس إلى الأسفل. هذا هو الشوط المحرك: الشوط الوحيد الذي يعطي الطاقة."},{"fr":"4e temps – ÉCHAPPEMENT : la soupape d’échappement s’ouvre, le piston remonte et chasse les gaz brûlés.","de":"4. Takt – AUSSTOßEN: das Auslassventil öffnet, der Kolben steigt und schiebt die Abgase hinaus.","ar":"الشوط 4 – العادم: يُفتح صمام العادم، يصعد المكبس ويطرد الغازات المحترقة."}],"cap":{"fr":"Animation : les 4 temps du moteur essence","de":"Animation: die 4 Takte des Benzinmotors","ar":"رسم متحرك: الأشواط الأربعة لمحرك البنزين"}},{"t":"video","src":"video/moteur-essence-4-temps.mp4","cap":{"fr":"Vidéo : fonctionnement d’un moteur essence 4 temps","de":"Video: Funktionsweise eines Viertakt-Benzinmotors","ar":"فيديو: عمل محرك بنزين رباعي الأشواط"}},{"t":"p","fr":"1er temps : ADMISSION | • La soupape d’admission s’ouvre au PMH. | • Le piston descend du PMH au PMB : il crée une dépression et le mélange gazeux entre dans le cylindre. | • La soupape d’admission se ferme au PMB.","de":"1. Takt: ANSAUGEN | • Das Einlassventil öffnet am OT. | • Der Kolben bewegt sich vom OT zum UT: es entsteht ein Unterdruck und das Gasgemisch strömt in den Zylinder. | • Das Einlassventil schließt am UT.","ar":"الشوط الأول: السحب | • يُفتح صمام السحب عند ن.م.ع. | • ينزل المكبس من ن.م.ع إلى ن.م.س: يحدث تفريغ (ضغط منخفض) فيدخل الخليط الغازي إلى الأسطوانة. | • يُغلق صمام السحب عند ن.م.س."},{"t":"p","fr":"2e temps : COMPRESSION | • Les soupapes sont fermées. | • Le piston monte du PMB au PMH. | • La pression dans le cylindre augmente (environ 10 bars en fin de compression).","de":"2. Takt: VERDICHTEN | • Die Ventile sind geschlossen. | • Der Kolben bewegt sich vom UT zum OT. | • Der Druck im Zylinder steigt (etwa 10 bar am Ende der Verdichtung).","ar":"الشوط الثاني: الانضغاط | • الصمامات مغلقة. | • يصعد المكبس من ن.م.س إلى ن.م.ع. | • يرتفع الضغط داخل الأسطوانة (حوالي 10 بار في نهاية الانضغاط)."},{"t":"p","fr":"3e temps : COMBUSTION – DÉTENTE | • Les soupapes sont fermées. | • L’étincelle de la bougie enflamme le mélange air-essence. | • La température et la pression augmentent pour un même volume. | • La pression chasse le piston vers le bas (du PMH vers le PMB).","de":"3. Takt: VERBRENNEN – ARBEITEN | • Die Ventile sind geschlossen. | • Der Zündfunke der Zündkerze entzündet das Luft-Benzin-Gemisch. | • Temperatur und Druck steigen bei gleichem Volumen. | • Der Druck treibt den Kolben nach unten (vom OT zum UT).","ar":"الشوط الثالث: الاحتراق – التمدد | • الصمامات مغلقة. | • شرارة الشمعة تشعل خليط الهواء والبنزين. | • ترتفع الحرارة والضغط في الحجم نفسه. | • يدفع الضغط المكبس إلى الأسفل (من ن.م.ع نحو ن.م.س)."},{"t":"p","fr":"4e temps : ÉCHAPPEMENT | • La soupape d’échappement s’ouvre au PMB. | • Le piston remonte du PMB au PMH et chasse les gaz brûlés. | • La soupape d’échappement se ferme au PMH.","de":"4. Takt: AUSSTOßEN | • Das Auslassventil öffnet am UT. | • Der Kolben bewegt sich vom UT zum OT und schiebt die Abgase hinaus. | • Das Auslassventil schließt am OT.","ar":"الشوط الرابع: العادم | • يُفتح صمام العادم عند ن.م.س. | • يصعد المكبس من ن.م.س إلى ن.م.ع ويطرد الغازات المحترقة. | • يُغلق صمام العادم عند ن.م.ع."},{"t":"rule","fr":"Chaque course du piston = ½ tour moteur. Un cycle complet = 2 tours moteur. | Seul le 3e temps (combustion-détente) fournit de l’énergie : c’est le temps moteur. | Les 3 autres (admission, compression, échappement) sont des temps résistants.","de":"Jeder Kolbenhub = ½ Kurbelwellenumdrehung. Ein ganzer Arbeitsspiel = 2 Umdrehungen. | Nur der 3. Takt (Verbrennen–Arbeiten) liefert Energie: der Arbeitstakt. | Die anderen drei (Ansaugen, Verdichten, Ausstoßen) sind passive (Widerstands-)Takte.","ar":"كل شوط للمكبس = نصف دورة للمحرك. الدورة الكاملة = دورتان للمحرك. | الشوط الثالث وحده (الاحتراق والتمدد) يعطي الطاقة: هو الشوط المحرك. | الأشواط الثلاثة الأخرى (السحب، الانضغاط، العادم) أشواط مقاوِمة."}]},{"id":"tableau-temps","title":{"fr":"Tableau récapitulatif des 4 temps (essence)","de":"Übersichtstabelle der 4 Takte (Benzin)","ar":"جدول ملخص الأشواط الأربعة (بنزين)"},"blocks":[{"t":"p","fr":"O = ouverte, F = fermée. ADM = soupape d’admission, ECH = soupape d’échappement.","de":"A = auf (offen), Z = zu (geschlossen). ADM = Einlassventil, ECH = Auslassventil.","ar":"م = مفتوح، غ = مغلق. سحب = صمام السحب، عادم = صمام العادم."},{"t":"table","head":[{"fr":"Temps","de":"Takt","ar":"الشوط"},{"fr":"Piston","de":"Kolben","ar":"المكبس"},{"fr":"ADM / ECH","de":"ADM / ECH","ar":"ADM / ECH"},{"fr":"Volume","de":"Volumen","ar":"الحجم"},{"fr":"Pression","de":"Druck","ar":"الضغط"},{"fr":"Température","de":"Temperatur","ar":"الحرارة"},{"fr":"Type","de":"Art","ar":"النوع"}],"rows":[[{"fr":"1 Admission","de":"1 Ansaugen","ar":"1 السحب"},{"fr":"PMH → PMB","de":"OT → UT","ar":"ن.م.ع ← ن.م.س"},{"fr":"O / F","de":"A / Z","ar":"م / غ"},{"fr":"Augmente","de":"steigt","ar":"يزداد"},{"fr":"Constante","de":"konstant","ar":"ثابت"},{"fr":"Constante","de":"konstant","ar":"ثابتة"},{"fr":"Résistant","de":"passiv","ar":"مقاوم"}],[{"fr":"2 Compression","de":"2 Verdichten","ar":"2 الانضغاط"},{"fr":"PMB → PMH","de":"UT → OT","ar":"ن.م.س ← ن.م.ع"},{"fr":"F / F","de":"Z / Z","ar":"غ / غ"},{"fr":"Diminue","de":"sinkt","ar":"يقل"},{"fr":"Augmente","de":"steigt","ar":"يزداد"},{"fr":"Augmente","de":"steigt","ar":"تزداد"},{"fr":"Résistant","de":"passiv","ar":"مقاوم"}],[{"fr":"3 Combustion","de":"3 Verbrennen","ar":"3 الاحتراق"},{"fr":"PMH","de":"OT","ar":"ن.م.ع"},{"fr":"F / F","de":"Z / Z","ar":"غ / غ"},{"fr":"Constant","de":"konstant","ar":"ثابت"},{"fr":"Augmente","de":"steigt","ar":"يزداد"},{"fr":"Augmente","de":"steigt","ar":"تزداد"},{"fr":"Moteur","de":"Arbeit","ar":"محرك"}],[{"fr":"3 Détente","de":"3 Arbeiten","ar":"3 التمدد"},{"fr":"PMH → PMB","de":"OT → UT","ar":"ن.م.ع ← ن.م.س"},{"fr":"F / F","de":"Z / Z","ar":"غ / غ"},{"fr":"Augmente","de":"steigt","ar":"يزداد"},{"fr":"Diminue","de":"sinkt","ar":"يقل"},{"fr":"Diminue","de":"sinkt","ar":"تقل"},{"fr":"Moteur","de":"Arbeit","ar":"محرك"}],[{"fr":"4 Échappement","de":"4 Ausstoßen","ar":"4 العادم"},{"fr":"PMB → PMH","de":"UT → OT","ar":"ن.م.س ← ن.م.ع"},{"fr":"F / O","de":"Z / A","ar":"غ / م"},{"fr":"Diminue","de":"sinkt","ar":"يقل"},{"fr":"Diminue","de":"sinkt","ar":"يقل"},{"fr":"Diminue","de":"sinkt","ar":"تقل"},{"fr":"Résistant","de":"passiv","ar":"مقاوم"}]]}]},{"id":"diagramme","title":{"fr":"Le diagramme pression-volume","de":"Das Druck-Volumen-Diagramm","ar":"مخطط الضغط – الحجم"},"blocks":[{"t":"p","fr":"Diagramme théorique (cycle 4 temps essence). Les points A, B, C, D, E : | • A – B Admission : le cylindre se remplit, le piston va vers le PMB, la pression reste constante (environ 1 bar, pression atmosphérique). | • B – C Compression : le piston monte du PMB vers le PMH, la pression atteint environ 10 bars. | • C – D Combustion : l’étincelle déclenche une combustion instantanée, la pression atteint 50 à 60 bars. Le piston n’a pas le temps de se déplacer. | • D – E Détente : la pression chasse le piston vers le PMB et chute jusqu’à environ 4 bars. | • E – A Échappement : la soupape d’échappement s’ouvre, la pression chute à la pression atmosphérique, le piston remonte et repousse le reste des gaz.","de":"Theoretisches Diagramm (Viertakt-Ottomotor). Die Punkte A, B, C, D, E: | • A – B Ansaugen: der Zylinder füllt sich, der Kolben geht zum UT, der Druck bleibt konstant (etwa 1 bar, Atmosphärendruck). | • B – C Verdichten: der Kolben steigt vom UT zum OT, der Druck erreicht etwa 10 bar. | • C – D Verbrennen: der Funke löst eine sofortige Verbrennung aus, der Druck erreicht 50 bis 60 bar. Der Kolben hat keine Zeit, sich zu bewegen. | • D – E Arbeiten (Expansion): der Druck treibt den Kolben zum UT und fällt auf etwa 4 bar. | • E – A Ausstoßen: das Auslassventil öffnet, der Druck fällt auf Atmosphärendruck, der Kolben steigt und schiebt die restlichen Gase hinaus.","ar":"المخطط النظري (دورة رباعية الأشواط للبنزين). النقاط A وB وC وD وE: | • A – B السحب: تمتلئ الأسطوانة، ينزل المكبس نحو ن.م.س، ويبقى الضغط ثابتًا (حوالي 1 بار، الضغط الجوي). | • B – C الانضغاط: يصعد المكبس من ن.م.س إلى ن.م.ع ويصل الضغط إلى حوالي 10 بار. | • C – D الاحتراق: الشرارة تُحدث احتراقًا لحظيًا ويصل الضغط إلى 50 – 60 بار. لا يملك المكبس الوقت ليتحرك. | • D – E التمدد: يدفع الضغط المكبس نحو ن.م.س وينخفض إلى حوالي 4 بار. | • E – A العادم: يُفتح صمام العادم، ينخفض الضغط إلى الضغط الجوي، ويصعد المكبس فيطرد باقي الغازات."},{"t":"table","head":[{"fr":"Phase","de":"Phase","ar":"المرحلة"},{"fr":"Pression (environ)","de":"Druck (ca.)","ar":"الضغط (تقريبًا)"}],"rows":[[{"fr":"Admission","de":"Ansaugen","ar":"السحب"},{"fr":"≈ 1 bar","de":"≈ 1 bar","ar":"≈ 1 بار"}],[{"fr":"Fin de compression","de":"Ende der Verdichtung","ar":"نهاية الانضغاط"},{"fr":"≈ 10 bar","de":"≈ 10 bar","ar":"≈ 10 بار"}],[{"fr":"Après combustion","de":"Nach der Verbrennung","ar":"بعد الاحتراق"},{"fr":"50 – 60 bar","de":"50 – 60 bar","ar":"50 – 60 بار"}],[{"fr":"Fin de détente","de":"Ende der Expansion","ar":"نهاية التمدد"},{"fr":"≈ 4 bar","de":"≈ 4 bar","ar":"≈ 4 بار"}]]}]},{"id":"diesel-4-temps","title":{"fr":"Les 4 temps : moteur Diesel","de":"Die 4 Takte: Dieselmotor","ar":"الأشواط الأربعة: محرك الديزل"},"blocks":[{"t":"anim","kind":"stroke-diesel","frames":[{"fr":"1. Admission : le piston descend, la soupape d’admission est ouverte : seulement de l’AIR entre dans le cylindre.","de":"1. Ansaugen: der Kolben geht nach unten, das Einlassventil ist offen: nur LUFT strömt in den Zylinder.","ar":"1. السحب: ينزل المكبس وصمام السحب مفتوح: يدخل الهواء فقط إلى الأسطوانة."},{"fr":"2. Compression : les soupapes sont fermées, le piston monte, l’air est fortement comprimé et sa température monte beaucoup.","de":"2. Verdichten: die Ventile sind geschlossen, der Kolben steigt, die Luft wird stark verdichtet und sehr heiß.","ar":"2. الانضغاط: الصمامات مغلقة، يصعد المكبس، يُضغط الهواء بشدة وترتفع حرارته كثيرًا."},{"fr":"3. Combustion : à la fin de la compression, l’injecteur pulvérise le gazole dans l’air chaud. Il s’enflamme tout seul (pas de bougie).","de":"3. Verbrennen: am Ende der Verdichtung spritzt die Düse den Diesel in die heiße Luft. Er entzündet sich von selbst (keine Zündkerze).","ar":"3. الاحتراق: في نهاية الانضغاط يرذّ الحاقن الغازوال في الهواء الساخن فيشتعل تلقائيًا (بدون شمعة)."},{"fr":"3. Détente : la pression pousse le piston vers le bas : c’est le temps moteur.","de":"3. Arbeiten: der Druck treibt den Kolben nach unten: das ist der Arbeitstakt.","ar":"3. التمدد: الضغط يدفع المكبس إلى الأسفل: هذا هو الشوط المحرك."},{"fr":"4. Échappement : la soupape d’échappement s’ouvre, le piston remonte, les gaz brûlés sortent.","de":"4. Ausstoßen: das Auslassventil öffnet, der Kolben steigt, die Abgase strömen hinaus.","ar":"4. العادم: يُفتح صمام العادم، يصعد المكبس وتخرج الغازات المحترقة."}],"cap":{"fr":"Animation : les 4 temps du moteur Diesel","de":"Animation: die 4 Takte des Dieselmotors","ar":"رسم متحرك: الأشواط الأربعة لمحرك الديزل"}},{"t":"rule","fr":"Principe : l’air est aspiré puis fortement comprimé. La compression fait monter fortement sa température. Le gazole est injecté dans cet air chaud : il s’enflamme automatiquement, sans bougie d’allumage.","de":"Prinzip: Luft wird angesaugt und stark verdichtet. Durch die Verdichtung steigt ihre Temperatur stark an. Der Diesel wird in diese heiße Luft eingespritzt: er entzündet sich von selbst, ohne Zündkerze.","ar":"المبدأ: يُسحب الهواء ثم يُضغط بشدة. الانضغاط يرفع حرارته كثيرًا. يُحقن الغازوال في هذا الهواء الساخن فيشتعل تلقائيًا بدون شمعة إشعال."},{"t":"p","fr":"1. Admission : le piston descend, la soupape d’admission est ouverte et l’air entre dans le cylindre. | 2. Compression : le piston remonte, les soupapes sont fermées, l’air est comprimé et sa température augmente fortement. | 3. Combustion / détente : à la fin de la compression, l’injecteur pulvérise le gazole dans l’air chaud. Il s’enflamme automatiquement et la pression pousse le piston vers le bas : c’est le temps moteur. | 4. Échappement : le piston remonte, la soupape d’échappement s’ouvre et les gaz brûlés sont évacués.","de":"1. Ansaugen: der Kolben geht nach unten, das Einlassventil ist offen und Luft strömt in den Zylinder. | 2. Verdichten: der Kolben steigt, die Ventile sind geschlossen, die Luft wird verdichtet und ihre Temperatur steigt stark. | 3. Verbrennen / Arbeiten: am Ende der Verdichtung spritzt die Düse den Diesel in die heiße Luft. Er entzündet sich von selbst und der Druck treibt den Kolben nach unten: das ist der Arbeitstakt. | 4. Ausstoßen: der Kolben steigt, das Auslassventil öffnet und die Abgase werden ausgestoßen.","ar":"1. السحب: ينزل المكبس، صمام السحب مفتوح ويدخل الهواء إلى الأسطوانة. | 2. الانضغاط: يصعد المكبس، الصمامات مغلقة، يُضغط الهواء وترتفع حرارته كثيرًا. | 3. الاحتراق / التمدد: في نهاية الانضغاط يرذّ الحاقن الغازوال في الهواء الساخن. يشتعل تلقائيًا ويدفع الضغط المكبس إلى الأسفل: هذا هو الشوط المحرك. | 4. العادم: يصعد المكبس، يُفتح صمام العادم وتُطرد الغازات المحترقة."},{"t":"rule","fr":"À retenir : Admission → Compression → Combustion / détente → Échappement.","de":"Merken: Ansaugen → Verdichten → Verbrennen / Arbeiten → Ausstoßen.","ar":"للحفظ: السحب ← الانضغاط ← الاحتراق / التمدد ← العادم."},{"t":"p","fr":"Transformation du mouvement : le piston a un mouvement alternatif (haut–bas). La bielle transmet ce mouvement au vilebrequin, qui le transforme en rotation, transmise ensuite vers les roues. | Piston (haut–bas) → Bielle → Vilebrequin (rotation).","de":"Umwandlung der Bewegung: der Kolben bewegt sich hin und her (auf–ab). Das Pleuel überträgt diese Bewegung auf die Kurbelwelle, die sie in eine Drehung umwandelt, die dann zu den Rädern geleitet wird. | Kolben (auf–ab) → Pleuel → Kurbelwelle (Drehung).","ar":"تحويل الحركة: للمكبس حركة ترددية (أعلى – أسفل). ينقل ذراع التوصيل هذه الحركة إلى عمود المرفق الذي يحوّلها إلى حركة دورانية تُنقل بعد ذلك إلى العجلات. | المكبس (أعلى–أسفل) ← ذراع التوصيل ← عمود المرفق (دوران)."}]},{"id":"exercices-cycle","title":{"fr":"Exercices de calcul","de":"Rechenübungen","ar":"تمارين حسابية"},"blocks":[{"t":"qa","items":[{"q":{"fr":"Pendant un cycle complet, combien de tours fait le vilebrequin ? Quel angle ?","de":"Wie viele Umdrehungen macht die Kurbelwelle während eines vollständigen Arbeitsspiels? Welcher Winkel?","ar":"كم دورة يقوم بها عمود المرفق خلال دورة كاملة؟ وما الزاوية؟"},"a":{"fr":"2 tours, soit 720°.","de":"2 Umdrehungen, also 720°.","ar":"دورتان، أي 720°."}},{"q":{"fr":"Combien de tours fait l’arbre à cames pendant ce temps ? Quel angle ?","de":"Wie viele Umdrehungen macht die Nockenwelle in dieser Zeit? Welcher Winkel?","ar":"كم دورة يقوم بها عمود الكامات خلال هذا الوقت؟ وما الزاوية؟"},"a":{"fr":"1 tour, soit 360°.","de":"1 Umdrehung, also 360°.","ar":"دورة واحدة، أي 360°."}},{"q":{"fr":"Moteur 4 cylindres en ligne à 3000 tr/min : combien de fois par seconde une soupape d’admission (ou d’échappement) s’ouvre-t-elle ?","de":"Vierzylinder-Reihenmotor bei 3000 U/min: Wie oft pro Sekunde öffnet sich ein Einlassventil (oder Auslassventil)?","ar":"محرك 4 أسطوانات على خط واحد يدور بـ 3000 دورة/دقيقة: كم مرة في الثانية يُفتح صمام السحب (أو العادم)؟"},"a":{"fr":"Une soupape s’ouvre 1 fois pour 2 tours de vilebrequin : 3000 / 2 = 1500 fois par minute. En secondes : 1500 / 60 = 25 fois par seconde.","de":"Ein Ventil öffnet 1-mal pro 2 Kurbelwellenumdrehungen: 3000 / 2 = 1500-mal pro Minute. In Sekunden: 1500 / 60 = 25-mal pro Sekunde.","ar":"يُفتح الصمام مرة واحدة كل دورتين للمرفق: 3000 / 2 = 1500 مرة في الدقيقة. بالثواني: 1500 / 60 = 25 مرة في الثانية."}},{"q":{"fr":"En combien de temps un cycle moteur est-il effectué ?","de":"In welcher Zeit wird ein Arbeitsspiel ausgeführt?","ar":"في كم من الوقت تتم دورة المحرك الواحدة؟"},"a":{"fr":"1 cycle = 2 tours de vilebrequin = 1500 cycles par minute. Donc 60 / 1500 = 0,04 seconde par cycle.","de":"1 Arbeitsspiel = 2 Kurbelwellenumdrehungen = 1500 Arbeitsspiele pro Minute. Also 60 / 1500 = 0,04 Sekunden pro Arbeitsspiel.","ar":"الدورة الواحدة = دورتان للمرفق = 1500 دورة في الدقيقة. إذن 60 / 1500 = 0.04 ثانية للدورة الواحدة."}},{"q":{"fr":"Quel est l’ordre de fonctionnement (ordre d’allumage) de ce moteur 4 cylindres ?","de":"Wie lautet die Zündfolge dieses Vierzylindermotors?","ar":"ما هو ترتيب الإشعال في هذا المحرك ذي 4 أسطوانات؟"},"a":{"fr":"On regarde l’ordre des combustions à partir du cylindre 1 : après le 1 vient le 3, puis le 4, puis le 2. Ordre d’allumage : 1 – 3 – 4 – 2.","de":"Man betrachtet die Reihenfolge der Verbrennungen ab Zylinder 1: nach 1 kommt 3, dann 4, dann 2. Zündfolge: 1 – 3 – 4 – 2.","ar":"ننظر إلى ترتيب الاحتراق بدءًا من الأسطوانة 1: بعد 1 تأتي 3 ثم 4 ثم 2. ترتيب الإشعال: 1 – 3 – 4 – 2."}}]}]}]},{"id":"diesel-essence","n":3,"title":{"fr":"Diesel ou essence ?","de":"Diesel oder Benzin?","ar":"ديزل أم بنزين؟"},"goals":{"fr":"Comparer moteur Diesel et moteur essence | Comprendre l’injection (directe, indirecte, Common Rail) | Répondre aux questions de révision","de":"Diesel- und Benzinmotor vergleichen | Die Einspritzung verstehen (direkt, indirekt, Common Rail) | Die Wiederholungsfragen beantworten","ar":"مقارنة محرك الديزل ومحرك البنزين | فهم الحقن (مباشر، غير مباشر، السكة المشتركة) | الإجابة عن أسئلة المراجعة"},"topics":[{"id":"difference","title":{"fr":"Différence entre Diesel et essence","de":"Unterschied zwischen Diesel und Benzin","ar":"الفرق بين الديزل والبنزين"},"blocks":[{"t":"table","head":[{"fr":"Élément","de":"Merkmal","ar":"العنصر"},{"fr":"Moteur Diesel","de":"Dieselmotor","ar":"محرك الديزل"},{"fr":"Moteur essence","de":"Benzinmotor","ar":"محرك البنزين"}],"rows":[[{"fr":"Carburant","de":"Kraftstoff","ar":"الوقود"},{"fr":"Gazole","de":"Diesel","ar":"الغازوال"},{"fr":"Essence","de":"Benzin","ar":"البنزين"}],[{"fr":"Mélange air-carburant","de":"Luft-Kraftstoff-Gemisch","ar":"خليط الهواء والوقود"},{"fr":"Seulement de l’air dans le cylindre (le carburant est injecté à la fin de la compression)","de":"Nur Luft im Zylinder (der Kraftstoff wird am Ende der Verdichtung eingespritzt)","ar":"هواء فقط في الأسطوانة (الوقود يُحقن في نهاية الانضغاط)"},{"fr":"Mélange air-essence (préparé avant l’admission ou injecté directement)","de":"Luft-Benzin-Gemisch (vor dem Ansaugen gebildet oder direkt eingespritzt)","ar":"خليط هواء-بنزين (يُحضَّر قبل السحب أو يُحقن مباشرة)"}],[{"fr":"Mode d’allumage","de":"Zündart","ar":"طريقة الإشعال"},{"fr":"Auto-inflammation par compression (pas de bougie)","de":"Selbstzündung durch Verdichtung (keine Zündkerze)","ar":"اشتعال ذاتي بالانضغاط (بدون شمعة)"},{"fr":"Allumage par bougie d’allumage (étincelle)","de":"Zündung durch Zündkerze (Funke)","ar":"إشعال بشمعة الإشعال (شرارة)"}],[{"fr":"Système d’injection","de":"Einspritzsystem","ar":"نظام الحقن"},{"fr":"Injection directe à haute pression (Common Rail)","de":"Direkteinspritzung mit Hochdruck (Common Rail)","ar":"حقن مباشر بضغط عالٍ (السكة المشتركة)"},{"fr":"Injection indirecte ou directe (basse ou haute pression)","de":"Indirekte oder direkte Einspritzung (Nieder- oder Hochdruck)","ar":"حقن غير مباشر أو مباشر (ضغط منخفض أو عالٍ)"}],[{"fr":"Taux de compression","de":"Verdichtungsverhältnis","ar":"نسبة الانضغاط"},{"fr":"Élevé (environ 16:1 à 22:1)","de":"Hoch (etwa 16:1 bis 22:1)","ar":"مرتفعة (حوالي 16:1 إلى 22:1)"},{"fr":"Plus faible (environ 8:1 à 12:1)","de":"Niedriger (etwa 8:1 bis 12:1)","ar":"أقل (حوالي 8:1 إلى 12:1)"}],[{"fr":"Bougie d’allumage","de":"Zündkerze","ar":"شمعة الإشعال"},{"fr":"Non","de":"Nein","ar":"لا"},{"fr":"Oui","de":"Ja","ar":"نعم"}],[{"fr":"Pression d’injection","de":"Einspritzdruck","ar":"ضغط الحقن"},{"fr":"Très élevée (jusqu’à 2000 bar)","de":"Sehr hoch (bis zu 2000 bar)","ar":"مرتفع جدًا (حتى 2000 بار)"},{"fr":"Plus faible (environ 3 à 200 bar selon le système)","de":"Niedriger (etwa 3 bis 200 bar je nach System)","ar":"أقل (حوالي 3 إلى 200 بار حسب النظام)"}],[{"fr":"Type de combustion","de":"Verbrennungsart","ar":"نوع الاحتراق"},{"fr":"Combustion par compression","de":"Verbrennung durch Verdichtung","ar":"احتراق بالانضغاط"},{"fr":"Combustion par étincelle","de":"Verbrennung durch Funken","ar":"احتراق بالشرارة"}]]},{"t":"rule","fr":"Remarque : un moteur Diesel peut avoir des bougies de préchauffage. Elles aident surtout le démarrage à froid ; elles ne produisent pas l’étincelle d’allumage d’un moteur essence.","de":"Hinweis: Ein Dieselmotor kann Glühkerzen haben. Sie helfen vor allem beim Kaltstart; sie erzeugen nicht den Zündfunken eines Benzinmotors.","ar":"ملاحظة: قد يحتوي محرك الديزل على شمعات تسخين مسبق. تساعد خاصة في التشغيل على البارد؛ وهي لا تُنتج شرارة الإشعال كما في محرك البنزين."},{"t":"terms","items":[{"a":"der","de":"Dieselmotor","fr":"Moteur Diesel","ar":"محرك الديزل","r":null,"au":"eabe345b2c96"},{"a":"der","de":"Ottomotor","fr":"Moteur essence (allumage commandé)","ar":"محرك البنزين","r":null,"au":"1883dae7582f"},{"a":"der","de":"Kraftstoff","fr":"Carburant","ar":"الوقود","r":null,"au":"b58928c5b29f"},{"a":"der","de":"Diesel","fr":"Gazole","ar":"الغازوال","r":null,"au":"c425e072fc33"},{"a":"das","de":"Benzin","fr":"Essence","ar":"البنزين","r":null,"au":"711cdbbdb943"},{"a":"die","de":"Selbstzündung","fr":"Auto-inflammation","ar":"الاشتعال الذاتي","r":null,"au":"cf793e02b5ec"},{"a":"die","de":"Fremdzündung","fr":"Allumage commandé","ar":"الإشعال بشرارة خارجية","r":null,"au":"dad59d3ea479"},{"a":"das","de":"Verdichtungsverhältnis","fr":"Taux de compression","ar":"نسبة الانضغاط","r":null,"au":"a33739009c71"},{"a":"der","de":"Einspritzdruck","fr":"Pression d’injection","ar":"ضغط الحقن","r":null,"au":"5f95743060e3"}]}]},{"id":"injection","title":{"fr":"L’injection : Diesel et essence","de":"Die Einspritzung: Diesel und Benzin","ar":"الحقن: ديزل وبنزين"},"blocks":[{"t":"fig","src":"img/diesel-essence-injection.jpg","cap":{"fr":"Injection du moteur Diesel et du moteur essence – différences et types d’injection","de":"Einspritzung beim Diesel- und Benzinmotor – Unterschiede und Einspritzarten","ar":"الحقن في محرك الديزل ومحرك البنزين – الفروق وأنواع الحقن"}},{"t":"p","fr":"Moteur Diesel : le gazole est injecté directement dans la chambre de combustion à haute pression. | Chemin du gazole : réservoir de gazole → filtre à gazole → pompe haute pression → rampe commune (Common Rail) → injecteurs → chambre de combustion.","de":"Dieselmotor: der Diesel wird mit hohem Druck direkt in den Brennraum eingespritzt. | Weg des Diesels: Dieseltank → Dieselfilter → Hochdruckpumpe → Verteilerleiste (Common Rail) → Einspritzdüsen → Brennraum.","ar":"محرك الديزل: يُحقن الغازوال مباشرة في غرفة الاحتراق بضغط عالٍ. | مسار الغازوال: خزان الغازوال ← مرشح الغازوال ← المضخة عالية الضغط ← السكة المشتركة (Common Rail) ← الحواقن ← غرفة الاحتراق."},{"t":"p","fr":"Moteur essence : l’essence est injectée soit dans le conduit d’admission (injection indirecte), soit directement dans la chambre de combustion (injection directe). | Chemin de l’essence : réservoir d’essence → pompe à carburant (basse pression) → filtre à essence → rampe d’injection → injecteurs.","de":"Benzinmotor: das Benzin wird entweder in den Ansaugkanal (indirekte Einspritzung) oder direkt in den Brennraum (Direkteinspritzung) eingespritzt. | Weg des Benzins: Benzintank → Kraftstoffpumpe (Niederdruck) → Benzinfilter → Einspritzleiste → Einspritzventile.","ar":"محرك البنزين: يُحقن البنزين إما في قناة السحب (حقن غير مباشر) وإما مباشرة في غرفة الاحتراق (حقن مباشر). | مسار البنزين: خزان البنزين ← مضخة الوقود (ضغط منخفض) ← مرشح البنزين ← سكة الحقن ← الحواقن."},{"t":"p","fr":"Injection indirecte (essence) : l’injecteur envoie l’essence dans le conduit d’admission (collecteur). Le mélange air-essence entre ensuite dans le cylindre par la soupape d’admission. | Injection directe (essence) : l’injecteur envoie l’essence directement dans la chambre de combustion.","de":"Indirekte Einspritzung (Benzin): das Einspritzventil spritzt das Benzin in den Ansaugkanal (Saugrohr). Das Luft-Benzin-Gemisch gelangt dann durch das Einlassventil in den Zylinder. | Direkteinspritzung (Benzin): das Einspritzventil spritzt das Benzin direkt in den Brennraum.","ar":"الحقن غير المباشر (بنزين): يرسل الحاقن البنزين إلى قناة السحب (المشعب). ثم يدخل خليط الهواء والبنزين إلى الأسطوانة عبر صمام السحب. | الحقن المباشر (بنزين): يرسل الحاقن البنزين مباشرة إلى غرفة الاحتراق."},{"t":"terms","items":[{"a":"der","de":"Kraftstofftank","fr":"Réservoir de carburant","ar":"خزان الوقود","r":null,"au":"3980b9211fc4"},{"a":"der","de":"Dieselfilter","fr":"Filtre à gazole","ar":"مرشح الغازوال","r":null,"au":"f14d80dbb82f"},{"a":"die","de":"Hochdruckpumpe","fr":"Pompe haute pression","ar":"المضخة عالية الضغط","r":null,"au":"0acb67b70203"},{"a":"das","de":"Common-Rail","fr":"Rampe commune (Common Rail)","ar":"السكة المشتركة (كومون ريل)","r":null,"au":"89b853ddc2af"},{"a":"die","de":"Einspritzdüse","fr":"Injecteur","ar":"الحاقن","r":null,"au":"0d9dd5a618f0"},{"a":"die","de":"Kraftstoffpumpe","fr":"Pompe à carburant (basse pression)","ar":"مضخة الوقود (ضغط منخفض)","r":null,"au":"48e0774347fc"},{"a":"der","de":"Benzinfilter","fr":"Filtre à essence","ar":"مرشح البنزين","r":null,"au":"f263503400af"},{"a":"die","de":"Einspritzleiste","fr":"Rampe d’injection","ar":"سكة الحقن","r":null,"au":"6bbf85db49d1"},{"a":"die","de":"indirekte Einspritzung","fr":"Injection indirecte","ar":"الحقن غير المباشر","r":null,"au":"148e1570a7ad"},{"a":"die","de":"Direkteinspritzung","fr":"Injection directe","ar":"الحقن المباشر","r":null,"au":"7cdf49f65096"},{"a":"der","de":"Ansaugkanal","fr":"Conduit d’admission (collecteur)","ar":"قناة السحب (المشعب)","r":null,"au":"62e6dd13ef8e"}]}]},{"id":"revision-diesel","title":{"fr":"Questions de révision","de":"Wiederholungsfragen","ar":"أسئلة المراجعة"},"blocks":[{"t":"qa","items":[{"q":{"fr":"Quel est le rôle du moteur ?","de":"Welche Aufgabe hat der Motor?","ar":"ما هو دور المحرك؟"},"a":{"fr":"Transformer l’énergie chimique du carburant en énergie mécanique pour faire avancer le véhicule.","de":"Die chemische Energie des Kraftstoffs in mechanische Energie umwandeln, um das Fahrzeug zu bewegen.","ar":"تحويل الطاقة الكيميائية للوقود إلى طاقة ميكانيكية لتحريك السيارة."}},{"q":{"fr":"Quels sont les quatre temps du moteur Diesel ?","de":"Welche vier Takte hat der Dieselmotor?","ar":"ما هي الأشواط الأربعة لمحرك الديزل؟"},"a":{"fr":"Admission → Compression → Combustion / détente → Échappement.","de":"Ansaugen → Verdichten → Verbrennen / Arbeiten → Ausstoßen.","ar":"السحب ← الانضغاط ← الاحتراق / التمدد ← العادم."}},{"q":{"fr":"Que se passe-t-il pendant la compression ?","de":"Was passiert beim Verdichten?","ar":"ماذا يحدث أثناء الانضغاط؟"},"a":{"fr":"Le piston remonte, les soupapes sont fermées, l’air est comprimé et sa température augmente fortement.","de":"Der Kolben steigt, die Ventile sind geschlossen, die Luft wird verdichtet und ihre Temperatur steigt stark.","ar":"يصعد المكبس، الصمامات مغلقة، يُضغط الهواء وترتفع حرارته كثيرًا."}},{"q":{"fr":"Quel est le rôle de l’injecteur ?","de":"Welche Aufgabe hat die Einspritzdüse?","ar":"ما هو دور الحاقن؟"},"a":{"fr":"Pulvériser le gazole dans la chambre de combustion.","de":"Den Diesel fein zerstäubt in den Brennraum spritzen.","ar":"رذّ الغازوال في غرفة الاحتراق."}},{"q":{"fr":"Quel élément relie le piston au vilebrequin ?","de":"Welches Teil verbindet den Kolben mit der Kurbelwelle?","ar":"ما هو العنصر الذي يربط المكبس بعمود المرفق؟"},"a":{"fr":"La bielle.","de":"Das Pleuel.","ar":"ذراع التوصيل."}},{"q":{"fr":"Quel est le mouvement du piston ? Et celui du vilebrequin ?","de":"Wie bewegt sich der Kolben? Und die Kurbelwelle?","ar":"ما هي حركة المكبس؟ وما هي حركة عمود المرفق؟"},"a":{"fr":"Le piston : mouvement alternatif (haut–bas). Le vilebrequin : mouvement de rotation.","de":"Kolben: Hin-und-Her-Bewegung (auf–ab). Kurbelwelle: Drehbewegung.","ar":"المكبس: حركة ترددية (أعلى–أسفل). عمود المرفق: حركة دورانية."}},{"q":{"fr":"Quelle est la principale différence d’allumage entre un moteur Diesel et un moteur essence ?","de":"Was ist der Hauptunterschied bei der Zündung zwischen Diesel- und Benzinmotor?","ar":"ما هو الفرق الرئيسي في الإشعال بين محرك الديزل ومحرك البنزين؟"},"a":{"fr":"Diesel : auto-inflammation par compression. Essence : allumage commandé par bougie (étincelle).","de":"Diesel: Selbstzündung durch Verdichtung. Benzin: Fremdzündung durch Zündkerze (Funke).","ar":"ديزل: اشتعال ذاتي بالانضغاط. بنزين: إشعال بالشرارة بواسطة الشمعة."}}]},{"t":"rule","fr":"Résumé : dans le moteur Diesel, l’air entre, il est comprimé et chauffé, le gazole est injecté et s’enflamme, puis les gaz brûlés sont évacués. Le mouvement du piston est transformé en rotation par l’ensemble bielle-vilebrequin.","de":"Zusammenfassung: Im Dieselmotor strömt Luft ein, sie wird verdichtet und erhitzt, der Diesel wird eingespritzt und entzündet sich, dann werden die Abgase ausgestoßen. Die Kolbenbewegung wird durch Pleuel und Kurbelwelle in Drehung umgewandelt.","ar":"الخلاصة: في محرك الديزل يدخل الهواء ثم يُضغط ويسخن، ثم يُحقن الغازوال فيشتعل، بعدها تُطرد الغازات المحترقة. تتحول حركة المكبس إلى دوران بواسطة مجموعة ذراع التوصيل وعمود المرفق."}]}]},{"id":"lubrification","n":4,"title":{"fr":"Le circuit d’huile (lubrification)","de":"Der Ölkreislauf (Schmierung)","ar":"دورة الزيت (التزييت)"},"goals":{"fr":"Comprendre pourquoi le moteur a besoin d’huile | Suivre le chemin de l’huile pas à pas | Connaître le rôle de chaque pièce du circuit | Expliquer le filtre, le by-pass, le limiteur de pression et le manocontact","de":"Verstehen, warum der Motor Öl braucht | Den Weg des Öls Schritt für Schritt verfolgen | Die Aufgabe jedes Bauteils im Kreislauf kennen | Filter, Bypass, Druckbegrenzer und Öldruckschalter erklären","ar":"فهم لماذا يحتاج المحرك إلى الزيت | تتبّع مسار الزيت خطوة بخطوة | معرفة دور كل قطعة في الدورة | شرح المرشح والمجرى الجانبي ومحدّد الضغط ومفتاح ضغط الزيت"},"topics":[{"id":"lub-role","title":{"fr":"Leçon 1 – Pourquoi lubrifier ?","de":"Lektion 1 – Warum schmieren?","ar":"الدرس 1 – لماذا نزيّت؟"},"blocks":[{"t":"teach","fr":"Imagine deux pièces métalliques qui frottent l’une contre l’autre à grande vitesse. Sans huile, elles chauffent, s’usent et font du bruit. L’huile crée une fine pellicule entre elles : c’est le graissage.","de":"Stell dir zwei Metallteile vor, die mit hoher Geschwindigkeit aneinander reiben. Ohne Öl werden sie heiß, verschleißen und sind laut. Das Öl bildet einen dünnen Film dazwischen: das ist die Schmierung.","ar":"تخيّل قطعتين معدنيتين تحتكان ببعضهما بسرعة كبيرة. بدون زيت تسخنان وتتآكلان وتُصدران ضجيجًا. الزيت يشكّل طبقة رقيقة بينهما: هذا هو التزييت."},{"t":"p","fr":"Le graissage a pour but : | 1. Diminuer les frottements et les bruits des pièces. | 2. Refroidir certains éléments du moteur. | 3. Débarrasser le moteur de ses impuretés. | 4. Protéger les pièces contre la corrosion.","de":"Die Schmierung hat folgende Aufgaben: | 1. Reibung und Geräusche der Teile verringern. | 2. Einige Motorteile kühlen. | 3. Den Motor von Verunreinigungen befreien. | 4. Die Teile vor Korrosion schützen.","ar":"هدف التزييت: | 1. تقليل الاحتكاك والضجيج بين القطع. | 2. تبريد بعض أجزاء المحرك. | 3. تنظيف المحرك من الشوائب. | 4. حماية القطع من التآكل (الصدأ)."},{"t":"terms","h":{"fr":"Mots à retenir","de":"Wörter zum Merken","ar":"كلمات يجب حفظها"},"items":[{"a":"die","de":"Schmierung","fr":"Lubrification (graissage)","ar":"التزييت","r":null,"au":"106ca5a593ac"},{"a":"das","de":"Öl","fr":"Huile","ar":"الزيت","r":null,"au":"da0fde798fa0"},{"a":"die","de":"Reibung","fr":"Frottement","ar":"الاحتكاك","r":null,"au":"a1f3413935f7"},{"a":"der","de":"Verschleiß","fr":"Usure","ar":"التآكل (البلى)","r":null,"au":"79834a597741"},{"a":"die","de":"Verunreinigung","fr":"Impureté","ar":"الشوائب","r":null,"au":"8fbd7ded4aa7"},{"a":"die","de":"Korrosion","fr":"Corrosion","ar":"الصدأ (التآكل الكيميائي)","r":null,"au":"6e716f36e695"},{"a":"der","de":"Ölfilm","fr":"Pellicule d’huile","ar":"طبقة الزيت الرقيقة","r":null,"au":"ce43a22e27f6"}]},{"t":"mcq","q":{"fr":"Quel est un rôle de l’huile moteur ?","de":"Welche Aufgabe hat das Motoröl?","ar":"ما هو أحد أدوار زيت المحرك؟"},"opts":[{"fr":"Diminuer les frottements","de":"Reibung verringern","ar":"تقليل الاحتكاك"},{"fr":"Augmenter la vitesse du véhicule","de":"Die Geschwindigkeit des Fahrzeugs erhöhen","ar":"زيادة سرعة السيارة"},{"fr":"Allumer le mélange","de":"Das Gemisch entzünden","ar":"إشعال الخليط"}],"ans":0}]},{"id":"lub-principe","title":{"fr":"Leçon 2 – Le chemin de l’huile pas à pas","de":"Lektion 2 – Der Weg des Öls Schritt für Schritt","ar":"الدرس 2 – مسار الزيت خطوة بخطوة"},"blocks":[{"t":"anim","kind":"oil","cap":{"fr":"Animation : le chemin de l’huile","de":"Animation: der Weg des Öls","ar":"رسم متحرك: مسار الزيت"},"frames":[{"fr":"L’huile est stockée dans le carter d’huile : c’est le réservoir.","de":"Das Öl ist in der Ölwanne gespeichert: sie ist der Behälter.","ar":"الزيت مخزّن في حوض الزيت: هو الخزان."},{"fr":"La crépine arrête les grosses impuretés, puis la pompe aspire l’huile et la met sous pression.","de":"Das Sieb hält grobe Verunreinigungen zurück, dann saugt die Pumpe das Öl an und setzt es unter Druck.","ar":"الشبكة تمنع الشوائب الكبيرة ثم تسحب المضخة الزيت وتضغطه."},{"fr":"La soupape de décharge renvoie l’excédent au carter si la pression est trop forte. L’huile passe dans le filtre.","de":"Das Überdruckventil leitet bei zu hohem Druck den Überschuss zurück. Das Öl strömt durch den Filter.","ar":"صمام التفريغ يعيد الزائد إلى الحوض إذا كان الضغط مرتفعًا. ثم يمر الزيت في المرشح."},{"fr":"L’huile propre arrive dans la galerie principale qui la distribue.","de":"Das saubere Öl gelangt in die Hauptgalerie, die es verteilt.","ar":"يصل الزيت النظيف إلى المجرى الرئيسي الذي يوزّعه."},{"fr":"Elle lubrifie les paliers du vilebrequin et de bielle, l’arbre à cames et les poussoirs.","de":"Es schmiert die Kurbelwellen- und Pleuellager, die Nockenwelle und die Stößel.","ar":"يزيّت مساند عمود المرفق وذراع التوصيل وعمود الكامات والرافعات."},{"fr":"L’huile retombe dans le carter et le cycle recommence.","de":"Das Öl fließt in die Ölwanne zurück und der Kreislauf beginnt von vorn.","ar":"يعود الزيت إلى الحوض وتبدأ الدورة من جديد."}]},{"t":"teach","fr":"Dans la lubrification sous pression, l’huile est aspirée dans le carter par la pompe, mise sous pression, puis envoyée vers tous les éléments à lubrifier par la rampe principale. Suivons-la ensemble.","de":"Bei der Druckumlaufschmierung wird das Öl von der Pumpe aus der Ölwanne angesaugt, unter Druck gesetzt und über die Hauptölleitung zu allen Schmierstellen geschickt. Verfolgen wir den Weg gemeinsam.","ar":"في التزييت تحت الضغط، تسحب المضخة الزيت من الحوض وتضغطه ثم ترسله عبر القناة الرئيسية إلى جميع الأجزاء المراد تزييتها. لنتبعه معًا."},{"t":"fig","src":"img/lubrification-2.jpg","cap":{"fr":"Circuit de lubrification d’un moteur Diesel : flèches jaunes = huile sous pression, flèches noires = retour au carter","de":"Schmierkreislauf eines Dieselmotors: gelbe Pfeile = Öl unter Druck, schwarze Pfeile = Rücklauf zur Ölwanne","ar":"دورة تزييت محرك ديزل: الأسهم الصفراء = زيت تحت الضغط، الأسهم السوداء = رجوع الزيت إلى الحوض"}},{"t":"steps","items":[{"title":{"fr":"Le carter d’huile","de":"Die Ölwanne","ar":"حوض الزيت"},"text":{"fr":"L’huile est stockée dans le carter. Il sert de réservoir.","de":"Das Öl ist in der Ölwanne gespeichert. Sie dient als Behälter.","ar":"يُخزَّن الزيت في الحوض. فهو يعمل كخزان."}},{"title":{"fr":"La crépine d’aspiration","de":"Das Ansaugsieb","ar":"شبكة السحب"},"text":{"fr":"Avant la pompe, un filtre grossier arrête les grosses impuretés.","de":"Vor der Pumpe hält ein grobes Sieb die großen Verunreinigungen zurück.","ar":"قبل المضخة، مرشح خشن يمنع الشوائب الكبيرة من الدخول."}},{"title":{"fr":"La pompe à huile","de":"Die Ölpumpe","ar":"مضخة الزيت"},"text":{"fr":"Elle aspire l’huile du carter et la met sous pression pour la faire circuler dans tout le circuit.","de":"Sie saugt das Öl aus der Ölwanne an und setzt es unter Druck, damit es im ganzen Kreislauf zirkuliert.","ar":"تسحب الزيت من الحوض وتضغطه ليدور في كامل الدورة."}},{"title":{"fr":"La soupape de décharge","de":"Das Überdruckventil","ar":"صمام التفريغ (التنظيم)"},"text":{"fr":"Si la pression devient trop forte, elle s’ouvre et renvoie l’excédent d’huile au carter.","de":"Wird der Druck zu hoch, öffnet es und leitet das überschüssige Öl zurück in die Ölwanne.","ar":"إذا ارتفع الضغط كثيرًا ينفتح ويعيد الزيت الزائد إلى الحوض."}},{"title":{"fr":"Le filtre à huile","de":"Der Ölfilter","ar":"مرشح الزيت"},"text":{"fr":"Il élimine les impuretés fines pour garder l’huile propre.","de":"Er entfernt feine Verunreinigungen, damit das Öl sauber bleibt.","ar":"يزيل الشوائب الدقيقة للحفاظ على نظافة الزيت."}},{"title":{"fr":"Le refroidisseur d’huile","de":"Der Ölkühler","ar":"مبرّد الزيت"},"text":{"fr":"Il refroidit l’huile pour maintenir une température idéale.","de":"Er kühlt das Öl, um eine ideale Temperatur zu halten.","ar":"يبرّد الزيت للحفاظ على درجة حرارة مثالية."}},{"title":{"fr":"La galerie principale","de":"Die Hauptölgalerie","ar":"المجرى الرئيسي للزيت"},"text":{"fr":"Elle distribue l’huile sous pression vers les différents organes.","de":"Sie verteilt das Öl unter Druck auf die verschiedenen Bauteile.","ar":"توزّع الزيت المضغوط نحو مختلف الأعضاء."}},{"title":{"fr":"Paliers de vilebrequin et de bielle","de":"Kurbelwellen- und Pleuellager","ar":"مساند عمود المرفق وذراع التوصيل"},"text":{"fr":"L’huile réduit la friction entre le vilebrequin et le bloc, et entre la bielle et le maneton.","de":"Das Öl verringert die Reibung zwischen Kurbelwelle und Block sowie zwischen Pleuel und Hubzapfen.","ar":"الزيت يقلل الاحتكاك بين عمود المرفق والكتلة، وبين ذراع التوصيل ومحور المرفق."}},{"title":{"fr":"Arbre à cames et poussoirs hydrauliques","de":"Nockenwelle und Hydrostößel","ar":"عمود الكامات والرافعات الهيدروليكية"},"text":{"fr":"L’huile lubrifie les cames et leurs paliers et fait fonctionner les poussoirs hydrauliques (soupapes sans jeu).","de":"Das Öl schmiert die Nocken und ihre Lager und betreibt die Hydrostößel (Ventile ohne Spiel).","ar":"الزيت يزيّت الكامات ومساندها ويشغّل الرافعات الهيدروليكية (صمامات بدون خلوص)."}},{"title":{"fr":"Le retour au carter","de":"Der Rücklauf zur Ölwanne","ar":"الرجوع إلى الحوض"},"text":{"fr":"L’huile retombe dans le carter et le cycle recommence.","de":"Das Öl fließt in die Ölwanne zurück und der Kreislauf beginnt von vorn.","ar":"يعود الزيت إلى الحوض وتبدأ الدورة من جديد."}}]},{"t":"rule","fr":"Chemin à retenir : carter → crépine → pompe → (soupape de décharge) → filtre → (refroidisseur) → galerie principale → paliers / arbre à cames / poussoirs → retour au carter.","de":"Weg zum Merken: Ölwanne → Sieb → Pumpe → (Überdruckventil) → Filter → (Kühler) → Hauptgalerie → Lager / Nockenwelle / Stößel → zurück zur Ölwanne.","ar":"المسار للحفظ: الحوض ← الشبكة ← المضخة ← (صمام التفريغ) ← المرشح ← (المبرّد) ← المجرى الرئيسي ← المساند / الكامات / الرافعات ← الرجوع إلى الحوض."},{"t":"mcq","q":{"fr":"Quelle pièce met l’huile sous pression ?","de":"Welches Teil setzt das Öl unter Druck?","ar":"أي قطعة تضغط الزيت؟"},"opts":[{"fr":"La pompe à huile","de":"Die Ölpumpe","ar":"مضخة الزيت"},{"fr":"Le filtre à huile","de":"Der Ölfilter","ar":"مرشح الزيت"},{"fr":"La crépine","de":"Das Ansaugsieb","ar":"الشبكة"}],"ans":0}]},{"id":"lub-organes","title":{"fr":"Leçon 3 – Les pièces du circuit (mots et rôles)","de":"Lektion 3 – Die Bauteile des Kreislaufs (Wörter und Aufgaben)","ar":"الدرس 3 – قطع الدورة (الكلمات والأدوار)"},"blocks":[{"t":"fig","src":"img/lubrification-1.jpg","cap":{"fr":"Schéma complet avec les 12 organes numérotés (français + arabe)","de":"Gesamtschema mit den 12 nummerierten Bauteilen (Französisch + Arabisch)","ar":"مخطط كامل مع الأعضاء الاثني عشر المرقمة (فرنسي + عربي)"}},{"t":"terms","h":{"fr":"Les 12 organes","de":"Die 12 Bauteile","ar":"الأعضاء الاثنا عشر"},"items":[{"a":"die","de":"Ölwanne","fr":"1. Carter d’huile (réservoir)","ar":"حوض الزيت (الخزان)","r":{"fr":"Contient l’huile de lubrification et sert de réservoir.","de":"Enthält das Schmieröl und dient als Behälter.","ar":"يحتوي على زيت التزييت ويعمل كخزان."},"au":"d431960b4e3b"},{"a":"das","de":"Ansaugsieb","fr":"2. Crépine d’aspiration","ar":"شبكة السحب","r":{"fr":"Filtre grossier : empêche les grosses impuretés d’entrer dans la pompe.","de":"Grobes Sieb: hält große Verunreinigungen von der Pumpe fern.","ar":"مرشح خشن يمنع الشوائب الكبيرة من الدخول إلى المضخة."},"au":"4f5d977380fb"},{"a":"die","de":"Ölpumpe","fr":"3. Pompe à huile","ar":"مضخة الزيت","r":{"fr":"Aspire l’huile du carter et la met sous pression.","de":"Saugt das Öl a
